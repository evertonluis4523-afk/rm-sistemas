<style id="rmTemaRM">
/* ===========================================================================
   TEMA RM · aparência única -- igual em todos os sistemas.

   Fonte única: central_rm/comum/tema-rm.html. Não se edita dentro de um
   sistema; muda aqui e roda ferramentas/aplica_comum.py.

   Cada sistema nasceu com o seu botão, o seu campo e a sua tabela: cantos de
   7 a 11 px, botões de 31 a 44 px de altura, letra de 13 a 15, cabeçalho de
   tabela de 10 a 14 px, três sombras de cartão diferentes. A cor já era quase
   a mesma; o resto não. Aqui mora a decisão UMA vez:

   1. As MEDIDAS (variáveis --rm-*): cor, canto, altura, letra, sombra.
      Mudar uma delas muda os quinze sistemas juntos.
   2. Os nomes antigos de cada sistema (--red, --ink, --line...) passam a
      apontar para elas -- o CSS de cada um continua valendo, mas com a
      medida da casa.
   3. Os COMPONENTES: botão, campo, cabeçalho de tabela, cartão.

   O que este bloco NÃO toca, de propósito: display, posição, largura,
   margem. Ele decide a APARÊNCIA; quem decide onde a peça fica e se ela
   aparece é o sistema. Assim um .hide{display:none} continua escondendo, e
   um botão de largura inteira continua inteiro.

   Força: o "html " na frente de cada regra ganha do .btn do sistema em
   qualquer ordem, mas perde para uma regra de lugar (".appbar .btn") -- lugar
   específico pode ajustar TAMANHO. Cor e canto vêm daqui sempre (ver o fim).
   Impressão fica de fora (@media screen): o papel tem o padrão dele.
   O escuro não é escrito aqui: o bloco do tema claro/escuro deriva ele destas
   mesmas cores, como faz com o resto.
   =========================================================================== */
:root{
  /* cor */
  --rm-marca:#D53309;        /* botão principal, destaque, aba ativa */
  --rm-marca-escura:#9B2709; /* passar o mouse no principal */
  --rm-marca-suave:#FDECE6;  /* fundo de destaque leve */
  --rm-texto:#16171a;
  --rm-texto-2:#474e5c;      /* texto de botão secundário, rótulo forte */
  --rm-apagado:#5e6169;      /* rótulo, legenda, cabeçalho de tabela */
  --rm-linha:#E4E6EA;
  --rm-linha-2:#E6E8EC;      /* linha entre linhas de tabela (era #EEF0F3: sumia, e a
                                lista de funcionários virava um bloco só) */
  --rm-faixa:#f7f8fa;        /* linha sim, linha não, nas tabelas */
  --rm-realce:#fff4ef;       /* linha sob o mouse */
  --rm-linha-forte:#cfd3da;  /* borda ao passar o mouse */
  --rm-fundo:#F4F5F7;
  --rm-superficie:#ffffff;
  --rm-superficie-2:#fafbfc; /* cabeçalho de tabela, faixa leve */
  --rm-ok:#1f7a4d;     --rm-ok-suave:#e8f3ec;
  /* aviso: #b4690e dava 3,7:1 sobre o próprio fundo suave (e 4,2:1 no
     branco) -- o "Em andamento" e o "vence hoje" ficavam apagados. Um degrau
     mais escuro, mesmo tom: 4,8:1 no suave, 5,5:1 no branco. */
  --rm-aviso:#9a5a0c;  --rm-aviso-suave:#fbf0e1;
  --rm-perigo:#B3123C; --rm-perigo-suave:#fbe9ee;
  --rm-info:#1f5fae;   --rm-info-suave:#e8f0fa;
  /* canto */
  --rm-raio-p:7px;           /* botão pequeno, etiqueta */
  --rm-raio:9px;             /* botão, campo */
  --rm-raio-g:14px;          /* cartão, janela */
  --rm-raio-pilula:999px;
  /* altura e letra */
  --rm-ctl:38px;             /* botão e campo */
  --rm-ctl-p:32px;           /* botão pequeno */
  --rm-fs:14px;
  --rm-fs-p:13px;
  --rm-fs-rotulo:12px;       /* cabeçalho de tabela, rótulo em versalete */
  --rm-peso-btn:600;
  /* sombra e foco */
  --rm-sombra:0 1px 2px rgba(20,20,30,.05),0 6px 18px rgba(20,20,30,.04);
  --rm-sombra-g:0 12px 32px rgba(20,20,30,.14);
  --rm-foco:0 0 0 3px rgba(213,51,9,.16);

  /* nomes antigos -> medidas da casa (só os que querem dizer a mesma coisa
     em todos os sistemas) */
  --red:var(--rm-marca); --accent:var(--rm-marca);
  --red-d:var(--rm-marca-escura); --red-dark:var(--rm-marca-escura); --accent-dark:var(--rm-marca-escura);
  --red-soft:var(--rm-marca-suave); --accent-soft:var(--rm-marca-suave);
  --ink:var(--rm-texto); --gray:var(--rm-texto-2);
  --muted:var(--rm-apagado); --faint:var(--rm-apagado);
  --line:var(--rm-linha); --border:var(--rm-linha);
  --line-2:var(--rm-linha-2); --border-2:var(--rm-linha-2);
  --bg:var(--rm-fundo); --surface:var(--rm-superficie); --card:var(--rm-superficie);
  --surface-2:var(--rm-superficie-2);
  --ok:var(--rm-ok); --ok-soft:var(--rm-ok-suave);
  --warn:var(--rm-aviso); --warn-soft:var(--rm-aviso-suave);
  --radius:var(--rm-raio-g);
}
@media screen{
/* ---------- BOTÃO ----------
   Nomes que cada sistema usa para a mesma coisa:
   base ........ .btn  .btn-act  .btn-sm  .btn-mini
   principal ... .btn.primary  .btn-red  .btn.red  .btn-sm.red  .btn-act.save
   secundário .. .btn.ghost  .btn-ghost  .btn-act.dim  .btn-gray
   perigo ...... .btn.danger
   pequeno ..... .btn.sm  .btn-sm  .btn-xs  .btn-mini */
html .btn,html .btn-act,html .btn-sm,html .btn-mini{
  min-height:var(--rm-ctl);padding-top:0;padding-bottom:0;padding-left:14px;padding-right:14px;
  border:1px solid var(--rm-linha);border-radius:var(--rm-raio);
  background-color:var(--rm-superficie);color:var(--rm-texto);
  font-size:var(--rm-fs);font-weight:var(--rm-peso-btn);line-height:1.2;
  box-shadow:none;cursor:pointer;
  transition:background-color .12s,border-color .12s,color .12s,box-shadow .12s;
}
html .btn:hover,html .btn-act:hover,html .btn-sm:hover,html .btn-mini:hover{
  background-color:var(--rm-superficie-2);border-color:var(--rm-linha-forte);color:var(--rm-texto);
}
html .btn.ghost,html .btn-ghost,html .btn-act.dim,html .btn-gray{
  background-color:var(--rm-superficie);border-color:var(--rm-linha);color:var(--rm-texto-2);
}
html .btn.ghost:hover,html .btn-ghost:hover,html .btn-act.dim:hover,html .btn-gray:hover{
  background-color:var(--rm-superficie-2);border-color:var(--rm-linha-forte);color:var(--rm-texto);
}
html .btn.primary,html .btn-red,html .btn.red,html .btn-sm.red,html .btn-act.save{
  background-color:var(--rm-marca);border-color:var(--rm-marca);color:#fff;
}
html .btn.primary:hover,html .btn-red:hover,html .btn.red:hover,html .btn-sm.red:hover,html .btn-act.save:hover{
  background-color:var(--rm-marca-escura);border-color:var(--rm-marca-escura);color:#fff;
}
html .btn.danger{background-color:var(--rm-superficie);border-color:var(--rm-linha);color:var(--rm-perigo)}
html .btn.danger:hover{background-color:var(--rm-perigo-suave);border-color:var(--rm-perigo);color:var(--rm-perigo)}
html .btn.sm,html .btn-sm,html .btn-xs,html .btn-mini,html .btn-act.sm{
  min-height:var(--rm-ctl-p);padding-left:10px;padding-right:10px;
  border-radius:var(--rm-raio-p);font-size:var(--rm-fs-p);
}
html .btn:disabled,html .btn-act:disabled,html .btn-sm:disabled,html .btn-mini:disabled{
  opacity:.5;cursor:not-allowed;
}
html .btn:focus-visible,html .btn-act:focus-visible,html .btn-sm:focus-visible,html .btn-mini:focus-visible{
  outline:none;box-shadow:var(--rm-foco);
}

/* ---------- CAMPO ----------
   Só canto, letra, cor da borda e foco. Altura e recuo ficam com o sistema:
   há campo dentro de célula de tabela (baixinho, sem borda) e campo de busca
   com a lupa dentro -- forçar o recuo empurraria a lupa para cima do texto.
   :where() deixa a regra com força zero de classe: um campo com classe
   própria (célula transparente) continua como está.
   O FUNDO também mora aqui. Campo sem fundo escrito ficava com o branco do
   navegador -- que o tema escuro não enxerga (não é regra de ninguém) -- e
   no escuro virava caixa branca com letra clara: o login do Obras, os
   custos do Corte, a busca de orçamentos salvos, o mês dos Salários. */
html :where(input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]):not([type=hidden]),select,textarea){
  border-radius:var(--rm-raio);font-size:var(--rm-fs);color:var(--rm-texto);background-color:var(--rm-superficie);
}
html :where(input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]):not([type=hidden]),select,textarea):focus{
  outline:none;border-color:var(--rm-marca);box-shadow:var(--rm-foco);
}
/* ALTURA DO CAMPO. Campo sem altura escrita ficava no tamanho do navegador
   (21 px no Corte, 24 no Máquinas) ou no que o recuo desse (45 px no
   Perfitec, 30 no Orçamento): numa mesma tela, caixas de alturas
   diferentes. Força zero (:where) -- quem escreve a altura continua
   mandando; célula de tabela fica de fora (linha de lista é baixinha). */
html :where(input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]):not([type=hidden]):not([type=image]):not([type=button]):not([type=submit]):not([type=reset]),select:not([multiple]):not([size])):where(:not(td *,th *)){
  height:var(--rm-ctl);box-sizing:border-box;
}
html :where(input,select,textarea):disabled{opacity:.6;cursor:not-allowed}
html :where(input,select,textarea)::placeholder{color:var(--rm-apagado);opacity:.8}

/* ---------- TABELA ----------
   O cabeçalho é o mesmo em toda a casa: versalete pequeno, cinza, linha
   embaixo. O espaçamento fica com cada tabela (há relatório de 20 colunas). */
html th{
  font-size:var(--rm-fs-rotulo);font-weight:700;color:var(--rm-apagado);
  text-transform:uppercase;letter-spacing:.05em;
  border-bottom-color:var(--rm-linha);
}

/* FAIXAS: linha sim, linha não, levemente cinza; a linha sob o mouse fica
   com um toque da marca. É o que separa um registro do outro numa lista
   comprida (a de funcionários do Recibos parecia um bloco só).
   :where() deixa a regra com força ZERO: célula que já tem cor própria (o
   calendário do Almoços, o status pintado) continua com a sua. Fora: a grade
   do Almoços (.grid), a do Cheques (.bgrid) e quem pedir .sem-faixa. */
:where(table:not(.grid):not(.bgrid):not(.sem-faixa)>tbody>tr:nth-child(even)>td){background-color:var(--rm-faixa)}
:where(table:not(.grid):not(.bgrid):not(.sem-faixa)>tbody>tr:hover>td){background-color:var(--rm-realce)}
/* no celular, a tabela .cartao-mob vira um cartão por linha: o cartão já
   separa, e a faixa pintaria um bloco cinza dentro dele */
@media (max-width:720px){:where(table.cartao-mob>tbody>tr>td){background-color:transparent}}

/* ---------- INICIAIS ----------
   O círculo com as iniciais de uma pessoa, na frente do nome, numa lista de
   gente: o olho acha onde começa cada um. NEUTRO de propósito: a primeira
   versão tinha uma cor forte por pessoa e ficou gritante -- a lista virava um
   confete. Cinza claro, letra cinza, fio fino: marca o começo da linha sem
   disputar com o nome nem com a etiqueta de situação. (As classes c0..c6 que
   os sistemas ainda mandam não pintam mais nada.) */
.rm-iniciais{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  width:32px;height:32px;border-radius:50%;background-color:#F1F2F4;color:var(--rm-apagado);
  box-shadow:inset 0 0 0 1px var(--rm-linha);
  font-size:12px;font-weight:600;letter-spacing:.02em;line-height:1;user-select:none}
/* pequena: dentro de linha de grupo, lista densa */
.rm-iniciais.p{width:26px;height:26px;font-size:10.5px;vertical-align:middle}
/* A PEÇA DE REGISTRO (montada por rmRegistro, bloco registro.html): iniciais,
   nome forte, dados menores e apagados embaixo. */
.rm-registro{display:flex;align-items:center;gap:12px;min-width:0}
.rm-registro.topo{align-items:flex-start}
.rm-registro.topo>.rm-iniciais{margin-top:1px}
.rm-reg-txt{min-width:0}
.rm-reg-nome{font-size:15px;font-weight:700;color:var(--rm-texto);line-height:1.3}
.rm-reg-dados{font-size:12.5px;font-weight:500;color:var(--rm-apagado);line-height:1.4;margin-top:3px}
.rm-registro.p{gap:10px}
.rm-registro.p>.rm-iniciais{width:28px;height:28px;font-size:11px}
.rm-registro.p .rm-reg-nome{font-size:14px}
@media (max-width:720px){
  .rm-registro.flutua{display:block}
  .rm-registro.flutua>.rm-iniciais{float:left;margin:0 12px 6px 0}
  .rm-registro.flutua .rm-reg-nome{padding-top:6px;min-height:32px}
  .rm-registro.flutua .rm-reg-dados{clear:both}
}

/* ---------- CARTÃO ----------
   Só o canto e a cor da borda: em alguns sistemas ".card" é caixa sem fundo
   (a lista de funcionários do Recibos), e pintar o fundo mudaria a tela. */
html .card{border-radius:var(--rm-raio-g);border-color:var(--rm-linha)}

/* ---------- LINGUAGEM DE PRANCHA ----------
   "20 sinais de que o teu dashboard foi feito por IA": cartão de número com
   ícone colorido, faixa colorida na borda, cartão escuro de destaque, rótulo
   em caixa alta espaçada em todo canto. A casa fala a língua da prancha
   técnica (a mesma do papel M1): linha fina, escrita normal, cor só com
   significado -- vermelho = problema, âmbar = vence logo, verde = pago ou
   recebido; laranja RM só na marca e na ação principal. Caixa alta só no
   carimbo e no cabeçalho de tabela. Regra em PADRAO_RM 3c. */
/* o nome do sistema ao lado da marca, em escrita normal */
html .rm-brand .sub{text-transform:none!important;letter-spacing:0!important;font-size:13px!important;font-weight:600!important}
/* FAIXA DE NÚMEROS: o contêiner dos números do topo leva a classe
   .rm-faixa; as caixas viram células de uma faixa só, divididas por fio.
   O fio de cada célula é sombra de 1px à direita e embaixo -- a última
   coluna e a última linha são cortadas pela borda da faixa, e a célula que
   falta na última linha fica branca (com gap+fundo cinza ela virava um
   bloco cinza). */
html .rm-faixa{gap:0!important;background:var(--rm-superficie)!important;border:1px solid var(--rm-linha)!important;
  border-radius:6px!important;overflow:hidden!important;box-shadow:none!important}
html .rm-faixa>*{border:0!important;border-radius:0!important;background:transparent!important;
  box-shadow:1px 0 0 var(--rm-linha),0 1px 0 var(--rm-linha)!important;transform:none!important}
html .rm-faixa>*::before,html .rm-faixa>*::after{content:none!important}
html .rm-faixa>:is(button,a,[onclick],[role=button]):hover{background:var(--rm-superficie-2)!important}
html .rm-faixa :is(.lbl,.lab,.label,.k,.k-label,.sum-lbl,.rm-fx-r){text-transform:none!important;letter-spacing:0!important;
  font-size:12.5px!important;font-weight:600!important;color:var(--rm-apagado)}
html .rm-faixa :is(.lbl,.lab,.label,.k,.k-label) :is(svg,.ico,.dot,.dotk,.k-ico),
html .rm-faixa :is(.lbl,.lab,.label,.k,.k-label)>span:empty{display:none!important}
/* faixa que já mora no alto de um painel: sem caixa própria, só o fio de baixo */
html .rm-faixa.rm-faixa-painel{border:0!important;border-bottom:1px solid var(--rm-linha)!important;border-radius:0!important}
html .rm-faixa :is(.val,.v,.value,.k-value,.num){font-variant-numeric:tabular-nums}
/* a cor do número: só quando pede atenção (a célula diz, o número pinta) */
html .rm-faixa .rm-fx-ruim{color:var(--rm-perigo)!important}
html .rm-faixa .rm-fx-aviso{color:var(--rm-aviso)!important}
html .rm-faixa .rm-fx-bom{color:var(--rm-ok)!important}

/* ---------- CANTO E COR VALEM EM QUALQUER LUGAR ----------
   Uma regra de lugar (".appbar .btn", ".toolbar .btn") pode deixar o botão
   mais baixo ou mais estreito, mas não inventa outro canto nem outra cor. */
html .btn:not(.sm):not(.btn-sm):not(.btn-xs),html .btn-act:not(.sm){border-radius:var(--rm-raio)!important}
html .btn.sm,html .btn-sm,html .btn-xs,html .btn-mini{border-radius:var(--rm-raio-p)!important}
}
/* no papel as iniciais não aparecem: são para achar a linha na tela */
@media print{.rm-iniciais{display:none!important}}
/* BORDAS LIMPAS NO TEMA CLARO. Sombra larga (8 a 24 px) num fundo
   cinza-claro vira faixa manchada: dentro da Central ela se somava a' sombra
   da barra lateral, e a margem entre a barra e a folha ficava clara no meio
   e escura nas pontas. No claro a borda e' o fio da folha mais uma sombra de
   1-2 px; o escuro fica como estava (la' a sombra some no fundo). */
body:not([data-theme="escuro"]){
  --shadow:0 1px 2px rgba(20,24,32,.05);
  --rm-sombra:0 1px 2px rgba(20,20,30,.05);
}
</style>
<style>
:root{--fundo:#F4F5F7;--card:#fff;--txt:#16171a;--apoio:#5e6169;--fio:#E4E6EA;--laranja:#F24619;--acao:#D53309;--ok:#1E7A46}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--txt);font-family:'Satoshi',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 40px}
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 16px;border-bottom:2px solid var(--laranja);margin-bottom:18px}
.logo{height:34px;width:auto;color:var(--txt)}
.logo path:nth-last-child(-n+3){fill:var(--laranja)}
.tipo{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--apoio);text-align:right}
h1{font-size:24px;line-height:1.15;margin:0 0 6px}
.cli{color:var(--apoio);font-size:14px;margin:0 0 16px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 22px}
.sum div{background:var(--card);border:1px solid var(--fio);border-radius:12px;padding:12px 14px}
.sum span{display:block;font-size:12px;color:var(--apoio);margin-bottom:4px}
.sum b{font-size:18px;font-variant-numeric:tabular-nums}
.sum .al b{color:var(--acao)}
h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--apoio);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2::before{content:'';width:18px;height:3px;border-radius:2px;background:var(--laranja)}
.lista{display:flex;flex-direction:column;gap:10px}
.nf{background:var(--card);border:1px solid var(--fio);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.nf .f{font-weight:700;font-size:15px}
.nf .d{font-size:13px;color:var(--apoio);font-variant-numeric:tabular-nums}
.nf .chv{font-size:11px;color:var(--apoio);font-variant-numeric:tabular-nums;word-break:break-all;margin-top:2px}
.nf .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.nf .acts{grid-column:1/-1;display:flex;gap:8px;margin-top:4px}
.bt{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border-radius:10px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;border:1.5px solid var(--fio);background:var(--card);color:var(--txt);text-decoration:none}
.bt.pri{background:var(--acao);border-color:var(--acao);color:#fff}
.bt[disabled]{opacity:.6;cursor:default}
.sem{font-size:13px;color:var(--apoio);grid-column:1/-1}
.par{background:var(--card);border:1px solid var(--fio);border-radius:12px;overflow:hidden}
.par .l{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 14px;border-bottom:1px solid var(--fio)}
.par .l:last-child{border-bottom:0}
.par .l b{font-weight:600}.par .l small{color:var(--apoio);font-size:12px}
.tg{font-size:12px;font-weight:700;border-radius:20px;padding:2px 9px;justify-self:end}
.tg.y{background:#E6F4EC;color:var(--ok)}.tg.n{background:#FFF1EC;color:var(--acao)}
.obs{background:var(--card);border:1px solid var(--fio);border-radius:12px;padding:12px 14px;font-size:14px;white-space:pre-wrap}
.pe{margin-top:28px;padding-top:14px;border-top:1px solid var(--fio);font-size:12px;color:var(--apoio);display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px}
.estado{text-align:center;padding:60px 10px;color:var(--apoio)}
.estado b{display:block;color:var(--txt);font-size:18px;margin-bottom:6px}
.vov{position:fixed;inset:0;background:rgba(15,15,15,.92);display:none;flex-direction:column;z-index:10}
.vov.on{display:flex}
.vov .vb{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:#fff;font-weight:700}
.vov button{background:none;border:0;color:#fff;font-size:28px;cursor:pointer;line-height:1}
.vov .vc{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:8px}
.vov img{max-width:100%;height:auto;background:#fff}
@media (max-width:520px){h1{font-size:21px}.sum b{font-size:16px}.tipo{font-size:10px}}
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js" crossorigin="anonymous"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var brl=function(v){return 'R$ '+Number(v||0).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');};
  var dt=function(v){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(v||''));return m?m[3]+'/'+m[2]+'/'+m[1]:(v||'');};
  var cod=(new URLSearchParams(location.search).get('c')||'').replace(/[^A-Za-z0-9_-]/g,'');
  var fonte=window.__acompFonte||null, db=null, META=null, cache={};
  function estado(t,m){ $('conteudo').innerHTML='<div class="estado"><b>'+esc(t)+'</b>'+esc(m)+'</div>'; }
  function render(d){
    META=d;
    var conta=d.tipo==='conta';
    $('tipoDoc').innerHTML=conta?'RELATÓRIO<br>DA OBRA':'ACOMPANHAMENTO<br>DA OBRA';
    var h='<h1>'+esc(d.nome||'Obra')+'</h1><p class="cli">'+(d.cliente?'Cliente: '+esc(d.cliente):'')+(d.ref?(d.cliente?' · ':'')+'Ref.: '+esc(d.ref):'')+'</p>';
    var rs=d.resumo||[];
    if(rs.length) h+='<div class="sum">'+rs.map(function(r){return '<div'+(r[2]?' class="al"':'')+'><span>'+esc(r[0])+'</span><b>'+brl(r[1])+'</b></div>';}).join('')+'</div>';
    if(d.parcelas){
      h+='<h2>Parcelas</h2><div class="par">'+(d.parcelas.length?d.parcelas.map(function(p){
        return '<div class="l"><b>'+(esc(p.desc)||'—')+'</b><span class="tg '+(p.ok?'y':'n')+'">'+(p.ok?'Recebida':'Pendente')+'</span>'
          +'<small>'+[dt(p.data),p.forma||''].filter(Boolean).map(esc).join(' · ')+'</small>'+(p.valor!=null?'<b style="text-align:right;font-variant-numeric:tabular-nums">'+brl(p.valor)+'</b>':'<span></span>')+'</div>';
      }).join(''):'<div class="l"><small>Sem parcelas lançadas.</small></div>')+'</div>';
    }
    var ns=d.notas||[];
    h+='<h2>Notas fiscais ('+ns.length+')</h2><div class="lista">'+(ns.length?ns.map(function(n,i){
      return '<div class="nf"><div><div class="f">'+(esc(n.forn)||'—')+'</div><div class="d">NF '+(esc(n.nf)||'—')+(n.data?' · '+esc(dt(n.data)):'')+'</div>'+(n.chave?'<div class="chv">'+esc(n.chave)+'</div>':'')+'</div>'
        +(n.valor!=null?'<div class="v">'+brl(n.valor)+'</div>':'<div></div>')
        +(n.arq?'<div class="acts"><button class="bt pri" type="button" data-ver="'+i+'">Ver nota</button><button class="bt" type="button" data-baixar="'+i+'">Baixar</button></div>'
               :'<div class="sem">Arquivo da nota ainda não anexado.</div>')+'</div>';
    }).join(''):'<div class="nf"><div class="sem">Nenhuma nota lançada até agora.</div></div>')+'</div>';
    if(d.obs) h+='<h2>Observações</h2><div class="obs">'+esc(d.obs)+'</div>';
    $('conteudo').innerHTML=h;
    var em=d.em?new Date(d.em):null;
    $('peData').textContent=(em?'Atualizado em '+em.toLocaleDateString('pt-BR')+' às '+em.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'')+(d.expira?' · link válido até '+new Date(d.expira).toLocaleDateString('pt-BR'):'');
    document.title=(d.nome||'Obra')+(conta?' — Relatório da obra':' — Acompanhamento');
  }
  function arquivo(n){
    if(cache[n.fid]) return Promise.resolve(cache[n.fid]);
    var p=fonte?Promise.resolve((fonte.arq||{})[n.fid]):db.ref('obras_link_arq/'+cod+'/'+n.fid).once('value').then(function(s){return s.val();});
    return p.then(function(a){ if(!a||!a.dados) throw new Error('sem');
      return fetch(a.dados).then(function(r){return r.blob();}).then(function(b){ var o={url:URL.createObjectURL(b),nome:a.nome||('NF '+(n.nf||'')+'.pdf'),tipo:a.tipo||b.type}; cache[n.fid]=o; return o; }); });
  }
  document.addEventListener('click',function(e){
    var bv=e.target.closest('[data-ver]'), bb=e.target.closest('[data-baixar]');
    if(!bv&&!bb) return;
    var n=META.notas[+(bv||bb).getAttribute(bv?'data-ver':'data-baixar')], bt=bv||bb, txt=bt.textContent;
    /* a janela abre JÁ no toque: o iPhone barra janela aberta depois de esperar a rede */
    var img=/^image\//.test(n.tipo||''), w=(bv&&!img)?window.open('','_blank'):null;
    bt.disabled=true; bt.textContent='Carregando…';
    arquivo(n).then(function(a){
      if(bb){ var l=document.createElement('a'); l.href=a.url; l.download=a.nome; document.body.appendChild(l); l.click(); l.remove(); }
      else if(/^image\//.test(a.tipo)){ $('vtit').textContent=a.nome; $('vcorpo').innerHTML='<img alt="" src="'+a.url+'">'; $('vov').classList.add('on'); }
      else if(w){ w.location.href=a.url; }
      else location.href=a.url;
    }).catch(function(){ if(w) w.close(); alert('Não foi possível abrir esta nota agora. Tente de novo em instantes.'); })
      .then(function(){ bt.disabled=false; bt.textContent=txt; });
  });
  $('vfecha').onclick=function(){ $('vov').classList.remove('on'); $('vcorpo').innerHTML=''; };
  if(!cod) { estado('Link incompleto','Confira se o endereço foi copiado inteiro.'); return; }
  if(fonte){ fonte.meta?render(fonte.meta):estado('Link indisponível','Este acompanhamento foi desligado ou venceu. Peça um novo link à RM Estruturas.'); return; }
  try{
    firebase.initializeApp({apiKey:'AIzaSyBDOR9f748UNoGP5c72Y-vdmDBcffM8tMI',authDomain:'rm-contas.firebaseapp.com',databaseURL:'https://rm-contas-default-rtdb.firebaseio.com',projectId:'rm-contas'});
    db=firebase.database();
    db.ref('obras_link/'+cod).on('value',function(s){ var d=s.val();
      if(!d||(d.expira&&d.expira<Date.now())) estado('Link indisponível','Este acompanhamento foi desligado ou venceu. Peça um novo link à RM Estruturas.');
      else render(d); },
      function(){ estado('Link indisponível','Este acompanhamento foi desligado ou venceu. Peça um novo link à RM Estruturas.'); });
  }catch(e){ estado('Sem conexão','Verifique a internet e abra o link de novo.'); }
})();
</script>
