<!-- ============ A FONTE DA MARCA ============================================
     Satoshi, do manual 2026. Vai EMBUTIDA em base64 e nao por link: o app do
     Electron roda sem internet; o service-worker nao precisa ganhar mais um
     item na lista (item esquecido = fonte sumindo calada); e, o que decide,
     os relatorios em PDF sao documentos SEPARADOS montados como texto -- um
     caminho relativo nao resolve la dentro, um data: URI resolve.
     E UM arquivo so: a variavel cobre 300 a 900, entao substitui Light,
     Regular, Medium, Bold e Black de uma vez -- 41 kB contra 130 kB.
     Fica num bloco de codigo no topo do documento, antes da folha de estilo,
     por dois motivos: roda antes da primeira pintura (sem troca de letra na
     cara de quem abre) e a MESMA copia serve a tela e os PDFs, em vez de
     duas de 56 kB.
     Licenca: Fontshare / Indian Type Foundry, uso comercial liberado; o
     pacote do marketing traz o kit web oficial com estes woff2. -->
<script>
/* ===== O DIA DE HOJE É O DE BRASÍLIA =====

   new Date().toISOString() dá a data de LONDRES. Aqui (UTC-3) ela vira o dia
   seguinte às 21h: a conta que vence hoje aparecia como vencida à noite, e o
   que se lançava depois das 21h saía com a data de amanhã. O mesmo vale para
   o caminho inverso: new Date('2026-10-01') é meia-noite de Londres, que em
   Brasília ainda é dia 30 -- foi assim que o empréstimo de 01/10 ganhou
   parcelas no dia 30.

   rmDiaISO(d)  -> 'AAAA-MM-DD' no relógio daqui (sem d: hoje)
   rmDataDe(iso) -> Date ao meio-dia daqui daquele dia (nunca escorrega)
*/
(function(){
  function d2(n){ return (n<10?'0':'')+n; }
  window.rmDiaISO = function(d){
    d = d ? new Date(d) : new Date();
    if (isNaN(d)) return '';
    return d.getFullYear()+'-'+d2(d.getMonth()+1)+'-'+d2(d.getDate());
  };
  window.rmDataDe = function(iso){
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||''));
    return m ? new Date(+m[1], +m[2]-1, +m[3], 12) : new Date(NaN);
  };
})();
</script>

<script>
/* ===== O ERRO TAMBÉM FALA PORTUGUÊS =====

   As mensagens de erro da tela eram metade em português e metade em inglês:
   a frase era nossa, mas o final vinha cru do navegador ou do Firebase --
   "Erro ao gerar PDF: Cannot read properties of undefined (reading 'nome')",
   "Não consegui gravar na nuvem: PERMISSION_DENIED: Permission denied".

   Quem lê isso no meio do expediente não tem como saber se é culpa dele, se
   perdeu alguma coisa, ou se é para chamar alguém. E o pedaço em inglês é
   justamente o que diz O QUE aconteceu.

   Aqui cada mensagem conhecida vira uma frase em português que diz o que
   houve E o que fazer. O que não for reconhecido continua passando inteiro,
   entre parênteses: mensagem estranha ainda é melhor que mensagem nenhuma,
   e é o que permite descobrir a próxima que merece tradução. */
(function(){
  if(window.rmErroPt) return;

  /* Cada par é [o que o navegador diz, o que a pessoa precisa ler].
     A ordem importa: a primeira que casar é a que vale, então o que for mais
     específico vem antes do que for mais geral. */
  var TABELA=[
    /* --- nuvem e permissão --- */
    [/permission[_ ]denied|permission denied/i,
     'o banco recusou o acesso — falta regra no Firebase para este dado, ou esta conta não tem permissão'],
    [/auth\/wrong-password|auth\/invalid-credential|auth\/invalid-login/i, 'senha incorreta'],
    [/auth\/user-not-found/i, 'não existe conta com esse e-mail'],
    [/auth\/invalid-email/i, 'o e-mail está escrito de forma inválida'],
    [/auth\/too-many-requests/i, 'muitas tentativas seguidas — espere alguns minutos e tente de novo'],
    [/auth\/network-request-failed/i, 'não deu para falar com o servidor de login — verifique a internet'],
    [/auth\/user-disabled/i, 'esta conta está desativada'],
    [/auth\/email-already-in-use/i, 'já existe uma conta com esse e-mail'],
    [/auth\/weak-password/i, 'a senha é curta demais'],
    [/auth\/requires-recent-login/i, 'por segurança, saia e entre de novo antes de fazer isso'],

    /* --- rede --- */
    [/failed to fetch|networkerror|load failed|err_internet|net::/i,
     'não deu para falar com a internet'],
    [/client is offline|is offline|offline mode/i,
     'o aparelho está sem internet — o que você fez está na tela, mas ainda não subiu'],
    [/timeout|timed out/i, 'o servidor demorou demais para responder'],
    [/unavailable|disconnect/i, 'o serviço está fora do ar no momento'],

    /* --- espaço e armazenamento --- */
    [/quota|storage is full|exceeded the quota/i,
     'a memória do navegador encheu — apague backups antigos ou libere espaço no aparelho'],
    [/indexeddb|database is not open/i, 'o banco local do navegador não abriu'],

    /* --- arquivo --- */
    [/unexpected token|unexpected end of (json|input)|is not valid json|json\.parse/i,
     'o arquivo não está no formato esperado — confira se é o backup certo'],
    [/unsupported image|invalid image|incomplete or corrupt/i,
     'a imagem está num formato que não dá para usar aqui'],
    [/file (is )?not found|notfounderror/i, 'o arquivo não foi encontrado'],
    [/aborterror|the (user )?aborted/i, 'a operação foi cancelada'],
    [/notallowederror|permission.*(denied|dismissed)|the request is not allowed/i,
     'o navegador bloqueou — é preciso permitir isso nas configurações do aparelho'],
    [/the operation is insecure|securityerror|blocked a frame/i,
     'o navegador bloqueou por segurança'],

    /* --- programa --- */
    [/cannot read propert|of undefined|of null|undefined is not an object|null is not an object/i,
     'faltou um dado que o sistema esperava encontrar (falha interna)'],
    [/is not a function|is not defined/i,
     'uma parte do sistema não carregou — recarregue a página'],
    [/maximum call stack|out of memory|invalid array length|allocation failed/i,
     'a conta ficou grande demais para o aparelho'],
    [/script error/i, 'um arquivo do sistema não carregou por completo'],
    [/loading chunk|failed to load|importing a module|dynamically imported module/i,
     'uma parte do sistema não terminou de baixar — recarregue a página'],

    /* --- impressão e planilha --- */
    [/jspdf|addimage|invalid coordinates/i, 'não deu para montar o PDF'],
    [/exceljs|worksheet/i, 'não deu para montar a planilha']
  ];

  /* O texto que sai do erro: mensagem, ou código, ou o próprio objeto. */
  function cru(err){
    if(err==null) return '';
    if(typeof err==='string') return err;
    var m=err.message||err.code||err.name||'';
    if(err.code && String(m).indexOf(err.code)<0) m=err.code+' '+m;
    return String(m||err);
  }

  /* Devolve SÓ a explicação em português, sem repetir a frase de quem chamou.
     Se não reconhecer, devolve o texto original -- que é o que faz a próxima
     mensagem desconhecida aparecer para ser traduzida um dia. */
  window.rmErroPt=function(err){
    var t=cru(err);
    if(!t) return 'não deu para completar';
    for(var i=0;i<TABELA.length;i++) if(TABELA[i][0].test(t)) return TABELA[i][1];
    /* Não reconhecida: passa inteira, mas marcada, para não parecer frase
       nossa mal escrita. */
    return t.replace(/\s+/g,' ').trim();
  };

  /* Diz se a mensagem já saiu traduzida. Serve para quem quer mostrar o
     original entre parênteses só quando não houve tradução. */
  window.rmErroConhecido=function(err){
    var t=cru(err);
    for(var i=0;i<TABELA.length;i++) if(TABELA[i][0].test(t)) return true;
    return false;
  };
})();
</script>
<script>
/* ===== NOME NA TELA: PESSOA E EMPRESA =====
   rmNomePt(n) -> "Nome Sobrenome", so' para mostrar. O cadastro fica como
   veio: uma planilha importada em caixa alta traria a bagunca de volta, e o
   que foi digitado ja' teria sido perdido.
     "FULANO DA SILVA"           -> "Fulano da Silva"   (de, da, do, e... minusculos)
     "PERFITEC COMERCIO LTDA ME" -> "Perfitec Comercio LTDA ME" (siglas de empresa ficam)
     "J.R. FERRAGENS"            -> "J.R. Ferragens"    (iniciais ficam)
     "Joao da Silva"             -> como esta' (digitado com cuidado, respeita)
   Mesma regra do titlePt do Recibos e do nomePt do Almocos, para os outros. */
(function(){
  var LIGA=['da','de','do','das','dos','e','di','du','del','van','von'];
  var SIGLA=/^(br|ltda|me|epp|eireli|mei|sa|s\/a|s\.a|cia|s\/s|ss|ii|iii|iv|vi|vii|viii|ix|xi)$/i;
  window.rmNomePt=function(n){
    n=String(n==null?'':n).trim().replace(/\s+/g,' ');
    if(!n) return '';
    var letras=n.replace(/[^\p{L}]/gu,''), maiusc=letras.replace(/[^\p{Lu}]/gu,'').length;
    /* caixa mista de verdade (a maior parte minuscula) foi digitada assim de proposito */
    if(letras && maiusc/letras.length<0.6 && n!==n.toLowerCase()) return n;
    return n.toLowerCase().split(' ').map(function(w,i){
      if(i>0 && LIGA.indexOf(w)>=0) return w;
      var limpo=w.replace(/[.,;:()]+$/,'').replace(/^\(/,'');
      if(SIGLA.test(limpo)) return w.toUpperCase();
      if(/\d/.test(w) || /^(\p{L}\.)+\p{L}?\.?$/u.test(w)) return w.toUpperCase();
      return w.replace(/(^|['’\-\/(])(\p{L})/gu,function(m,a,b){ return a+b.toUpperCase(); });
    }).join(' ');
  };
})();
</script>


<script>
/* ===== QUANDO A NUVEM RECUSA, ALGUÉM PRECISA SABER =====

   O padrão ".catch(()=>{})" estava espalhado por cima das gravações no banco.
   Ele não é descuido: foi escrito para a gravação não derrubar a tela quando a
   internet cai, e nisso acerta. O problema é que trata igual duas coisas bem
   diferentes -- "a rede piscou, tenta de novo daqui a pouco" e "o banco
   RECUSOU, isto não vai ser salvo nunca".

   Foi assim que dois nós ficaram fora das regras do Firebase sem ninguém
   notar: o sistema gravava, a promessa era recusada, o catch vazio engolia, e
   a tela seguia mostrando o dado certo -- que existia só ali.

   Agora a recusa por falta de permissão chega até a tela e diz o nome da
   operação. Uma vez por operação, para não virar barulho. Falha de rede
   continua calada, que é o certo para ela: volta sozinha. */
(function(){
  if(window.rmNuvemErro) return;
  var VISTO={}, LEITURAS=[], tLeitura=null;

  function rede(msg){ return /network|offline|unavailable|timeout|disconnect/i.test(msg); }
  function negada(msg){ return /permission|denied/i.test(msg); }

  /* As leituras recusadas juntam-se num aviso só. Numa conta com acesso
     parcial são várias de uma vez, e um alerta por nó seria uma fila de
     caixinhas para fechar antes de usar o sistema.

     E o aviso é dado UMA VEZ por conjunto de negativas, e não a cada
     abertura. Há conta que é limitada de propósito -- a da engenharia não
     enxerga nove dos nós que a Central acompanha, e é assim que tem de ser.
     Repetir o alerta toda manhã ensinaria a fechá-lo sem ler, e aí o dia em
     que aparecesse um nó NOVO na lista passaria batido junto.

     A chave é a própria lista, em ordem. Enquanto ela for a mesma, silêncio;
     se mudar -- porque uma regra caiu, ou porque as permissões mudaram -- é
     outro conjunto, e o aviso volta. */
  function jaAvisado(chave){
    try{ return localStorage.getItem('rm_nuvem_leitura')===chave; }catch(e){ return false; }
  }
  function marcaAvisado(chave){
    try{ localStorage.setItem('rm_nuvem_leitura',chave); }catch(e){}
  }
  function acumulaLeitura(oque){
    if(LEITURAS.indexOf(oque)<0) LEITURAS.push(oque);
    clearTimeout(tLeitura);
    tLeitura=setTimeout(function(){
      var l=LEITURAS.slice(); LEITURAS.length=0;
      var chave=l.slice().sort().join('|');
      if(jaAvisado(chave)) return;
      marcaAvisado(chave);
      try{
        alert('ESTA TELA ABRIU SEM PARTE DOS DADOS.\n\n'
          +'O banco recusou a leitura de:\n  • '+l.join('\n  • ')
          +'\n\nOu esta conta não tem acesso a esses dados, ou falta regra para '
          +'eles no Firebase. O que estiver faltando na tela está lá, não foi '
          +'perdido.\n\nSe for o acesso da conta, este aviso não se repete: ele '
          +'volta só se a lista mudar.');
      }catch(e){}
    },1500);
  }

  window.rmNuvemErro=function(oque,err,modo){
    var msg=(err&&(err.message||err.code))||String(err||'');
    var chave=String(modo||'')+'|'+String(oque)+'|'+msg;
    if(VISTO[chave]) return;
    VISTO[chave]=1;
    try{ console.error('[nuvem] '+oque+': '+msg); }catch(e){}
    if(rede(msg)) return;
    if(modo==='leitura'){ if(negada(msg)) acumulaLeitura(oque); return; }
    if(negada(msg)){
      try{ alert('O BANCO RECUSOU GRAVAR.\n\nOperação: '+oque+'\n\n'
        +'Falta permissão para este nó nas regras do Firebase. O que você fez '
        +'está na tela, mas NÃO subiu para a nuvem e não vai aparecer nos '
        +'outros aparelhos.'); return; }catch(e){}
    }
    var t='Não consegui gravar "'+oque+'" na nuvem: '
      +(window.rmErroPt?window.rmErroPt(err):msg)+'.';
    try{ if(typeof toast==='function'){ toast(t); return; } }catch(e){}
    try{ alert(t); }catch(e){}
  };

  /* E A LEITURA TAMBÉM. Um on('value', ...) sem tratador de erro é ainda mais
     traiçoeiro que a gravação calada: a tela abre vazia, como se não houvesse
     dado nenhum -- e foi exatamente esse o sintoma do painel de contabilidade
     da Central. Em vez de caçar os vinte e poucos pontos de leitura um a um, e
     deixar passar o que for escrito amanhã, o tratador entra por baixo, no
     próprio "on" do Firebase. Quem já passa o seu continua mandando: só o que
     não passa nenhum é que ganha o nosso. */
  /* E A GRAVAÇÃO COM NOME PROIBIDO. O Firebase recusa, na hora e sem passar
     por promessa nenhuma, o pacote que tenha um nome de campo com . # $ / [ ]
     (ou vazio), um valor undefined ou um número que não é número. Recusa o
     PACOTE INTEIRO: um campo errado num orçamento prendeu 14 orçamentos e o
     cadastro no computador por dias, com o selo verde. O .catch() de quem
     grava não vê esse erro -- ele acontece antes de existir a promessa.

     Aqui, por baixo do set/update/push de todos os sistemas: o que a nuvem
     recusaria vai trocado SÓ NA CÓPIA que sobe (nome com _ no lugar do
     símbolo, undefined some, número inválido vira null) e fica anotado no
     console e em window.RM_NUVEM_AJUSTES; e se ainda assim o Firebase
     recusar na hora, o erro vira aviso na tela em vez de sumir. */
  var AJUSTES=(window.RM_NUVEM_AJUSTES=window.RM_NUVEM_AJUSTES||[]);
  var ESPECIAL={'.sv':1,'.priority':1,'.value':1};
  function nomeBom(k,topo){ return k!=='' && !(topo?/[.#$\[\]]/:/[.#$\/\[\]]/).test(k); }
  function sujo(v,topo){
    if(v===undefined||typeof v==='function') return true;
    if(typeof v==='number') return !isFinite(v);
    if(!v||typeof v!=='object') return false;
    if(Array.isArray(v)){ for(var i=0;i<v.length;i++) if(sujo(v[i],false)) return true; return false; }
    for(var k in v){ if(!Object.prototype.hasOwnProperty.call(v,k)) continue;
      if(!ESPECIAL[k]&&!nomeBom(k,topo)) return true;
      if(sujo(v[k],false)) return true; }
    return false;
  }
  function limpa(v,topo,aj,cam){
    if(v===undefined||typeof v==='function'){ aj.push(cam||'(valor)'); return undefined; }
    if(typeof v==='number'&&!isFinite(v)){ aj.push(cam||'(valor)'); return null; }
    if(!v||typeof v!=='object') return v;
    if(Array.isArray(v)) return v.map(function(x,i){ var r=limpa(x,false,aj,cam+'/'+i); return r===undefined?null:r; });
    var o={};
    Object.keys(v).forEach(function(k){
      var n=k;
      if(!ESPECIAL[k]&&!nomeBom(k,topo)){
        n=k===''?'_':k.replace(topo?/[.#$\[\]]/g:/[.#$\/\[\]]/g,'_');
        while(Object.prototype.hasOwnProperty.call(o,n)) n+='_';
        aj.push(cam+'/'+k);
      }
      var r=limpa(v[k],false,aj,cam+'/'+k); if(r!==undefined) o[n]=r;
    });
    return o;
  }
  function caminho(ref){
    try{ return String(ref).replace(/^https?:\/\/[^/]+\//,'').replace(/\/$/,''); }catch(e){ return ''; }
  }
  function protege(R,nome){
    var orig=R.prototype[nome];
    if(typeof orig!=='function') return;
    R.prototype[nome]=function(){
      var a=Array.prototype.slice.call(arguments), onde=caminho(this);
      if(a.length&&!(nome==='push'&&a[0]===undefined)&&sujo(a[0],nome==='update')){
        var aj=[]; a[0]=limpa(a[0],nome==='update',aj,'');
        if(a[0]===undefined) a[0]=null;
        AJUSTES.push({onde:onde,campos:aj.slice(0,10),em:Date.now()});
        if(AJUSTES.length>50) AJUSTES.splice(0,AJUSTES.length-50);
        try{ console.warn('[nuvem] '+(onde||nome)+': campo(s) ajustado(s) para a nuvem aceitar: '+aj.slice(0,5).join(', ')); }catch(e){}
      }
      try{ return orig.apply(this,a); }
      catch(e){
        window.rmNuvemErro('gravar em '+(onde||nome),e,'gravacao');
        var p=Promise.reject(e); p.catch(function(){}); return p;
      }
    };
  }
  function remenda(){
    try{
      var R=window.firebase&&firebase.database&&firebase.database.Reference;
      if(!R||!R.prototype) return false;
      if(R.prototype.__rmNuvem) return true;
      var orig=R.prototype.on;
      if(typeof orig!=='function') return false;
      R.prototype.on=function(ev,cb,erro,ctx){
        if(typeof erro!=='function'){
          var onde='';
          try{ onde=String(this).replace(/^https?:\/\/[^/]+\//,'').replace(/\/$/,''); }catch(e){}
          ctx=erro;
          erro=function(e){ window.rmNuvemErro(onde||String(ev),e,'leitura'); };
        }
        return orig.call(this,ev,cb,erro,ctx);
      };
      protege(R,'set'); protege(R,'update'); protege(R,'push');
      R.prototype.__rmNuvem=true;
      return true;
    }catch(e){ return true; }
  }
  if(!remenda()){
    /* O Firebase é carregado no fim do corpo; este bloco vem antes. Tenta até
       ele existir, e desiste depois de dez segundos para não ficar rodando
       a toa em sistema que não usa nuvem nenhuma. */
    var n=0, t=setInterval(function(){ if(remenda()||++n>100) clearInterval(t); },100);
  }
})();

<script>
/* ===========================================================================
   TEMA CLARO / ESCURO — uma peca so, igual nos quinze sistemas.

   Estes sistemas foram escritos claros, com a cor cravada no lugar: 433
   cores na folha de estilo do Recibos contra 26 variaveis. Reescrever as
   433 a mao, quinze vezes, seria garimpo demorado e um convite a erro --
   basta uma passar batida para sobrar letra branca em fundo branco.

   Entao o escuro NAO e uma segunda folha escrita a mao: ele e DERIVADO da
   folha que ja existe, no momento em que o usuario liga. Passa-se por cada
   regra, traduz-se cada cor e escreve-se uma folha de correcao por cima.
   Desligar e so remover essa folha -- nada no original e tocado.

   A traducao e em OKLab, onde claridade, matiz e croma sao eixos separados.
   Inverter o RGB trocaria o verde de "pago" por rosa e o laranja da marca
   por vinho; aqui so a CLARIDADE vira, e mesmo assim so quando faz sentido
   pelo papel que a cor exerce -- ver as regras em corDoEscuro().

   O QUE FICA DE FORA, de proposito:
     - tudo dentro de @media print. O papel e branco em qualquer tema; se o
       relatorio virasse escuro junto, sairia uma folha preta na impressora.
     - os documentos em PDF, montados como texto separado, que nem passam
       por aqui.
     O estilo escrito no atributo do elemento NAO fica de fora: ali a folha
     de correcao nao alcanca, entao o atributo e traduzido a parte, com um
     observador para o que o sistema desenhar depois.
   =========================================================================== */
(function(){

   lendo 'escuro' e abrir no escuro de sempre. */
var CHAVE_TOM='rm_tom';

  suave:{chao:0.29,  tinta:0.37,  piso:0.82, cor:0.80},
  /* NÍTIDO: no forte o texto principal (L 0,20 no claro) virava 0,83 e o de

     sobre um fundo quase preto que faz a letra clara "brilhar". Aqui o texto
     segue uma reta (0,98 - 0,36 L): principal quase branco (0,91), apoio um
     degrau abaixo (0,78), e o fundo sai do preto (chão 0,215). Todo texto

function rgbDe(L,a,b){var l=Math.pow(L+0.3963377774*a+0.2158037573*b,3),
      m=Math.pow(L-0.1055613458*a-0.0638541728*b,3),
      s=Math.pow(L-0.0894841775*a-1.2914855480*b,3);
  return [_g( 4.0767416621*l-3.3077115913*m+0.2309699292*s),
          _g(-1.2684380046*l+2.6097574011*m-0.3413193965*s),
          _g(-0.0041960863*l-0.7034186147*m+1.7076147010*s)];}

var NEUTRO=0.035;
/* papel: 'FUNDO' | 'TEXTO' | 'LINHA' | 'VAR' */
function corDoEscuro(r,g,b,papel){
  var o=oklab(r,g,b), L=o[0], A=o[1], B=o[2], C=Math.hypot(A,B), k;
  var texto = papel==='TEXTO';
  if(C<NEUTRO){
    /* branco sobre botao colorido FICA: vira-lo apagaria a letra */
    if(texto && L>=0.60) return [r,g,b];
    /* neutro JA escuro como fundo FICA: e o botao escuro, a barra de
       impressao, o bloco do total. Clarea-lo deixaria fundo claro com a
       letra branca que a linha acima preserva. */
    /* O piso era 0,40 e deixava passar o cartao cinza #474E5C, que tem L
       0,423: ele clareava para #585E6D enquanto a letra clara em cima dele
       era preservada, e o par caia de 4,55:1 para 3,53:1. Fundo neutro mais
       escuro que o meio FICA -- a letra dele ja e clara por desenho. */
    if(!texto && papel!=='VAR' && L<0.50) return [r,g,b];
    var Ln=TOM.chao+(0.965-TOM.chao)*Math.pow(1-L,0.85);
    /* PISO DO TEXTO. Contra o fundo derivado do branco (#101010, luminancia
       0,0035) a razao de 5:1 pede luminancia 0,218, o que em OKLab da L 0,78.
       Com 0,70 o texto de apoio ficava em 4,36:1 -- medido na tela, nao
       estimado. */
    if(texto) Ln=Math.max(TOM.reta?0.98-0.36*L:Ln,TOM.piso);
    return rgbDe(Ln,A,B);
  }
  if(papel==='FUNDO'||papel==='VAR'){
    if(L>0.82){ k=0.24/Math.max(C,0.001)*0.5; return rgbDe(TOM.tinta,A*k,B*k); }
    /* cor de verdade FICA. O --red e o tom da marca: ele pinta o botao
       cheio, e clarea-lo desbotaria o botao e ainda PIORARIA o contraste
       da letra branca em cima. O que valia no claro continua valendo --
       4,88:1 no botao. Quem precisa clarear e a cor usada como TEXTO, e
       disso cuida resolveVar(). */
    return [r,g,b];
  }
  if(L<0.66){ k=Math.max(Math.min(1,0.16/Math.max(C,0.001)),0.55);
    return rgbDe(TOM.cor,A*k,B*k); }
  return [r,g,b];
}

function papelDe(prop){
  if(prop.indexOf('--')===0) return 'VAR';
  if(prop.indexOf('background')===0) return 'FUNDO';
  if(prop==='color'||prop==='caret-color'||prop==='accent-color') return 'TEXTO';
  if(prop.indexOf('border')>=0||prop.indexOf('outline')>=0) return 'LINHA';
  if(prop==='fill'||prop==='stroke'||prop.indexOf('shadow')>=0) return 'LINHA';
  return 'FUNDO';
}

var RE_HEX=/#([0-9a-fA-F]{3,8})\b/g;
var RE_RGB=/rgba?\(\s*([\d.]+)[\s,]+([\d.]+)[\s,]+([\d.]+)\s*(?:[,\/]\s*([\d.%]+)\s*)?\)/g;
var RE_VAR=/var\(\s*(--[\w-]+)\s*(?:,[^()]*)?\)/g;
function hexPra(h){
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(h.length===4) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16),
          h.length===8?h.slice(6,8):''];
}
function d2(n){var s=n.toString(16);return s.length<2?'0'+s:s;}
function pinta3(n){return '#'+d2(n[0])+d2(n[1])+d2(n[2]);}

function traduz(valor,papel){
  var mexeu=false;
  var v=valor.replace(RE_HEX,function(m,h){
    if(h.length!==3&&h.length!==4&&h.length!==6&&h.length!==8) return m;
    var p=hexPra(h), n=corDoEscuro(p[0],p[1],p[2],papel); mexeu=true;
    return pinta3(n)+p[3];
  });
  v=v.replace(RE_RGB,function(m,r,g,b,a){
    var n=corDoEscuro(+r,+g,+b,papel); mexeu=true;
    return a!=null?('rgba('+n[0]+','+n[1]+','+n[2]+','+a+')'):('rgb('+n[0]+','+n[1]+','+n[2]+')');
  });
  return mexeu?v:null;
}

/* var(--x) como TEXTO: o valor nao traz hex nenhum, entao a varredura
   passava batida e a letra ficava no tom do claro. Resolve-se a variavel na
   raiz e, quando ela guarda cor de verdade -- a que o mapa de VAR deixou
   intacta --, escreve-se ali o tom clareado. So no texto: o botao cheio
   continua com a cor da marca. */
var RAIZ=null;
function valorDaVar(nome){
  if(!RAIZ) RAIZ=getComputedStyle(document.documentElement);
  return (RAIZ.getPropertyValue(nome)||'').trim();
}
function resolveVar(valor,papel){
  if(papel==='VAR') return null;
  if(valor.indexOf('var(')<0) return null;
  var mexeu=false;
  var v=valor.replace(RE_VAR,function(m,nome){
    var orig=valorDaVar(nome);
    if(!orig||orig.charAt(0)!=='#') return m;
    var p=hexPra(orig.slice(1));
    if(isNaN(p[0])||isNaN(p[1])||isNaN(p[2])) return m;
    var n=corDoEscuro(p[0],p[1],p[2],papel);
    if(n[0]===p[0]&&n[1]===p[1]&&n[2]===p[2]) return m;
    mexeu=true; return pinta3(n);
  });
  return mexeu?v:null;
}

/* quebra "a: b; c: d !important;" em pares, respeitando parenteses e aspas */
function partes(txt){
  var out=[], nivel=0, aspas=0, ini=0, i, c;
  for(i=0;i<=txt.length;i++){
    c=txt.charAt(i);
    if(aspas){ if(c===String.fromCharCode(aspas)) aspas=0; continue; }
    if(c==='"'||c==="'"){ aspas=c.charCodeAt(0); continue; }
    if(c==='(') nivel++;
    else if(c===')') nivel--;
    else if((c===';'&&!nivel)||i===txt.length){
      var d=txt.slice(ini,i).trim(); ini=i+1;
      if(!d) continue;
      var k=d.indexOf(':'); if(k<0) continue;
      var prop=d.slice(0,k).trim().toLowerCase(), val=d.slice(k+1).trim(), imp=false;
      if(/!\s*important$/i.test(val)){ imp=true; val=val.replace(/!\s*important$/i,'').trim(); }
      if(prop&&val) out.push([prop,val,imp]);
    }
  }
  return out;
}

function varreRegras(regras,saida){
  for(var i=0;i<regras.length;i++){
    var r=regras[i];
    if(r.type===CSSRule.MEDIA_RULE){
      var cond=r.conditionText||(r.media&&r.media.mediaText)||'';
      if(/print/i.test(cond)) continue;              /* o papel nao tem tema */
      var dentro=[]; varreRegras(r.cssRules,dentro);
      if(dentro.length) saida.push('@media '+cond+'{'+dentro.join('')+'}');
      continue;
    }
    if(r.type===CSSRule.SUPPORTS_RULE){
      var d=[]; varreRegras(r.cssRules,d);
      if(d.length) saida.push('@supports '+r.conditionText+'{'+d.join('')+'}');
      continue;
    }
    if(r.type!==CSSRule.STYLE_RULE||!r.style) continue;
    /* A REGRA E LIDA PELO TEXTO, e nao pela lista de propriedades.
       Quando o valor traz var(), o navegador quebra o atalho em
       propriedades longas e devolve VAZIO em cada uma: percorrendo
       r.style[i] o "background: var(--surface)" simplesmente nao existe, e
       a barra do alto continuava branca no escuro. Em r.style.cssText a
       declaracao esta inteira, como foi escrita. */
    var decl='', pedacos=partes(r.style.cssText);
    for(var j=0;j<pedacos.length;j++){
      var p=pedacos[j][0], v=pedacos[j][1], imp=pedacos[j][2]?' !important':'';
      if(p.indexOf('--')===0) continue;   /* a variavel e ambigua: ver resolveVar */
      var papel=papelDe(p), base=v;
      if(v.indexOf('var(')>=0){
        var nvv=resolveVar(v,papel);
        if(nvv) base=nvv;
        else if(v.indexOf('#')<0&&v.indexOf('rgb')<0) continue;
      } else if(v.indexOf('#')<0&&v.indexOf('rgb')<0) continue;
      var nv=traduz(base,papel);
      if(nv===null) nv=(base!==v)?base:null;
      if(nv===null||nv===v) continue;
      decl+=p+':'+nv+imp+';';
    }
    if(decl) saida.push(r.selectorText+'{'+decl+'}');
  }
}


/* ---------- A MARCA POR TEMA ----------
   A marca e uma so': simbolo laranja e escrita preta. No tema escuro a
   escrita clareia -- preto sobre preto nao se le --, e o simbolo fica onde
   esta, porque a cor dele E a marca. Antes o desenho inteiro virava laranja
   no escuro: ficava bonito e ficava diferente do papel timbrado, do PDF e
   da mesma marca vista no tema claro.
   O desenho e um SVG em base64 dentro do src, entao nao da para trocar por
   CSS; mas da para abrir, trocar a cor e fechar de novo, em vez de carregar
   um segundo arquivo de 12 kB. O original fica guardado no proprio elemento
   para o caminho de volta. */
var ESCURO_DA_MARCA='#141414';
function recolore(uri,de,pra){
  var marca='data:image/svg+xml;base64,';
  if(uri.indexOf(marca)!==0) return null;
  var svg; try{ svg=atob(uri.slice(marca.length)); }catch(e){ return null; }
  if(svg.toLowerCase().indexOf(de.toLowerCase())<0) return null;
  var re=new RegExp(de.replace('#','#'),'gi');
  try{ return marca+btoa(svg.replace(re,pra)); }catch(e){ return null; }
}
var CLARO_DA_MARCA='#EDEDEA';
/* Em cima de que fundo este desenho esta? Sobe ate achar um fundo pintado
   de verdade -- e' a folha do recibo, o cartao da entrada, a barra. */
function fundoClaro(im){
  var el=im.parentNode, c, m, L;
  while(el && el.nodeType===1){
    try{ c=getComputedStyle(el).backgroundColor; }catch(e){ return false; }
    if(c && c.indexOf('rgb')===0){
      m=c.match(/[\d.]+/g);
      if(m && m.length>2 && (m.length<4 || parseFloat(m[3])>0.5)){
        L=(0.2126*(+m[0])+0.7152*(+m[1])+0.0722*(+m[2]))/255;
        return L>0.62;
      }
    }
    el=el.parentNode;
  }
  return false;
}
var imprimindo=false;
/* LOGO EM ARQUIVO (<img src="rm-logo.svg">, como na Medicao da PU): o mesmo
   desenho, so' que fora da pagina -- e so' o embutido era recolorido, entao
   no escuro a escrita ficava preta no cartao escuro do login. Lido uma vez
   e recolorido igual; ate chegar, fica como esta. */
var SVG_LIDO={};
function svgDoArquivo(u){
  if(SVG_LIDO[u]!==undefined) return SVG_LIDO[u];
  SVG_LIDO[u]=null;
  try{
    fetch(u).then(function(r){ return r.ok?r.text():''; }).then(function(tx){
      if(tx.indexOf('<svg')<0) return;
      SVG_LIDO[u]='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(tx)));
      trocaMarca(lido());
    }).catch(function(){});
  }catch(e){}
  return null;
}
function trocaMarca(t){
  var q=document.querySelectorAll('img[src^="data:image/svg+xml;base64,"],img[src$=".svg"],img[data-rm-claro]'), i, im, novo, claro, base;
  for(i=0;i<q.length;i++){
    im=q[i];
    /* O original guardado e' sempre o da marca preta: se o desenho chegou ja'
       clareado (copiado de outro logo depois da troca), desfaz antes de
       guardar -- senao, de volta ao claro, a escrita ficava clara no claro. */
    if(im.getAttribute('data-rm-claro')===null) im.setAttribute('data-rm-claro',recolore(im.src,CLARO_DA_MARCA,ESCURO_DA_MARCA)||im.src);
    claro=im.getAttribute('data-rm-claro');
    novo=null;
    /* so' a escrita clareia; o simbolo ja e laranja e laranja fica */
    if(t==='escuro' && !imprimindo && !fundoClaro(im)){
      base=claro.indexOf('data:')===0 ? claro : (/\.svg(?:[?#].*)?$/i.test(claro) ? svgDoArquivo(claro) : null);
      if(base) novo=recolore(base,ESCURO_DA_MARCA,CLARO_DA_MARCA);
    }
    if(novo){ if(im.src!==novo) im.src=novo; }
    else if(im.src!==claro) im.src=claro;
  }
  /* SVG em linha (a Central desenha assim) ja segue currentColor: para ele
     basta a cor do texto, que a folha de correcao ja virou. */
}
/* A IMPRESSAO E' SEMPRE A DO PAPEL. O timbrado do orcamento e o cabecalho
   das contas moram na propria tela: no tema escuro a escrita deles clareia,
   e sairiam brancos no branco. O afterprint nao chega em todo navegador --
   nem quando a pagina e' so' clonada para virar PDF --, entao ha um prazo
   de volta. */
(function(){
  var devolve=null;
  function volta(){
    if(devolve){ clearTimeout(devolve); devolve=null; }
    imprimindo=false;
    try{ trocaMarca(lido()); }catch(e){}
  }
  try{
    window.addEventListener('beforeprint',function(){
      imprimindo=true;
      try{ trocaMarca('claro'); }catch(e){}
      if(devolve) clearTimeout(devolve);
      devolve=setTimeout(volta,4000);
    });
    window.addEventListener('afterprint',volta);
  }catch(e){}
})();

/* ---------- O BOTAO ----------
   Vai na barra do alto de cada sistema. Se nao houver barra reconhecivel,
   ele se vira num canto -- nenhum sistema fica sem o interruptor. */
function poeBotao(){
  if(document.getElementById('rm-bt-tema')) return;
  var b=document.createElement('button');
  b.id='rm-bt-tema'; b.type='button';
  b.setAttribute('aria-label','Alternar tema claro e escuro');
  b.title='Tema claro / escuro';
  b.onclick=function(){ window.rmTemaAlterna(); };
  /* a barra do alto tem nome diferente em cada sistema: .in, -in, -inner.
     Com a lista incompleta o botao caia solto embaixo da barra. */
  var casa=document.querySelector('.appbar .in')||document.querySelector('.appbar-in')
         ||document.querySelector('.appbar-inner')||document.querySelector('.appbar')
         ||document.querySelector('.topbar-right')||document.querySelector('.topbar')
         ||document.querySelector('header');
  if(casa){ b.className='rm-bt-tema'; casa.appendChild(b); }
  else { b.className='rm-bt-tema rm-bt-solto'; document.body.appendChild(b); }
  var css=document.createElement('style');
  css.textContent='.rm-bt-tema{width:30px;height:30px;padding:0;flex:0 0 auto;cursor:pointer;'
    +'border:1px solid var(--line,#e6e6e1);border-radius:8px;background:transparent;'
    +'color:inherit;font-size:15px;line-height:1;display:inline-flex;align-items:center;'
    +'justify-content:center;opacity:.75;transition:.12s}'
    +'.rm-bt-tema:hover{opacity:1}'
    +'.rm-bt-solto{position:fixed;right:14px;bottom:14px;z-index:9999;'
    +'background:var(--surface,#fff);box-shadow:0 2px 10px rgba(0,0,0,.18)}';
  /* o simbolo vai por JS, e nao por content: no CSS o escape e "\\25D1" sem
     o "u", e com o "u" o navegador imprime as letras do codigo. Por JS o
     caractere entra direto e nao ha escape para errar. */
  document.head.appendChild(css);
}


/* ---------- ESTILO ESCRITO NO PROPRIO ELEMENTO ----------
   A folha de correcao nao alcanca style="color:var(--red)" no atributo: ali
   a cor vence qualquer folha. Sao poucos casos, mas ficam justamente em
   botoes -- no Orcamento, "Calcular perfil (fora de catalogo)" saia em
   3,90:1. Entao o atributo tambem e traduzido, guardando o original no
   proprio elemento para o caminho de volta. Um observador cobre o que o
   sistema desenha depois; ele so vive enquanto o escuro esta ligado. */
var OLHO=null;
function temCor(v){ return v && (v.indexOf('#')>=0||v.indexOf('rgb')>=0||v.indexOf('var(')>=0); }
/* O ORIGINAL DE UM ESTILO QUE O SISTEMA MEXEU DEPOIS DA TRADUCAO. O script
   troca UMA propriedade (el.style.color = ...) num atributo que ja tem as
   outras traduzidas: o que continua igual ao que escrevemos volta ao valor
   original guardado; o que mudou e o original novo. Tomar o atributo
   inteiro como original traduziria de novo o que ja estava traduzido. */
function originalAtual(el){
  var orig=el.getAttribute('data-rm-style'), saida=el.getAttribute('data-rm-saida'), atual=el.style.cssText;
  if(orig===null||saida===null) return atual;
  var O={}, S={}, res=[], i, a=partes(atual);
  partes(orig).forEach(function(p){ O[p[0]]=p; });
  partes(saida).forEach(function(p){ S[p[0]]=p[1]; });
  for(i=0;i<a.length;i++){ var nm=a[i][0];
    res.push(S[nm]!==undefined&&S[nm]===a[i][1]&&O[nm]?O[nm]:a[i]); }
  return res.map(function(p){ return p[0]+':'+p[1]+(p[2]?' !important':''); }).join(';');
}
function traduzInline(el){
  var orig=el.getAttribute('data-rm-style');
  if(orig===null){ orig=el.style.cssText||''; el.setAttribute('data-rm-style',orig); }
  if(!temCor(orig)) return;
  var pe=partes(orig), fora='', mudou=false, j;
  for(j=0;j<pe.length;j++){
    var p=pe[j][0], v=pe[j][1], imp=pe[j][2]?' !important':'';
    if(p.indexOf('--')===0){ fora+=p+':'+v+imp+';'; continue; }
    var papel=papelDe(p), base=v, nv=null;
    if(v.indexOf('var(')>=0){ var rv=resolveVar(v,papel); if(rv){ base=rv; nv=rv; } }
    var t=traduz(base,papel); if(t!==null) nv=t;
    if(nv&&nv!==v) mudou=true;
    fora+=p+':'+(nv||v)+imp+';';
  }
  if(!mudou) return;
  el.setAttribute('style',fora);
  fora=el.style.cssText;   /* na forma do navegador: e' assim que ele relê */
  /* GUARDA O QUE ESCREVEMOS. Uma bandeira ligada e desligada em volta do
     setAttribute nao serve: o observador e microtarefa, roda DEPOIS, com a
     bandeira ja desligada. Sem isto ele relia a propria saida como se fosse
     o original, traduzia de novo -- e a traducao da traducao muda outra vez,
     o que gera outra mutacao. Laco infinito, e a tela travava. Foi o que
     aconteceu no Almocos, que pinta centenas de celulas por estilo no
     atributo. Comparando com o que escrevemos, a nossa propria escrita e
     reconhecida e ignorada. */
  el.setAttribute('data-rm-saida',fora);
}
var PENDENTE=null;
/* UMA PASSADA POR RAJADA, e nao uma por mutacao.
   O Almocos redesenha a grade do mes inteira a cada clique numa celula:
   centenas de nos novos de uma vez, cada um com estilo no atributo. Reagindo
   a CADA mutacao -- e cada traducao gera a sua propria mutacao de volta -- o
   trabalho cresce com o quadrado do tamanho da tabela e a tela deixa de
   responder. Medido: cinco redesenhos no escuro estouravam quinze segundos.
   Agora a rajada inteira vira UMA varredura, adiada por 120 ms. */
function agenda(){
  if(PENDENTE) return;
  PENDENTE=setTimeout(function(){
    PENDENTE=null;
    var q=document.querySelectorAll('[style]'), i;
    for(i=0;i<q.length;i++) traduzInline(q[i]);
  },120);
}
function inlineLiga(){
  var q=document.querySelectorAll('[style]'), i;
  for(i=0;i<q.length;i++) traduzInline(q[i]);
  if(OLHO||!window.MutationObserver) return;
  /* TODAS as mutacoes da rajada, e nao so' a primeira: o selo de nuvem
     pinta a palavra e a bolinha no mesmo instante, e so' a primeira era
     reconhecida -- a outra era retraduzida a partir do estilo antigo
     guardado e a cor nova se perdia (o cinza do claro no escuro, 3,7:1). */
  OLHO=new MutationObserver(function(ms){
    var algo=false;
    for(var i=0;i<ms.length;i++){
      var m=ms[i];
      if(m.type==='attributes'){
        var el=m.target; if(!el.getAttribute||!el.style) continue;
        /* a nossa propria escrita nao conta como mudanca */
        if(el.style.cssText===el.getAttribute('data-rm-saida')) continue;
        var novo=originalAtual(el);
        el.removeAttribute('data-rm-saida');
        el.setAttribute('data-rm-style',novo);
        algo=true;
      } else if(m.addedNodes&&m.addedNodes.length) algo=true;
    }
    if(algo) agenda();
  });
  OLHO.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['style']});
}
function inlineDesliga(){
  if(PENDENTE){ clearTimeout(PENDENTE); PENDENTE=null; }
  if(OLHO){ OLHO.disconnect(); OLHO=null; }
  var q=document.querySelectorAll('[data-rm-style]'), i, el, o;
  for(i=0;i<q.length;i++){ el=q[i]; o=el.getAttribute('data-rm-style');
    if(o) el.setAttribute('style',o); else el.removeAttribute('style');
    el.removeAttribute('data-rm-style'); el.removeAttribute('data-rm-saida'); }
}

var ESTILO=null;
function monta(){
  if(ESTILO) return;
  var saida=[], folhas=document.styleSheets;
  for(var i=0;i<folhas.length;i++){
    var f=folhas[i], regras=null;
    if(f.ownerNode&&(f.ownerNode.id==='rm-tema-escuro'||f.ownerNode.id==='rm-tema-veu')) continue;
    try{ regras=f.cssRules; }catch(e){ continue; }   /* folha de outro dominio */
    if(regras) varreRegras(regras,saida);
  }
  ESTILO=document.createElement('style');
  ESTILO.id='rm-tema-escuro';
  /* TUDO dentro de @media screen. Nao basta pular as regras de @media print
     ao derivar: as regras comuns valem na tela E no papel, e no Orcamento a
     folha da tela E a folha que imprime -- com o escuro ligado sairia papel
     preto na impressora. Assim a correcao so existe em tela. */
  ESTILO.textContent='@media screen{\n'+saida.join('\n')+'\n}';
  /* NO FIM DO <body>, e nao no <head>.
     A correcao tem a MESMA especificidade da regra que corrige -- ela e' a
     mesma regra, so' com a cor virada. Entre duas regras de igual peso vence
     a que vem depois no documento, e no <head> ela vinha ANTES de toda folha
     escrita dentro do <body>. Sistema com folha no corpo ficava metade
     escuro, metade claro: no Leitor, a aba de cobertura e fechamento inteira
     continuava branca porque o <style> dela mora no fim da pagina. */
  (document.body||document.head||document.documentElement).appendChild(ESTILO);
}
function desmonta(){ if(ESTILO&&ESTILO.parentNode)ESTILO.parentNode.removeChild(ESTILO); ESTILO=null; }
/* FOLHA QUE CHEGA DEPOIS TAMBEM PRECISA SER LIDA.
   O monta() varre as folhas existentes e guarda o resultado num <style> so'.
   Mas o cabecalho padrao, a barra e o pe de impressao sao modulos que criam a
   PROPRIA folha em tempo de execucao -- e eles rodam depois deste bloco. As
   regras deles nunca passavam pelo derivador: no escuro o cabecalho ficava
   branco no meio da tela preta, com o desenho preto por cima do branco.
   Aqui uma folha nova manda refazer a derivacao. Adiado por 80 ms porque
   eles chegam em rajada -- refazer uma vez por folha seria varrer tudo tres
   vezes seguidas por nada. */
var REFAZ=null;
function refazDepois(){
  if(REFAZ) return;
  REFAZ=setTimeout(function(){
    REFAZ=null;
    if(lido()!=='escuro'){ if(VEU_ESPERA) tiraVeu(); return; }
    desmonta(); monta();
    /* O desenho da marca do cabecalho e' inserido junto com a folha dele, e
       tambem chega depois do pinta() inicial: sem esta chamada ele ficava
       preto sobre preto, um fantasma no meio do cartao. O trocaMarca guarda
       o original em data-rm-claro, entao chamar de novo nao acumula. */
    try{ trocaMarca('escuro'); }catch(e){}
    if(VEU_ESPERA) tiraVeu();
  },80);
}
try{
  new MutationObserver(function(ms){
    for(var i=0;i<ms.length;i++){
      var a=ms[i].addedNodes||[];
      for(var k=0;k<a.length;k++){
        var n=a[k];
        if(!n||n.nodeType!==1) continue;
        if(n.id==='rm-tema-escuro'||n.id==='rm-tema-veu') continue;   /* a nossa propria */
        if(n.tagName==='STYLE'||n.tagName==='LINK'){ refazDepois(); return; }
      }
    }
  }).observe(document.head||document.documentElement,{childList:true});
}catch(e){}
/* O corpo tambem, quando ele existir: varios modulos penduram a folha deles
   no fim do <body>, e nao na cabeca. Sem subtree de proposito -- vigiar a
   arvore inteira acordaria o derivador a cada insercao de elemento, e ha
   tela que redesenha SVG (com <style> dentro) a cada quadro. */
function vigiaCorpo(){
  if(!document.body||!window.MutationObserver) return;
  try{
    new MutationObserver(function(ms){
      for(var i=0;i<ms.length;i++){
        var a=ms[i].addedNodes||[];
        for(var k=0;k<a.length;k++){
          var n=a[k];
          if(!n||n.nodeType!==1||n.id==='rm-tema-escuro') continue;
          if(n.tagName==='STYLE'||n.tagName==='LINK'){ refazDepois(); return; }
        }
      }
    }).observe(document.body,{childList:true});
  }catch(e){}
}

function tomOk(t){ return t==='suave'||t==='nitido'?t:'forte'; }
function tomLido(){ try{ return tomOk(localStorage.getItem(CHAVE_TOM)); }catch(e){ return 'forte'; } }
var TOM_MONTADO=null;
function pinta(t,tom){
  t=(t==='escuro')?'escuro':'claro';
  tom=tomOk(tom);
  TOM=TONS[tom];
  document.documentElement.setAttribute('data-theme',t);
  document.documentElement.setAttribute('data-tom',tom);
  if(document.body){ document.body.setAttribute('data-theme',t); document.body.setAttribute('data-tom',tom); }
  /* trocou a intensidade com o escuro ligado: a folha derivada e o estilo
     do atributo foram traduzidos com o chao antigo, entao refaz os dois */
  if(t==='escuro' && TOM_MONTADO && TOM_MONTADO!==tom){ desmonta(); inlineDesliga(); }
  if(t==='escuro'){ monta(); inlineLiga(); TOM_MONTADO=tom; }
  else { desmonta(); inlineDesliga(); TOM_MONTADO=null; }
  trocaMarca(t);
  var bt=document.getElementById('rm-bt-tema');
  var m=modo(t,tom);
  if(bt){ bt.textContent = m==='escuro' ? '●' : m==='suave' ? '◐' : m==='nitido' ? '◒' : '◑';
          bt.title = m==='escuro' ? 'Tema escuro — clique para o claro'
                   : m==='suave'  ? 'Tema escuro suave — clique para o escuro nítido'
                   : m==='nitido' ? 'Tema escuro nítido — clique para o escuro'
                                  : 'Tema claro — clique para o escuro suave'; }
  try{ window.dispatchEvent(new CustomEvent('rm:tema',{detail:{tema:t,tom:tom}})); }catch(e){}
}
/* os estados que a pessoa enxerga: claro, suave, nítido e escuro */
function modo(t,tom){ return t!=='escuro' ? 'claro' : (tom==='suave'||tom==='nitido' ? tom : 'escuro'); }
function lido(){ try{ return localStorage.getItem(CHAVE)==='escuro'?'escuro':'claro'; }catch(e){ return 'claro'; } }
function grava(t,tom){
  try{ localStorage.setItem(CHAVE,t); localStorage.setItem(CHAVE_TOM,tom); }catch(e){}
  /* A Central embrulha os sistemas num quadro. Avisa quem esta em volta e
     quem esta dentro, para a escolha valer no conjunto e nao so nesta aba.
     Entre abas do mesmo endereco quem avisa e o evento 'storage', abaixo. */
  var msg={rm:'tema',tema:t,tom:tom};
  try{ if(window.parent&&window.parent!==window) window.parent.postMessage(msg,'*'); }catch(e){}
  try{ var q=document.querySelectorAll('iframe'),i;
       for(i=0;i<q.length;i++) q[i].contentWindow&&q[i].contentWindow.postMessage(msg,'*');
  }catch(e){}
}
/* rmTema() devolve 'claro' ou 'escuro', como sempre; rmTema('suave') liga
   o escuro suave, rmTema('escuro') o escuro de sempre. */
window.rmTema=function(t){ if(t===undefined) return lido();
  var tom=tomOk(t);
  t=(t==='escuro'||t==='suave'||t==='nitido')?'escuro':'claro';
  grava(t,tom); pinta(t,tom); return t; };
window.rmTemaModo=function(){ return modo(lido(),tomLido()); };
/* o botao anda do mais claro para o mais escuro: claro, suave, nítido, escuro */
window.rmTemaAlterna=function(){
  var m=window.rmTemaModo();
  return window.rmTema(m==='claro' ? 'suave' : m==='suave' ? 'nitido' : m==='nitido' ? 'escuro' : 'claro');
};

window.addEventListener('storage',function(e){ if(e.key===CHAVE||e.key===CHAVE_TOM) pinta(lido(),tomLido()); });
window.addEventListener('message',function(e){
  var m=e.data; if(!m||m.rm!=='tema') return;
  /* quem nao manda o tom (versao velha) nao mexe nele */
  var tom=(m.tom==='suave'||m.tom==='forte'||m.tom==='nitido')?m.tom:tomLido();
  try{ localStorage.setItem(CHAVE,m.tema==='escuro'?'escuro':'claro'); localStorage.setItem(CHAVE_TOM,tom); }catch(x){}
  pinta(m.tema,tom);
});

/* A PORTA ACOMPANHA O TOM. A tela de login é escura de propósito (até no
   claro), com uma cor fixa que a tradução do escuro não toca -- então ela
   saía igual no escuro, no suave e no nítido. No suave e no nítido ela vai
   para o fundo da página do tom (o mesmo dos sistemas já abertos). */
function porta(){
  if(document.getElementById('rm-tema-porta')) return;
  var e=document.createElement('style'); e.id='rm-tema-porta';
  e.textContent='html[data-theme="escuro"][data-tom="nitido"] #loginScreen{background-color:#222224!important}'
    +'html[data-theme="escuro"][data-tom="suave"] #loginScreen{background-color:#333435!important}';
  (document.head||document.documentElement).appendChild(e);
}
/* SEM CLARAO AO ABRIR NO ESCURO. A traducao so roda com a pagina inteira
   lida (DOMContentLoaded), mas o navegador ja pinta antes disso o que leu
   ate ali -- e pintava CLARO: ao passar do Painel para a Medicao o cartao
   de login piscava branco por um decimo de segundo. Com o escuro gravado,
   uma cortina na cor do chao do tom cobre a pagina ate a traducao ficar
   pronta. Ela sai sozinha em 6 s se algo der errado -- nunca deixa a tela
   vazia (1,5 s era pouco: num aparelho lento a pagina ainda nao tinha
   terminado de ler e o Corte aparecia claro do mesmo jeito). Sem transicao enquanto ela esta posta: o campo com
   "transition" animava do branco ao escuro e piscava claro do mesmo jeito;
   o calculo e' forcado ANTES de tirar a cortina, para a troca ja ter
   acontecido quando a transicao voltar. */
var VEU=null;
function poeVeu(){
  if(lido()!=='escuro'||document.readyState!=='loading') return;
  var c=rgbDe(TONS[tomLido()].chao,0,0);
  VEU=document.createElement('style'); VEU.id='rm-tema-veu';
  VEU.textContent='html{background:rgb('+c.join(',')+')!important}body{opacity:0!important}'
    +'*,*::before,*::after{transition:none!important}';
  (document.head||document.documentElement).appendChild(VEU);
  setTimeout(function(){ tiraVeu(true); },6000);
}
/* A cortina espera a folha que ainda vai ser traduzida: o login (e outros
   modulos) penduram a propria folha logo depois do DOMContentLoaded, e ela
   so' e' lida 80 ms depois -- num aparelho lento o cartao do login do Corte
   aparecia branco nesse meio. */
var VEU_ESPERA=false;
function tiraVeu(forca){
  if(!VEU) return;
  if(REFAZ&&!forca){ VEU_ESPERA=true; return; }
  VEU_ESPERA=false;
  try{ void document.documentElement.offsetWidth; }catch(e){}
  if(VEU.parentNode) VEU.parentNode.removeChild(VEU); VEU=null;
}
function comeca(){ try{ porta(); poeBotao(); vigiaCorpo(); pinta(lido(),tomLido()); } finally{ setTimeout(function(){ tiraVeu(); },0); } }
try{ poeVeu(); }catch(e){}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',comeca);
else comeca();
})();

</script>

  try{ svg=atob(uri.slice(marca.length)); }catch(e){ return uri; }
  if(svg.indexOf('viewBox="0 0 805.51')<0) return null;   /* no viewBox, nao numa coordenada solta */
  if(/#(F0F0F0|f0f0f0|FFFFFF|ffffff|FFF|fff)"/.test(svg)){
    try{ return marca+btoa(svg.replace(/#(F0F0F0|f0f0f0|FFFFFF|ffffff|FFF|fff)"/g,'#141414"')); }
    catch(e){ return uri; }
  }
  return uri;
}
/* A ASSINATURA VEM EMBUTIDA, e nao de uma busca pela pagina.
   Procurar era economico -- aproveitava o desenho que o sistema ja tinha --,
   mas dependia de ele estar no documento naquele instante e com a cor certa.
   Bastou um sistema em que o unico desenho mora na tela de login para o
   cabecalho aparecer sem marca depois de entrar. Doze kB por arquivo pagam
   para isso nao ter como acontecer, em nenhum estado da tela.
   A busca continua como ULTIMO recurso, para o caso de a constante nao
   chegar por algum motivo. */
function assinatura(){
  if(typeof RM_ASSINATURA==='string'&&RM_ASSINATURA.indexOf('data:image/svg+xml;base64,')===0)
    return RM_ASSINATURA;
  var nomes=['LOGO','LOGO_RM','RM_LOGO','DEFAULT_RM_LOGO','DEFAULT_LOGO','LOGO_TEXTO'], i, v, u;
  for(i=0;i<nomes.length;i++){ v=window[nomes[i]];
    if(typeof v==='string'&&v.indexOf('data:image/svg+xml;base64,')===0){
      u=paraOEscuroDaMarca(v); if(u) return u; } }
  var q=document.querySelectorAll('img[src^="data:image/svg+xml;base64,"]');
  for(i=0;i<q.length;i++){ u=paraOEscuroDaMarca(q[i].src); if(u) return u; }
  return null;
}
function estilo(){
  if(document.getElementById('rm-cab-css')) return;
  var e=document.createElement('style'); e.id='rm-cab-css';
  e.textContent=
   '.rm-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;'
  +'padding:26px 30px 20px;position:relative;background:var(--surface,#fff);'
  +'border-width:1px;border-style:solid;border-color:var(--line,#e6e6e1);'
  +'border-bottom-width:0;border-radius:12px 12px 0 0;margin-bottom:0}'
  +'.rm-cab::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;'
  +'background:var(--rm-laranja,#F24619);-webkit-print-color-adjust:exact;print-color-adjust:exact}'
  +'.rm-cab .logo img{height:52px;width:auto;display:block}'
  /* A COR AQUI E EXPLICITA, e nao var(--muted). Cada sistema define o seu
     --muted, e em dois deles ele e #9AA0A6: no branco isso da 2,64:1, muito
     abaixo do minimo de 4,5:1 -- o bloco da empresa sumia. #5F6670 da 5,63:1
     em qualquer um deles, e no tema escuro o derivador cuida do resto. */
  +'.rm-cab .co{text-align:right;font-size:11.5px;font-weight:530;color:#5F6670;line-height:1.6;letter-spacing:.02em}'
  +'.rm-cab .co .nm{font-size:10.5px;font-weight:700;color:#474E5C;'
  +'text-transform:uppercase;letter-spacing:.11em;margin-bottom:3px}'
  +'.rm-cab .co .rot{display:inline-block;margin-top:6px;font-size:10px;letter-spacing:.18em;'
  +'text-transform:uppercase;color:var(--red,#D53309);font-weight:700}'
  /* A QUEBRA PARA CELULAR SO VALE NA TELA. A folha A4 com 12 mm de margem
     tem 703 px uteis -- abaixo do ponto de quebra -- e sem o "screen" o
     cabecalho saia INVERTIDO no papel: os dados da empresa em cima e a
     assinatura embaixo. Medido no PDF, nao suposto. */
  +'@media screen and (max-width:720px){.rm-cab{flex-direction:column-reverse;align-items:flex-start;'
  +'padding:16px 16px 14px}.rm-cab .co{text-align:left}.rm-cab .logo img{height:42px}}'
  /* O CARTAO E' PAPEL TIMBRADO, E PAPEL TIMBRADO SERVE AO PAPEL.
     Na tela ele custava 145px por dia e nao dizia nada de novo: a barra
     do alto ja traz a marca e o nome do sistema, e CNPJ, telefone e
     endereco so' interessam a quem recebe o documento impresso.
     Entao some da tela e sai inteiro na impressao -- conferido
     emulando media print: na tela display:none, no papel display:flex
     com os 145px e os dados todos.
     Vai no FIM desta folha, que e' a mesma que desenha o cartao: assim
     nao ha disputa de forca com nada, e a regra mora ao lado do que ela
     desliga. */
  +'.rm-cab .tb2{display:flex;gap:14px;text-align:left;align-self:center}'
  +'.tb2 .tb2-c{text-align:left!important}.rm-cab .tb2-c+.tb2-c{border-left:1px solid #e1e4e8;padding-left:14px}'
  +'.rm-cab .tb2-rz{font-weight:700;color:#141414}'
  +'.rm-cab-tipo{position:absolute;left:0;top:100%;margin-top:10px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;'
  +'color:var(--red,#D53309);font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}'
  /* no papel, na medida do relatorio: as duas colunas ao lado da logo numa A4 */
  +'@media print{.rm-cab{padding:12px 0 12px;border:0;border-radius:0;margin-bottom:30px}.rm-cab .logo img{height:34px}'
  +'.rm-cab .co{font-size:9.5px;letter-spacing:.01em}}'
  +'@media screen{.rm-cab{display:none}}';
  document.head.appendChild(e);
}
function rotulo(){
  if(typeof window.RM_ROTULO==='string'&&window.RM_ROTULO) return window.RM_ROTULO;
  var t=(document.title||'').split(/[—|·-]/)[0].trim();
  return t||'';
}
/* Onde o cabecalho entra. Alguns sistemas tem um recipiente com nome
   conhecido; outros (o Almocos) penduram o conteudo direto no corpo. Nesses,
   entra-se ANTES do primeiro bloco grande que vem depois da barra do alto --
   nunca dentro da barra, nunca antes dela. */
/* A ORDEM E: barra do sistema em cima, cabecalho embaixo dela. Em alguns
   sistemas a barra mora DENTRO do mesmo recipiente do conteudo (a Calculadora
   PU e assim), e entrar no topo do recipiente jogava o cabecalho por cima da
   barra -- o contrario do padrao. Entao pula-se o que for barra antes de
   entrar. */
function ehBarra(e){
  if(!e||e.nodeType!==1) return false;
  var c=' '+(e.className||'')+' ', t=e.tagName;
  if(t==='HEADER'||t==='NAV') return true;
  if(/appbar|topbar|navbar|toolbar|barra/i.test(c)) return true;
  var cs=getComputedStyle(e);
  return cs.position==='sticky'||cs.position==='fixed';
}
function depoisDaBarra(pai){
  var n=pai.firstChild;
  while(n && (n.nodeType!==1 || ehBarra(n))) n=n.nextSibling;
  return n;
}
function casa(){
  var sel=['.wrap','main','#app','.container','.conteudo'], i, e;
  for(i=0;i<sel.length;i++){ e=document.querySelector(sel[i]);
    if(e) return {pai:e, antes:depoisDaBarra(e)}; }
  var q=document.body.children, passou=false;
  for(i=0;i<q.length;i++){
    e=q[i];
    var cs=getComputedStyle(e);
    if(cs.position==='fixed'||cs.position==='sticky'||/appbar|topbar|header/i.test(e.className||'')){ passou=true; continue; }
    if(!passou) continue;
    if(cs.display==='none') continue;
    if(!e.offsetHeight) continue;   /* o primeiro bloco VISIVEL depois da barra,
                                       e nao o primeiro bloco ALTO: com um piso
                                       de altura o cabecalho pulava a faixa de
                                       filtros e caia no meio da tela */
    return {pai:document.body, antes:e};
  }
  return null;
}
function poe(){
  if(document.querySelector('.rm-cab')||document.querySelector('.head')) return;
  var onde=casa(), src=assinatura();
  if(!onde) return;
  estilo();
  var d=document.createElement('div');
  d.className='rm-cab';
  d.innerHTML=(src?'<div class="logo"><img src="'+src+'" alt="'+EMPRESA.nome+'"></div>':'<div class="logo"></div>')
   /* timbrado em duas colunas (PADRAO_RM.md, Papel): razao social e CNPJ |
      endereco e cidade. Sem o nome fantasia (a logo ja diz) e sem o
      telefone (esta no rodape); o nome do sistema vai em laranja embaixo. */
   +'<div class="co tb2">'
   +'<div class="tb2-c"><div class="tb2-rz">'+EMPRESA.razao+'</div><div>CNPJ '+EMPRESA.cnpj+'</div></div>'
   +'<div class="tb2-c"><div>'+EMPRESA.endereco+'</div><div>'+EMPRESA.cidade+'</div></div>'
   +'</div>';
  onde.pai.insertBefore(d,onde.antes||null);
  /* o tipo fica DENTRO do cartao, logo abaixo do fio: fora dele herdava o
     recuo do recipiente de cada sistema e saia desalinhado da logo */
  if(rotulo()){ var tp=document.createElement('div'); tp.className='rm-cab-tipo'; tp.textContent=rotulo(); d.appendChild(tp); }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',poe);
else poe();
})();

</script>

<!-- ============ O IMPRESSO ============ -->
<script>
/* ===========================================================================
   O IMPRESSO — o mesmo pe e a mesma marca d'agua nos quinze.

   Estes doze sistemas imprimem a PROPRIA TELA (o Recibos e o Orcamento
   montam documentos a parte e ja foram tratados la). Entao o que falta aqui
   nao e reescrever a folha: e o pe da papelaria e a marca d'agua.

   Os dois vao em position:fixed, que no papel se repete em TODA pagina --
   absolute marcaria so a primeira. E os dois ficam confinados a @media
   print: na tela nao aparecem.

   A marca d'agua vai POR CIMA, em multiply, e nao por baixo: por baixo ela
   some atras de cada bloco com fundo, e o que sobra nas frestas parece
   defeito de impressao. Em multiply ela escurece em vez de tapar -- 5% igual
   em toda a folha -- e sobre o texto preto nao muda nada.
   =========================================================================== */
(function(){
"use strict";
var FONE='51 99789-7879', INSTA='@rm.estruturas', SITE='www.rmestruturas.com.br';

function simbolo(){
  /* O SIMBOLO DA BARRA E' LARANJA, SEMPRE.
     A busca pegava o primeiro simbolo que encontrasse, de qualquer cor: no
     Orcamento o primeiro da pagina e a marca d'agua, preta, e a barra dele
     ficava com um simbolo preto ao lado de catorze laranjas. Agora a cor faz
     parte do que se procura -- e se so' houver o desenho preto, ele sai
     laranja daqui mesmo, que e a mesma marca.
     O numero tem de estar no viewBox: procurando '145.33' solto, ele casava
     com uma COORDENADA qualquer do caminho da assinatura, e a marca d'agua
     saia com a assinatura inteira deitada no meio da folha. */
  var nomes=['LOGO_SIMBOLO','RM_SIMBOLO','RM_SIMBOLO_BARRA','LOGO_MARCA_DAGUA','RM_MARCA_DAGUA'];
  var LARANJA='#F24619', i, t, preto=null, q;
  function abre(u){
    if(typeof u!=='string'||u.indexOf('data:image/svg+xml;base64,')!==0) return null;
    try{ t=atob(u.split(',')[1]); }catch(e){ return null; }
    return t.indexOf('viewBox="0 0 145.33')>=0 ? t : null;
  }
  for(i=0;i<nomes.length;i++){
    if(!abre(window[nomes[i]])) continue;
    if(t.indexOf(LARANJA)>=0) return window[nomes[i]];
    if(!preto) preto=window[nomes[i]];
  }
  q=document.querySelectorAll('img[src^="data:image/svg+xml;base64,"]');
  for(i=0;i<q.length;i++){
    if(!abre(q[i].src)) continue;
    if(t.indexOf(LARANJA)>=0) return q[i].src;
    if(!preto) preto=q[i].src;
  }
  if(preto){
    t=abre(preto);
    try{ return 'data:image/svg+xml;base64,'+btoa(t.replace(/#141414/gi,LARANJA)); }catch(e){}
    return preto;
  }
  return null;
}
/* A marca d'agua vai no ESCURO da marca, nao na laranja: a 5% de opacidade
   a laranja vira um rosa claro que nao le como marca d'agua -- parece
   mancha de impressora. O simbolo do pe, esse sim, fica laranja. */
function noEscuro(uri){
  var marca='data:image/svg+xml;base64,', svg;
  try{ svg=atob(uri.slice(marca.length)); }catch(e){ return uri; }
  try{ return marca+btoa(svg.replace(/#F24619|#f24619|#F24618|#f24618/g,'#141414')); }
  catch(e){ return uri; }
}
function poe(){
  if(document.getElementById('rm-pe-imp')) return;
  var sim=simbolo();
  /* O pe que o sistema ja tinha nao e o da papelaria: e uma linha de
     "atualizado em". Ele nao ganha um segundo pe embaixo -- some no papel e
     o texto dele desce para a nota do pe novo, que e onde ele cabe. */
  var velho=document.querySelector('.sheetfoot');
  var nota=velho?(velho.textContent||'').replace(/\s+/g,' ').trim():'';
  var css=document.createElement('style'); css.id='rm-imp-css';
  css.textContent=
   '@media screen{#rm-pe-imp,#rm-dagua-imp{display:none!important}}'
  /* "html body #id" e nao so "#id": ha sistema cujo CSS de impressao esconde
     TUDO o que nao seja o bloco que ele mesmo monta -- no Cheques a regra e
     "body > *:not(#printRoot){display:none!important}", que pesa mais que um
     id sozinho. Com os dois !important, quem tem mais peso vence, e o pe e a
     marca d'agua iam junto. Medido no papel, nao suposto. */
  +'@media print{'
  +'html body #rm-pe-imp{position:fixed!important;left:0;right:0;bottom:0;display:block!important;'
  +'border-top:1px solid #e6e6e1;padding:7px 0 3px;font-size:7.5pt;color:#6E747C;'
  +'letter-spacing:.06em;text-transform:uppercase;background:#fff;z-index:60;'
  +'-webkit-print-color-adjust:exact;print-color-adjust:exact}'
  +'#rm-pe-imp .lin{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;gap:8px}'
  +'#rm-pe-imp .c{text-align:center;font-weight:700;color:#6c7480}'
  +'#rm-pe-imp .d{text-align:right}'
  +'#rm-pe-imp .d img{height:15px;width:auto;display:inline-block;vertical-align:middle}'
  +'#rm-pe-imp .nota{margin-top:4px;text-align:center;font-size:6.5pt;color:#6F747A;'
  +'letter-spacing:.03em;text-transform:none}'
  +'.sheetfoot{display:none!important}'
  /* A BARRA DO APLICATIVO nao vai para o papel. Ela repete o nome do
     sistema que o cabecalho ja traz, e leva junto botoes que no papel
     nao servem -- saiam duas reguas laranja empilhadas na folha. */
  +'.appbar,.topbar,.no-print,.print-bar{display:none!important}'
  /* A FOLHA A4 com 12 mm de margem tem 703 px uteis, abaixo do ponto de
     quebra para celular da maioria destes sistemas (720 a 760 px). Sem isto
     o cabecalho sai INVERTIDO no papel -- dados da empresa em cima,
     assinatura embaixo. Medido no PDF. */
  +'.head,.rm-cab{flex-direction:row!important;align-items:flex-start!important}'
  +'.head .co,.rm-cab .co{text-align:right!important}'
  +'html body #rm-dagua-imp{position:fixed!important;inset:0;display:flex!important;align-items:center;justify-content:center;'
  +'pointer-events:none;z-index:50;opacity:.035;mix-blend-mode:multiply;'
  +'-webkit-print-color-adjust:exact;print-color-adjust:exact}'
  +'#rm-dagua-imp img{width:28%;max-width:190px;height:auto;display:block}'
  /* o fio da marca no papel e FINO e corre a linha inteira, como na
     papelaria -- a regua de 4px com o fio escuro embaixo saiu */
  +'.head::after,.rm-cab::after{height:2px!important;left:0!important;right:0!important;width:auto!important}'
  +'.head::before{display:none!important}'
  /* espaco para o pe nao encostar no conteudo */
  /* O pe e' fixo e tem fundo branco: com a folga so' no fim do corpo, ele
     TAMPAVA as ultimas linhas de cada pagina do meio (medido: numa lista de
     120 linhas sumiam a 48-49 e a 97-98). box-decoration-break:clone repete
     a folga no pe de CADA pagina -- o conteudo para antes do rodape. */
  +'body{padding-bottom:16mm!important;-webkit-box-decoration-break:clone;box-decoration-break:clone}'
  +'}';
  document.head.appendChild(css);

  var pe=document.createElement('div'); pe.id='rm-pe-imp'; pe.setAttribute('aria-hidden','true');
  pe.innerHTML='<div class="lin"><div class="e">'+FONE+' · '+INSTA+'</div>'
    +'<div class="c">'+SITE+'</div>'
    +'<div class="d">'+(sim?'<img src="'+sim+'" alt="">':'')+'</div></div>'
    +(nota?'<div class="nota">'+nota.replace(/</g,'&lt;')+'</div>':'');
  document.body.appendChild(pe);

  if(sim){
    var d=document.createElement('div'); d.id='rm-dagua-imp'; d.setAttribute('aria-hidden','true');
    d.innerHTML='<img src="'+noEscuro(sim)+'" alt="">';
    document.body.appendChild(d);
  }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',poe);
else poe();
})();

</script>

<!-- ============ A BARRA DO ALTO ============ -->
<script>
var RM_ROTULO="Controle de Máquinas";
/* ===========================================================================
   A BARRA DO ALTO — a mesma assinatura nos quinze.

   O padrao e o do leitor_dwg, que o Everton apontou: SIMBOLO em 24 px,
   "RM ESTRUTURAS" e, ao lado, o nome do sistema em letra miuda. As ACOES de
   cada sistema (botoes, selos, filtros) NAO sao tocadas -- muda so o canto
   esquerdo, que e o que identifica a casa.

   O simbolo nao e carregado de novo: pega-se o que o proprio sistema ja tem
   embutido, e so o SIMBOLO (viewBox 145.33), nunca a assinatura inteira --
   abaixo de uns 34 px o "ESTRUTURAS PRE-FABRICADAS" vira borrao.

   O selo de versao, quando existe, e preservado: ele e a unica forma de
   saber, num relance, se a pagina na tela e a que acabou de subir.
   =========================================================================== */
(function(){
"use strict";
function simbolo(){
  /* O SIMBOLO DA BARRA E' LARANJA, SEMPRE.
     A busca pegava o primeiro simbolo que encontrasse, de qualquer cor: no
     Orcamento o primeiro da pagina e a marca d'agua, preta, e a barra dele
     ficava com um simbolo preto ao lado de catorze laranjas. Agora a cor faz
     parte do que se procura -- e se so' houver o desenho preto, ele sai
     laranja daqui mesmo, que e a mesma marca.
     O numero tem de estar no viewBox: procurando '145.33' solto, ele casava
     com uma COORDENADA qualquer do caminho da assinatura, e a marca d'agua
     saia com a assinatura inteira deitada no meio da folha. */
  var nomes=['LOGO_SIMBOLO','RM_SIMBOLO','RM_SIMBOLO_BARRA','LOGO_MARCA_DAGUA','RM_MARCA_DAGUA'];
  var LARANJA='#F24619', i, t, preto=null, q;
  function abre(u){
    if(typeof u!=='string'||u.indexOf('data:image/svg+xml;base64,')!==0) return null;
    try{ t=atob(u.split(',')[1]); }catch(e){ return null; }
    return t.indexOf('viewBox="0 0 145.33')>=0 ? t : null;
  }
  for(i=0;i<nomes.length;i++){
    if(!abre(window[nomes[i]])) continue;
    if(t.indexOf(LARANJA)>=0) return window[nomes[i]];
    if(!preto) preto=window[nomes[i]];
  }
  q=document.querySelectorAll('img[src^="data:image/svg+xml;base64,"]');
  for(i=0;i<q.length;i++){
    if(!abre(q[i].src)) continue;
    if(t.indexOf(LARANJA)>=0) return q[i].src;
    if(!preto) preto=q[i].src;
  }
  if(preto){
    t=abre(preto);
    try{ return 'data:image/svg+xml;base64,'+btoa(t.replace(/#141414/gi,LARANJA)); }catch(e){}
    return preto;
  }
  return null;
}
function barra(){
  var sel=['.appbar .in','.appbar-in','.appbar-inner','.topbar-in','.appbar','.topbar','header'], i, e;
  for(i=0;i<sel.length;i++){ e=document.querySelector(sel[i]); if(e) return e; }
  return null;
}
function rotulo(){
  if(typeof window.RM_ROTULO==='string'&&window.RM_ROTULO) return window.RM_ROTULO;
  var t=(document.title||'').split(/[—|·-]/)[0].trim();
  return t||'';
}
function estilo(){
  if(document.getElementById('rm-barra-css')) return;
  var e=document.createElement('style'); e.id='rm-barra-css';
  e.textContent=
   '.rm-brand{display:flex;align-items:center;gap:10px;min-width:0;font-weight:800;'
  +'letter-spacing:.04em;text-transform:uppercase;font-size:14px;color:var(--ink,#16171a)}'
  +'.rm-brand .rm-simb{height:24px;width:auto;flex:none;display:block}'

  +'.rm-brand .sub{font-size:11px;color:var(--muted,#6E747C);text-transform:uppercase;'
  +'letter-spacing:.18em;font-weight:600;margin-left:2px;white-space:nowrap;'
  +'overflow:hidden;text-overflow:ellipsis}'
  +'@media (max-width:620px){.rm-brand .sub{display:none}}'
  +'@media print{.rm-brand{display:none!important}}';
  document.head.appendChild(e);
}
function poe(){
  var b=barra(); if(!b||document.querySelector('.rm-brand')) return;
  var sim=simbolo(); if(!sim) return;
  estilo();
  /* .topbar-brand entrou aqui pela aba de medicao da PU: sem ela o
     modulo nao achava o bloco de marca, inseria a assinatura nova no
     inicio da barra e o logo antigo continuava ao lado -- a marca
     aparecia duas vezes. */
  var alvo=b.querySelector('.brand,.topbar-brand');
  var selo=alvo?alvo.querySelector('[class*="pill"],[class*="ver"],[id*="er"][class]'):null;
  var d=document.createElement('div');
  d.className='rm-brand'+(alvo?(' '+alvo.className):'');
  d.innerHTML='<img class="rm-simb" src="'+sim+'" alt="RM Estruturas">'
    +'<span><b>RM</b> ESTRUTURAS</span>'
    +(rotulo()?'<span class="sub">'+rotulo()+'</span>':'');
  if(selo) d.appendChild(selo);
  if(alvo) alvo.parentNode.replaceChild(d,alvo);
  else b.insertBefore(d,b.firstChild);
  /* Onde a barra nao tinha um bloco de marca -- a Calculadora e o
     Pre-Moldados penduram o desenho solto -- o logo velho continuava ali ao
     lado do novo, e a marca aparecia duas vezes na mesma barra. Sai todo
     desenho da marca que nao seja o desta assinatura. */
  var q=b.querySelectorAll('img[src^="data:image/svg+xml;base64,"]'), i, im, svg;
  for(i=0;i<q.length;i++){
    im=q[i]; if(im.closest&&im.closest('.rm-brand')) continue;
    try{ svg=atob(im.src.split(',')[1]); }catch(e){ continue; }
    if(svg.indexOf('viewBox="0 0 145.33')>=0||svg.indexOf('viewBox="0 0 805.51')>=0){
      if(im.parentNode) im.parentNode.removeChild(im);
    }
  }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',poe);
else poe();
})();

</script>
