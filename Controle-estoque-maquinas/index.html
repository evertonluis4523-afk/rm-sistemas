  return h;
}

/* ---------- escolher QUAIS peças (mover, conserto, voltou) ----------
   Linha com etiqueta: marca-se a peça pelo número. Sem etiqueta: quantas. */
function htmlEscolhaPecas(m, pre){
  const etq = (m.etiquetas || []).filter(Boolean), q = Number(m.qtd) || 0;
  if (etq.length) return '<label>Quais peças</label><div class="etq-op">' + etq.map(e =>
    '<label><input type="checkbox" class="' + pre + 'Etq" value="' + esc(e) + '" checked> ' + esc(e) + '</label>').join('') + '</div>';
  return '<label>Quantas</label><input type="number" id="' + pre + 'Qtd" min="1" max="' + q + '" step="1" value="' + q + '">' +
    (q > 1 ? '<div class="mod-dica">De ' + q + ' peças nesta linha. Escolhendo menos, a linha se divide e o resto fica onde está.</div>' : '');
}
function lerEscolhaPecas(m, pre){
  const etq = (m.etiquetas || []).filter(Boolean), q = Number(m.qtd) || 0;
  if (etq.length) {
    const etqs = [...document.querySelectorAll('.' + pre + 'Etq:checked')].map(x => x.value);
    if (!etqs.length) { toast('Marque ao menos uma peça', true); return null; }
    return { qtd: etqs.length, etqs: etqs };
  }
  const qtd = Math.floor(Number($(pre + 'Qtd').value));
  if (!(qtd >= 1 && qtd <= q)) { toast('Quantidade entre 1 e ' + q, true); return null; }
  return { qtd: qtd, etqs: [] };
}
function resumoItem(m){
  return '<div class="mv-item"><b>' + esc(m.nome) + '</b><span>' + esc(m.modelo || 'sem modelo') + ' · ' +
    (m.situacao === 'manutencao' ? 'no conserto (de ' + esc(nomeLocal(m.setor)) + ')' : esc(nomeLocal(m.setor))) + ' · ' + (Number(m.qtd)||0) + ' pç</span></div>';
}
/* Tira qtd peças da linha. Se for a linha inteira, devolve ela mesma; senão
   nasce uma linha nova com a mesma compra, garantia e valor. */
function separar(m, qtd, etqs){
  const total = Number(m.qtd) || 0;
  etqs = etqs || [];
  if (qtd >= total && etqs.length >= (m.etiquetas || []).filter(Boolean).length) return m;
  const novo = JSON.parse(JSON.stringify(m));
  novo.id = uid('m'); novo.qtd = qtd; novo.etiquetas = etqs.slice();
  m.qtd = total - qtd;
  if (etqs.length) m.etiquetas = (m.etiquetas || []).filter(e => etqs.indexOf(e) < 0);
  db.maquinas.push(novo);
  return novo;
}
/* Junta com a linha igual do destino -- mas só se for igual de verdade:
   mesma compra, mesma garantia, mesmo valor e sem etiqueta. Juntar compras
   diferentes faria a garantia de uma valer para a outra. */
function juntavel(a, b){
  return a.id !== b.id && a.situacao === 'uso' && b.situacao === 'uso' && a.setor === b.setor &&
    chaveItem(a) === chaveItem(b) && !(a.etiquetas || []).filter(Boolean).length && !(b.etiquetas || []).filter(Boolean).length &&
    (a.dataCompra || '') === (b.dataCompra || '') && chave(a.fornecedor) === chave(b.fornecedor) &&
    (a.notaFiscal || '') === (b.notaFiscal || '') && String(a.garantiaMeses || '') === String(b.garantiaMeses || '') &&
    precoUnit(a) === precoUnit(b);
}
function juntar(r){
  const alvo = db.maquinas.find(x => juntavel(x, r));
  if (!alvo) return r;
  alvo.qtd = (Number(alvo.qtd) || 0) + (Number(r.qtd) || 0);
  db.maquinas = db.maquinas.filter(x => x.id !== r.id);
  return alvo;
}
function limparZerados(){ db.maquinas = db.maquinas.filter(m => (Number(m.qtd) || 0) > 0); }
function opcoesDestino(sel, exceto){
  const est = estoqueInternoAtual();
  return '<option value="">— escolha —</option>' + setoresProducao().concat(est ? [est] : []).filter(s => s.id !== exceto)
    .map(s => '<option value="' + s.id + '"' + (s.id === sel ? ' selected' : '') + '>' + esc(s.nome) + '</option>').join('');
}

/* ---------- MOVER ---------- */
function moverDialog(id, destino){
  const m = db.maquinas.find(x => x.id === id); if (!m) return;
  if (m.situacao === 'manutencao') { voltouConserto(id); return; }
  const est = estoqueInternoAtual();
  const dest = destino === 'estoque' ? (est ? est.id : '') : (destino || '');
  abrirModal('Mover máquina',
    resumoItem(m) + htmlEscolhaPecas(m, 'mv') +
    '<label>Para onde</label><select id="mvDest">' + opcoesDestino(dest, m.setor) + '</select>' +
    '<label>Motivo ou observação <span class="opc">(opcional)</span></label>' +
    '<input type="text" id="mvMotivo" autocomplete="off" placeholder="ex.: obra nova, emprestada, devolvida">' +
    '<div class="mod-dica">Fica no histórico da máquina, com a data e quem moveu. Exclusão definitiva só existe dentro do Estoque Interno.</div>',
    function(){
      const para = $('mvDest').value;
      if (!para) { toast('Escolha para onde vai', true); return; }
      const e = lerEscolhaPecas(m, 'mv'); if (!e) return;
      const de = m.setor;
      const r = separar(m, e.qtd, e.etqs);
      r.setor = para; r.situacao = 'uso'; delete r.conserto;
      juntar(r);
      registrar('mover', m, { qtd: e.qtd, de: nomeLocal(de), para: nomeLocal(para), deId: de, paraId: para,
        motivo: $('mvMotivo').value.trim(), etiquetas: e.etqs });
      limparZerados(); salvar(); fecharModal(); render();
      toast(e.qtd + ' peça(s) de ' + m.nome + ' → ' + nomeLocal(para));
    });
  $('ovOk').textContent = 'Mover';
}

/* ---------- CONSERTO ----------
   Manutenção continua sendo situação, não setor: a máquina no conserto é do
   setor de origem, e o Voltou sugere devolver para lá. O que mudou é que a
   ida passa a dizer onde, por quê, desde quando e até quando -- e a volta,
   quanto custou. */
function ondesConserto(){
  const por = {};
  db.maquinas.forEach(m => { const o = ((m.conserto || {}).onde || '').trim(); if (o) por[chave(o)] = o; });
  db.eventos.forEach(e => { const o = String(e.onde || '').trim(); if (o) por[chave(o)] = o; });
  return Object.values(por).sort((a,b) => a.localeCompare(b, 'pt-BR'));
}
function camposConserto(c){
  c = c || {};
  return '<label>Onde <span class="opc">(oficina, assistência)</span></label>' +
    '<input type="text" id="csOnde" list="csOndes" autocomplete="off" value="' + esc(c.onde || '') + '" placeholder="ex.: assistência técnica">' +
    '<datalist id="csOndes">' + ondesConserto().map(o => '<option value="' + esc(o) + '">').join('') + '</datalist>' +
    '<label>Motivo</label><input type="text" id="csMotivo" autocomplete="off" value="' + esc(c.motivo || '') + '" placeholder="o que deu">' +
    '<div class="bc-g"><div><label>Saiu em</label><input type="date" id="csSaida" value="' + esc(c.desde || hoje()) + '"></div>' +
    '<div><label>Previsão de volta</label><input type="date" id="csPrev" value="' + esc(c.previsao || '') + '"></div></div>';
}
function lerConserto(){
  return { desde: $('csSaida').value || hoje(), onde: $('csOnde').value.trim(), motivo: $('csMotivo').value.trim(), previsao: $('csPrev').value || '' };
}
function mandarConserto(id){
  const m = db.maquinas.find(x => x.id === id); if (!m || m.situacao !== 'uso') return;
  abrirModal('Mandar para conserto', resumoItem(m) + htmlEscolhaPecas(m, 'cs') + camposConserto(null), function(){
    const e = lerEscolhaPecas(m, 'cs'); if (!e) return;
    const c = lerConserto();
    const r = separar(m, e.qtd, e.etqs);
    r.situacao = 'manutencao'; r.conserto = c;
    registrar('conserto', m, { qtd: e.qtd, de: nomeLocal(m.setor), deId: m.setor, onde: c.onde, motivo: c.motivo,
      previsao: c.previsao, desde: c.desde, etiquetas: e.etqs });
    limparZerados(); salvar(); fecharModal(); render();
    toast(e.qtd + ' peça(s) de ' + m.nome + ' no conserto');
  });
  $('ovOk').textContent = 'Mandar para conserto';
}
function editarConserto(id){
  const m = db.maquinas.find(x => x.id === id); if (!m || m.situacao !== 'manutencao') return;
  abrirModal('Dados do conserto', resumoItem(m) + camposConserto(m.conserto), function(){
    m.conserto = lerConserto();
    salvar(); fecharModal(); render(); toast('Conserto atualizado');
  });
}
function voltouConserto(id){
  const m = db.maquinas.find(x => x.id === id); if (!m || m.situacao !== 'manutencao') return;
  const c = m.conserto || {}, d = diasFora(m);
  abrirModal('Voltou do conserto',
    resumoItem(m) +
    (c.desde || c.onde ? '<div class="mod-dica">No conserto' + (c.onde ? ' em ' + esc(c.onde) : '') +
      (c.desde ? ' desde ' + dataBR(c.desde) + ' (' + haDias(d) + ')' : '') + (c.motivo ? ' · ' + esc(c.motivo) : '') + '</div>' : '') +
    htmlEscolhaPecas(m, 'vc') +
    '<div class="bc-g"><div><label>Voltou em</label><input type="date" id="vcData" value="' + hoje() + '"></div>' +
    '<div><label>Custo do conserto</label><input type="text" id="vcCusto" inputmode="decimal" autocomplete="off" placeholder="R$ 0,00"></div></div>' +
    '<label>Volta para</label><select id="vcDest">' + opcoesDestino(setorPorId(m.setor) ? m.setor : '', '') + '</select>' +
    '<label>Observação <span class="opc">(opcional)</span></label><input type="text" id="vcObs" autocomplete="off" placeholder="ex.: trocada a escova">',
    function(){
      const para = $('vcDest').value;
      if (!para) { toast('Diga para onde ela volta', true); return; }
      const custo = numBR($('vcCusto').value);
      if (!Number.isFinite(custo) || custo < 0) { toast('Custo inválido', true); return; }
      const e = lerEscolhaPecas(m, 'vc'); if (!e) return;
      const data = $('vcData').value || hoje();
      const dias = c.desde ? Math.max(0, entreDias(c.desde, data)) : null;
      const r = separar(m, e.qtd, e.etqs);
      r.situacao = 'uso'; r.setor = para; delete r.conserto;
      juntar(r);
      registrar('voltou', m, { qtd: e.qtd, para: nomeLocal(para), paraId: para, onde: c.onde || '', motivo: c.motivo || '',
        desde: c.desde || '', voltou: data, dias: dias, custo: custo, obs: $('vcObs').value.trim(), etiquetas: e.etqs });
      limparZerados(); salvar(); fecharModal(); render();
      toast(m.nome + ' voltou para ' + nomeLocal(para));
    });
  $('ovOk').textContent = 'Registrar a volta';
}

/* ---------- FICHA DA MÁQUINA ----------
   Tudo de um item num lugar só: onde está cada peça, compra e garantia,
   valor, e o que aconteceu com ela -- a resposta para "essa furadeira já
   foi para o conserto quantas vezes?". */
function abrirFicha(id){
  const m = db.maquinas.find(x => x.id === id);
  ui.ficha = m ? chaveItem(m) : id;
  renderFicha();
}
function fecharFicha(){ ui.ficha = null; renderFicha(); }
const TITULO_EVENTO = { mover: 'Movida', conserto: 'Foi para o conserto', voltou: 'Voltou do conserto', entrada: 'Entrada',
  baixa: 'Baixa definitiva', ajuste: 'Cadastro alterado', conferencia: 'Conferência', termo: 'Termo de responsabilidade' };
function textoEvento(e){
  const q = e.qtd ? e.qtd + ' pç' : '';
  const por = e.por ? ' · ' + quemCurto(e.por) : '';
  let t = '';
  if (e.tipo === 'mover') t = [q, 'de ' + (e.de || '?'), 'para ' + (e.para || '?')].filter(Boolean).join(' ') + (e.motivo ? ' — ' + e.motivo : '');
  else if (e.tipo === 'conserto') t = [q, e.onde ? 'para ' + e.onde : '', e.de ? '(de ' + e.de + ')' : ''].filter(Boolean).join(' ') +
    (e.motivo ? '. Motivo: ' + e.motivo : '') + (e.previsao ? '. Previsão ' + dataBR(e.previsao) : '');
  else if (e.tipo === 'voltou') t = [q, e.para ? 'para ' + e.para : '', e.dias != null ? '· ' + e.dias + ' dia' + (e.dias === 1 ? '' : 's') + ' fora' : '',
    Number(e.custo) ? '· ' + moeda(e.custo) : ''].filter(Boolean).join(' ') + (e.obs ? ' — ' + e.obs : '');
  else if (e.tipo === 'entrada') t = [q, e.para ? 'em ' + e.para : '', e.fornecedor ? '· ' + e.fornecedor : '', e.notaFiscal ? '· NF ' + e.notaFiscal : ''].filter(Boolean).join(' ') +
    (e.motivo ? ' — ' + e.motivo : '');
  else if (e.tipo === 'baixa') t = [q, e.de ? 'de ' + e.de : ''].filter(Boolean).join(' ');
  else t = e.texto || '';
  return t + por;
}
function historicoItem(k){
  const out = db.eventos.filter(e => e && e.k === k).map(e => Object.assign({}, e));
  db.auditorias.forEach(a => {
    if (!a) return;
    const q = Number(a.quando) || Date.parse((a.data || '') + 'T12:00:00Z') || 0;
    const mesmo = x => chave(x.nome) + '|' + chave(x.modelo) === k;
    const p = txt => out.push({ tipo: 'conferencia', quando: q, data: a.data, texto: (a.setorNome || '') + ': ' + txt });
    (a.faltas || []).forEach(x => { if (mesmo(x)) p('faltando — achou ' + (x.achou || 0) + ' de ' + x.esperado + (x.etiqueta ? ' (' + x.etiqueta + ')' : '')); });
    /* As conferências fechadas a partir desta versão já registram o conserto
       e a máquina a mais como eventos; derivar de novo daqui duplicaria. */
    if (a.comEventos) return;
    (a.manutencao || []).forEach(x => { if (mesmo(x)) p('marcada para o conserto' + (x.etiqueta ? ' (' + x.etiqueta + ')' : '')); });
    (a.adicionadas || []).forEach(x => { if (mesmo(x)) p('achada a mais — ' + (x.texto || '')); });
  });
  db.termos.forEach(t => {
    const it = (t.itens || []).find(i => i.k === k);
    if (it) out.push({ tipo: 'termo', quando: t.quando, data: t.data,
      texto: (t.setorNome || '') + ': ' + it.qtd + ' pç sob responsabilidade de ' + (t.responsavel || '?') });
  });
  return out.sort((a,b) => (Number(b.quando) || 0) - (Number(a.quando) || 0));

/* ---------- TERMO DE RESPONSABILIDADE POR SETOR ----------
   A lista do que o encarregado recebe, assinada por ele no aparelho -- como
   a ficha de EPI. Quando o setor muda (máquina que entra, sai ou vai para o
   conserto), o termo fica "desatualizado" até alguém assinar de novo. */
function itensTermo(sid){
  return doSetor(sid).map(m => ({ k: chaveItem(m), nome: m.nome, modelo: m.modelo || '', qtd: Number(m.qtd) || 0,
    etiquetas: (m.etiquetas || []).filter(Boolean) }));
}
function assinaturaItens(itens){
  const por = {};
  (itens || []).forEach(i => { const p = por[i.k] || (por[i.k] = { q: 0, e: [] }); p.q += Number(i.qtd) || 0; p.e = p.e.concat(i.etiquetas || []); });
  return Object.keys(por).sort().map(k => k + ':' + por[k].q + ':' + por[k].e.slice().sort().join(',')).join(';');
}
function ultimoTermo(sid){ return db.termos.filter(t => t && t.setor === sid).sort((a,b) => (b.quando || 0) - (a.quando || 0))[0] || null; }
function termoEmDia(t){ return !!t && assinaturaItens(t.itens) === assinaturaItens(itensTermo(t.setor)); }
function seloTermo(s){
  const t = ultimoTermo(s.id);
  const rot = !t ? 'Termo de responsabilidade' : (termoEmDia(t) ? 'Termo ✓ ' + dataBR(t.data).slice(0, 5) : 'Termo desatualizado');
  return '<button class="btn sm' + (!t ? '' : (termoEmDia(t) ? ' termo-ok' : ' termo-velho')) + '" onclick="termoSetor(\'' + s.id + '\')">' + rot + '</button>';
}

    'e que respondo pela guarda, conservação e uso correto deles neste setor. Comprometo-me a comunicar de imediato qualquer ' +
    'dano, perda, furto ou necessidade de conserto, a não emprestá-los nem retirá-los do setor sem registro, e a devolvê-los quando solicitado.';
}
let PAD = null;
function ligarPad(cv){
  const w = cv.offsetWidth, h = cv.offsetHeight, dpr = Math.max(1, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr); ctx.lineWidth = 2.3; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#141414';
  PAD = { cv: cv, ctx: ctx, tracos: 0, ativo: false, ult: null, pontos: 0 };
  /* coordenada na medida do quadro, e não da tela: a janela entra com uma
     animação de escala, e o retângulo da tela não é o tamanho do desenho */
  const pos = e => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) * w / b.width, (e.clientY - b.top) * h / b.height]; };
  cv.onpointerdown = e => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch(x){} PAD.ativo = true; PAD.ult = pos(e); PAD.pontos = 0; };
  cv.onpointermove = e => {
    if (!PAD.ativo) return;
    const p = pos(e); ctx.beginPath(); ctx.moveTo(PAD.ult[0], PAD.ult[1]); ctx.lineTo(p[0], p[1]); ctx.stroke();
    PAD.ult = p; PAD.pontos++;
  };
  cv.onpointerup = cv.onpointercancel = () => { if (PAD.ativo && PAD.pontos > 2) PAD.tracos++; PAD.ativo = false; };
}
function limparPad(){ if (!PAD) return; PAD.ctx.clearRect(0, 0, PAD.cv.width, PAD.cv.height); PAD.tracos = 0; }
function imagemPad(){
  const c = document.createElement('canvas'), w = 600, h = Math.max(1, Math.round(600 * PAD.cv.height / PAD.cv.width));
  c.width = w; c.height = h;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(PAD.cv, 0, 0, w, h);
  return c.toDataURL('image/png');
}

/* ---------- PDF: um caminho só para os três documentos ----------
   Relatório de conferência, valores e termo saem pela mesma ponte (Central
   -> printToPDF vetorial; sem ela, o "Salvar como PDF" do navegador). */
function enviarPDF(html, nome, okMsg){
  const fim = r => {
    if (r && r.ok) toast(okMsg || 'PDF pronto ✓');
    else if (!r || !r.cancelado) abrirPDFNoNavegador(html);
  };
  if (window.rmDesktop && typeof window.rmDesktop.salvarPDF === 'function') {
    (window.rmDesktop.abrirPDF || window.rmDesktop.salvarPDF)(html, nome).then(fim).catch(() => abrirPDFNoNavegador(html));
    return;
  }
  if (window.parent && window.parent !== window) {
    /* 'pdf:aceito' é o aviso de que a Central assumiu o pedido. Sem ele em
       600 ms, ninguém está ouvindo — cai no navegador em vez de deixar o
       botão morto. */
    let aceito = false;
    const ouvir = ev => {
      const m = ev.data;
      if (!m || typeof m !== 'object') return;
      if (m.rm === 'pdf:aceito') aceito = true;
      if (m.rm === 'pdf:fim') { window.removeEventListener('message', ouvir); fim(m); }
    };
    window.addEventListener('message', ouvir);
    try { window.parent.postMessage({ rm: 'pdf', html: html, nome: nome, abrir: true }, '*'); } catch(e){}
    setTimeout(() => { if (!aceito) { window.removeEventListener('message', ouvir); abrirPDFNoNavegador(html); } }, 600);
    return;
  }
  abrirPDFNoNavegador(html);
}

/* ---------- INVENTÁRIO ----------
   Era três abas para a mesma lista: Total geral (quantas), Valoração
   (quanto valem) e Garantia (até quando). Agora é uma tabela só, e o
   filtro de situação faz o papel das outras duas. */
function garantiaDoItem(linhas){
  const comp = linhas.map(m => ({ m: m, g: garantia(m) })).filter(x => x.g);
  if (!comp.length) return null;
  const conta = { vigente: 0, acabando: 0, vencida: 0, semprazo: 0 };
  comp.forEach(x => conta[x.g.estado] += (Number(x.m.qtd) || 0) || 1);
  const vivos = comp.filter(x => x.g.estado === 'acabando' || x.g.estado === 'vigente').map(x => x.g.fim).sort();
  return { conta: conta, proximo: vivos[0] || '' };
}

/* O cadastro também move, conserta e devolve -- pelo campo Setor ou
   Situação. O que mudou por ali entra no histórico como se fosse pelo botão,
   e renomear leva a história junto. */
function historicoDoCadastro(m, antes){
  const motivo = 'alterado no cadastro';
  if (antes.k !== chaveItem(m)) {
    if (!db.maquinas.some(x => x !== m && chaveItem(x) === antes.k)) { const mp = {}; mp[antes.k] = chaveItem(m); renomearHistorico(mp); }
    registrar('ajuste', m, { texto: 'nome/modelo era "' + antes.nome + (antes.modelo ? ' · ' + antes.modelo : '') + '"' });
  }
  if (antes.situacao !== m.situacao) {
    if (m.situacao === 'manutencao') {
      m.conserto = m.conserto || { desde: hoje(), onde: '', motivo: '', previsao: '' };
      registrar('conserto', m, { qtd: Number(m.qtd)||0, de: nomeLocal(m.setor), deId: m.setor, motivo: motivo, desde: m.conserto.desde });
    } else {
      const c = antes.conserto || {};
      registrar('voltou', m, { qtd: Number(m.qtd)||0, para: nomeLocal(m.setor), paraId: m.setor, onde: c.onde || '', desde: c.desde || '',
        dias: c.desde ? Math.max(0, entreDias(c.desde, hoje())) : null, custo: 0, obs: motivo });
      delete m.conserto;
    }
  } else if (antes.setor !== m.setor) {
    registrar('mover', m, { qtd: Number(m.qtd)||0, de: nomeLocal(antes.setor), para: nomeLocal(m.setor), deId: antes.setor, paraId: m.setor, motivo: motivo });
  }
  if (antes.qtd !== (Number(m.qtd)||0)) registrar('ajuste', m, { texto: 'quantidade ' + antes.qtd + ' → ' + (Number(m.qtd)||0) });
}

/* ---------- cadastros ---------- */
/* =========================================================================
   COMPRA E GARANTIA
   O que resolve a pergunta "esta furadeira ainda está na garantia?" não é a
   data de compra sozinha: é data + prazo. Comprada em 03/2025 não diz nada
   sem saber se a garantia era de 12 ou de 24 meses -- e no galpão convivem as
   duas. Por isso o prazo é campo, com 12 meses de sugestão, e não uma regra
   fixa no código.

   FORNECEDOR e NOTA FISCAL entram junto porque são o que a loja pede na hora
   de acionar: sem a nota, garantia no papel não vale nada.

   Tudo OPCIONAL. As 64 máquinas que já estão lá não têm como lembrar disso, e
   um campo obrigatório só faria ninguém cadastrar mais nada. Máquina sem data
   simplesmente não aparece no controle de garantia.

   Uma limitação que vale dizer: a garantia fica na LINHA, e uma linha pode ter
   2 peças. Se as duas foram compradas em datas diferentes, é caso de separar
   em duas linhas -- o sistema avisa isso na hora de cadastrar. */
const GARANTIA_PADRAO = 12;
function hojeISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function dataBR(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||''));
  return m ? (m[3] + '/' + m[2] + '/' + m[1]) : '';
}
/* Soma meses sem passar por Date com fuso: 31/01 + 1 mês tem de dar 28/02, e
   não 03/03 como o Date faria sozinho. */
function somaMeses(iso, meses){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||'')); if (!m) return '';
  let y = +m[1], mo = +m[2] - 1 + (Number(meses)||0), d = +m[3];
  y += Math.floor(mo / 12); mo = ((mo % 12) + 12) % 12;
  const ultimo = new Date(Date.UTC(y, mo + 1, 0)).getUTCDate();
  if (d > ultimo) d = ultimo;
  return y + '-' + String(mo+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
}
function diasAte(iso){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso||''))) return null;
  return Math.round((Date.parse(iso + 'T00:00:00Z') - Date.parse(hojeISO() + 'T00:00:00Z')) / 86400000);
}
/* null quando não há data de compra -- é o que separa "sem informação" de
   "fora da garantia", que são coisas muito diferentes. */
function garantia(m){
  const compra = String(m.dataCompra || '').trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(compra)) return null;
  const meses = Number(m.garantiaMeses);
  if (!Number.isFinite(meses) || meses <= 0) return { compra: compra, fim: '', estado: 'semprazo' };
  const fim = somaMeses(compra, meses), dias = diasAte(fim);
  return { compra: compra, meses: meses, fim: fim, dias: dias,
    estado: dias < 0 ? 'vencida' : (dias <= 60 ? 'acabando' : 'vigente') };
}
function selo(m){
  const g = garantia(m); if (!g) return '';
  if (g.estado === 'semprazo') return '<span class="gar sem">comprada ' + dataBR(g.compra) + '</span>';
  if (g.estado === 'vencida')  return '<span class="gar off">garantia venceu ' + dataBR(g.fim) + '</span>';
  if (g.estado === 'acabando') return '<span class="gar fim">garantia até ' + dataBR(g.fim) + ' · ' + g.dias + ' dia(s)</span>';
  return '<span class="gar ok">garantia até ' + dataBR(g.fim) + '</span>';
}
/* Fornecedores já digitados, para o campo sugerir em vez de deixar cada um
   escrever do seu jeito -- é a mesma doença do nome da máquina. */
function fornecedores(){
  const por = {};
  db.maquinas.forEach(m => { const f = (m.fornecedor||'').trim(); if (f) por[chave(f)] = f; });
  return Object.values(por).sort((a,b) => a.localeCompare(b,'pt-BR'));
}
/* ---------- de onde veio cada peça da soma ----------
   A soma responde "quantas eu tenho"; ela não responde "de quem eu comprei e
   quando". E é comum a mesma máquina ter vindo de fornecedores e datas
   diferentes -- é justamente aí que a garantia de uma vale e a da outra não.

   Por isso a linha somada abre. Fechada, o Total geral continua exatamente o
   que era; aberta, mostra compra por compra. Cada compra é uma LINHA do
   cadastro, então o que aparece aqui é a verdade do sistema e não um resumo
   à parte que pode divergir.

   O estado de aberto/fechado mora no ui e não no db: é jeito de olhar, não
   dado -- não faz sentido viajar para o celular do outro pela nuvem. */
function abreFecha(k){
  ui.abertos[k] = !ui.abertos[k];
  render();
}
function ordemCompra(a, b){
  const da = String(a.dataCompra||''), dbb = String(b.dataCompra||'');
  if (da && dbb) return da.localeCompare(dbb);
  if (da) return -1;
  if (dbb) return 1;
  return 0;
}
function detalheCompras(linhas, cols){
  const ls = linhas.slice().sort(ordemCompra);
  const semNada = ls.every(m => !m.dataCompra && !(m.fornecedor||'').trim());
  return '<tr class="det"><td colspan="' + cols + '"><div class="det-in">' +
    (semNada
      ? '<div class="det-vazio">Nenhuma destas peças tem compra registrada. ' +
        'Ao editar cada uma, preencha data, fornecedor e nota fiscal — a partir daí a garantia aparece aqui.</div>'
      : '') +
    '<table class="det-t"><thead><tr><th class="t-num">Qtd</th><th>Onde está</th>' +
      '<th>Compra</th><th>Fornecedor</th><th>Nota fiscal</th><th>Garantia</th><th></th></tr></thead><tbody>' +
    ls.map(m => {
      const s = m.situacao === 'manutencao' ? null : setorPorId(m.setor);
      const onde = m.situacao === 'manutencao'
        ? '<span class="pill manutencao">Manutenção</span>'
        : (s ? '<span class="setor-cor" style="display:inline-block;vertical-align:-2px;background:' + esc(s.cor) + '"></span> ' + esc(s.nome)
             : '<i style="color:var(--faint)">sem setor</i>');
      const sl = selo(m);
      return '<tr>' +
        '<td class="t-num mono">' + (Number(m.qtd)||0) + '</td>' +
        '<td>' + onde + '</td>' +
        '<td class="mono">' + (dataBR(m.dataCompra) || '<i style="color:var(--faint)">—</i>') + '</td>' +
        '<td>' + (esc(m.fornecedor||'') || '<i style="color:var(--faint)">—</i>') + '</td>' +
        '<td class="mono">' + (esc(m.notaFiscal||'') || '<i style="color:var(--faint)">—</i>') + '</td>' +
        '<td>' + (sl || '<i style="color:var(--faint)">—</i>') + '</td>' +
        '<td class="t-acao"><button class="btn sm" onclick="editarMaquina(\'' + m.id + '\')">Editar</button></td>' +
      '</tr>';
    }).join('') + '</tbody></table></div></td></tr>';
}
/* O botão que abre. Mostra de quantas compras a soma é feita, para dar motivo
   de clicar: "3 peças" não convida, "3 peças · 2 compras" convida. */
function botaoAbrir(k, linhas){
  const aberto = !!ui.abertos[k];
  const compras = new Set(linhas.map(m => (m.dataCompra||'') + '\u0000' + chave(m.fornecedor||''))).size;
  return '<button type="button" class="exp' + (aberto ? ' on' : '') + '" ' +
    'onclick="abreFecha(' + JSON.stringify(k).replace(/"/g,'&quot;') + ')" ' +
    'title="' + (aberto ? 'Fechar' : 'Ver data de compra e fornecedor') + '">' +
    '<span class="ch">▸</span>' + (linhas.length > 1 ? compras + ' compra' + (compras > 1 ? 's' : '') : 'compra') +
    '</button>';
}

function chipsGarantia(x){
  const c = x.conta, out = [];
  if (c.acabando) out.push('<span class="gar fim">' + c.acabando + ' vence' + (c.acabando>1?'m':'') +
    ' até ' + dataBR(x.proximo) + '</span>');
  if (c.vigente)  out.push('<span class="gar ok">' + c.vigente + ' na garantia</span>');
  if (c.semprazo) out.push('<span class="gar sem">' + c.semprazo + ' sem prazo</span>');
  if (c.vencida)  out.push('<span class="gar off">' + c.vencida + ' vencida' + (c.vencida>1?'s':'') + '</span>');
  return out.join(' ');
}

    /* ---- compra e garantia ----

    '<div class="bloco-compra"><div class="bc-t">Compra e garantia ' +
      '<span>opcional — serve para saber depois se ainda está na garantia</span></div>' +
      '<div class="bc-g">' +
        '<div><label>Data da compra</label>' +
          '<input type="date" id="fCompra" value="' + esc(m && m.dataCompra || '') + '"></div>' +
        '<div><label>Garantia (meses)</label>' +

      const bate = etq.filter(e => outras[e.toUpperCase()]);
      if (bate.length) toast('Atenção: ' + bate.join(', ') + ' já está em "' + outras[bate[0].toUpperCase()] + '"', true);
      if (m) {
        const antes = { setor: m.setor, situacao: m.situacao, qtd: Number(m.qtd)||0, k: chaveItem(m), nome: m.nome, modelo: m.modelo, conserto: m.conserto };
        Object.assign(m, dados);
        historicoDoCadastro(m, antes);
      } else {
        const nova = Object.assign({ id: uid('m') }, dados);
        if (nova.situacao === 'manutencao') nova.conserto = { desde: hoje(), onde: '', motivo: '', previsao: '' };
        db.maquinas.push(nova);
        registrar('entrada', nova, { qtd: nova.qtd, para: nomeLocal(nova.setor), fornecedor: nova.fornecedor, notaFiscal: nova.notaFiscal });
      }
      salvar(); fecharModal(); render();
      toast(m ? 'Máquina atualizada' : 'Máquina cadastrada');
    });
  ligarSugestoes('fNome', 'fMod', 'fSug', m ? m.id : null);
  ligarModelos(m ? m.id : null);
  ligarBuscaModeloEFornecedor();
  ligarPrecoBase('fNome','fMod','fPreco','fPrecoDica');
  ligarGarantia();
}

/* Sugere o valor do PDF assim que nome/modelo formam uma combinação conhecida.
   Depois que a pessoa digita no campo, a escolha manual é preservada. */
function ligarPrecoBase(nomeId, modeloId, precoId, dicaId){
  const n = $(nomeId), md = $(modeloId), p = $(precoId), d = $(dicaId);
  if (!n || !md || !p) return;
  const sugerir = () => {
    if (p.dataset.manual === '1' || Number(p.value) > 0) return;
    const v = precoBase(n.value,md.value);
    if (v > 0) {
      p.value = v.toFixed(2);
      if (d) d.textContent = 'Valor sugerido pela tabela de 03/09/2026. Pode ser alterado.';
    } else if (d) {
      d.textContent = 'Equipamento sem correspondência na tabela: informe o valor manualmente.';
    }
  };
  p.addEventListener('input', () => { p.dataset.manual = '1'; });
  n.addEventListener('input', sugerir); md.addEventListener('input', sugerir);
  n.addEventListener('blur', sugerir); md.addEventListener('blur', sugerir);
  sugerir();
}
/* Enquanto ele digita o nome, o campo Modelo passa a oferecer os modelos que
   já existem sob aquele nome -- e a dica embaixo diz quais são, porque no
   celular o datalist só aparece depois do primeiro toque. */
let MODELOS_ATUAIS = [];
function ligarModelos(exceto){
  const n = $('fNome'), dica = $('fModDica');
  if (!n) return;
  const f = () => {
    const ms = n.value.trim() ? modelosDe(n.value, exceto) : [];

      ? ('Já cadastrado com ' + (ms.length === 1 ? 'o modelo' : 'os modelos') + ': ' +
         ms.map(x => '<button type="button" class="mod-b" onclick="usarModelo(' + JSON.stringify(x).replace(/"/g,'&quot;') + ')">' +
           esc(x) + '</button>').join(' ') +
         '<span> — toque para usar o mesmo e não criar um item separado.</span>')
      : '';
  };
  n.addEventListener('input', f); n.addEventListener('focus', f); f();
}
/* ================= LISTA SUSPENSA PRESA AO CAMPO =================
   fMod/fForn nascem de novo (via innerHTML) cada vez que o modal abre,
   então a ligação usa delegação de eventos no document, feita uma
   única vez no carregamento -- sem isso cada abertura do modal
   empilharia mais um listener de clique. */
const BUSCAS_CAMPO = {};
function registrarBuscaCampo(inputId,boxId,obterItens,montarLinha,aoEscolher){
  BUSCAS_CAMPO[inputId] = {boxId,obterItens,montarLinha,aoEscolher,lista:[],idx:-1};
}
function buscaSimples(itens){ return q=>{const alvo=(q||'').toLowerCase(),todos=itens();return alvo?todos.filter(v=>v.toLowerCase().includes(alvo)):todos;}; }
function ligarBuscaModeloEFornecedor(){
  registrarBuscaCampo('fMod','fModSugg',buscaSimples(()=>MODELOS_ATUAIS),esc,v=>{$('fMod').value=v;});
  registrarBuscaCampo('fForn','fFornSugg',buscaSimples(fornecedores),esc,v=>{$('fForn').value=v;});
}
function bcFecha(box,st){box.classList.remove('open');box.innerHTML='';st.lista=[];st.idx=-1;}
function bcAbre(inp,box,st){
  st.lista=(st.obterItens(inp.value.trim())||[]).slice(0,10); st.idx=-1;
  if(!st.lista.length){bcFecha(box,st);return;}
  box.innerHTML=st.lista.map((it,i)=>'<div class="it" data-i="'+i+'">'+st.montarLinha(it)+'</div>').join('');
  box.querySelectorAll('[data-i]').forEach(x=>x.addEventListener('mousedown',ev=>{
    ev.preventDefault(); const it=st.lista[+x.dataset.i]; if(it==null)return;
    st.aoEscolher(it); bcFecha(box,st);
  }));
  box.classList.add('open');
}
document.addEventListener('input',e=>{
  const st=e.target.id&&BUSCAS_CAMPO[e.target.id]; if(!st)return;
  const box=$(st.boxId); if(box) bcAbre(e.target,box,st);
});
document.addEventListener('focus',e=>{
  const st=e.target.id&&BUSCAS_CAMPO[e.target.id]; if(!st)return;
  const box=$(st.boxId); if(box) bcAbre(e.target,box,st);
},true);
document.addEventListener('keydown',e=>{
  const st=e.target.id&&BUSCAS_CAMPO[e.target.id]; if(!st)return;
  const box=$(st.boxId); if(!box||!box.classList.contains('open'))return;
  if(e.key==='ArrowDown'){e.preventDefault();st.idx=Math.min(st.lista.length-1,st.idx+1);box.querySelectorAll('.it').forEach((x,i)=>x.classList.toggle('active',i===st.idx));}
  else if(e.key==='ArrowUp'){e.preventDefault();st.idx=Math.max(0,st.idx-1);box.querySelectorAll('.it').forEach((x,i)=>x.classList.toggle('active',i===st.idx));}
  else if(e.key==='Enter'&&st.idx>=0){e.preventDefault();const it=st.lista[st.idx];st.aoEscolher(it);bcFecha(box,st);}
  else if(e.key==='Escape'){bcFecha(box,st);}
});
document.addEventListener('click',e=>{
  Object.keys(BUSCAS_CAMPO).forEach(inputId=>{
    const st=BUSCAS_CAMPO[inputId], box=$(st.boxId);
    if(box&&box.classList.contains('open')&&!e.target.closest('#'+st.boxId)&&e.target.id!==inputId) bcFecha(box,st);
  });
});

/* Data + prazo só viram informação quando viram uma DATA DE FIM. Mostrar isso

/* =========================================================================

   ========================================================================= */

    /* O seletor de arquivo é o caminho que funciona em TODO lugar. O fetch
       acima só funciona quando a página vem de um servidor: dentro da
       Central instalada os sistemas abrem por file://, e aí o navegador
       bloqueia o fetch por CORS -- justamente onde a importação mais
       incomodaria falhar. */
    '<label style="margin-top:14px">Escolher o arquivo</label>' +

let _imp = null;

/* Só descreve o que veio; não grava nada. Ver "5 setores, 64 máquinas,
   85 peças" antes de confirmar é o que separa importar de apostar. */
function resumirImport(d){
  if (!d || !Array.isArray(d.setores) || !Array.isArray(d.maquinas)) {
    _imp = null; $('ovOk').disabled = true;
    $('impResumo').innerHTML = '<div class="alerta">Isto não parece um arquivo de importação: falta <code>setores</code> ou <code>maquinas</code>.</div>';
    return;
  }
  const total = d.maquinas.reduce((a,m) => a + (Number(m.qtd)||0), 0);
  const mnt = d.maquinas.filter(m => m.situacao === 'manutencao').reduce((a,m) => a + (Number(m.qtd)||0), 0);
  _imp = d; $('ovOk').disabled = false;
  $('impResumo').innerHTML =
    '<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:12px 14px;font-size:13px">' +
    '<b>' + d.setores.length + ' setores</b> · <b>' + d.maquinas.length + ' máquinas</b> · <b>' + total + ' peças</b>' +
    (mnt ? ' <span style="color:var(--mnt-fg)">(' + mnt + ' em manutenção)</span>' : '') +
    '<div style="margin-top:8px;color:var(--muted)">' +
    d.setores.map(s => '<span class="setor-cor" style="display:inline-block;vertical-align:-2px;background:' +
      esc(s.cor||'#999') + '"></span> ' + esc(s.nome) + ' (' +
      d.maquinas.filter(m => m.setor === s.id).reduce((a,m) => a + (Number(m.qtd)||0), 0) + ')').join('<br>') +
    '</div></div>';
}

/* Busca o import.json ao lado da página. Só funciona servido por http(s):
   por file:// o navegador recusa o fetch e cai no seletor de arquivo, que
   é o caminho de sempre. Por isso a falha aqui é silenciosa e não vermelha
   -- não é erro, é o app rodando de outro jeito. */
function buscarImport(){
  const local = location.protocol === 'file:';
  if (local) {
    $('impEstado').innerHTML = 'Escolha o arquivo <b>import.json</b> abaixo, ou cole o conteúdo.';
    return;
  }
  fetch('import.json', { cache: 'no-store' })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => { $('impEstado').innerHTML = 'Achei o <b>import.json</b> aqui do lado:'; resumirImport(d); })
    .catch(() => {
      $('impEstado').innerHTML = 'Não achei o <b>import.json</b> nesta pasta — escolha o arquivo ou cole o conteúdo.';
    });
}
function lerArquivo(inp){
  const f = inp.files && inp.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try { const d = JSON.parse(fr.result); $('impEstado').innerHTML = 'Do arquivo <b>' + esc(f.name) + '</b>:'; resumirImport(d); }
    catch(e){ _imp = null; $('ovOk').disabled = true;
      $('impResumo').innerHTML = '<div class="alerta">Este arquivo não é um JSON válido.</div>'; }
  };
  fr.onerror = () => { $('impResumo').innerHTML = '<div class="alerta">Não consegui ler o arquivo.</div>'; };
  fr.readAsText(f);
}
function lerColado(){
  const t = $('impTxt').value.trim();
  if (!t) { $('impEstado').textContent = 'Cole o conteúdo do arquivo.'; _imp = null; $('ovOk').disabled = true; $('impResumo').innerHTML = ''; return; }
  try { const d = JSON.parse(t); $('impEstado').textContent = 'Do texto colado:'; resumirImport(d); }
  catch(e){ _imp = null; $('ovOk').disabled = true;
    $('impResumo').innerHTML = '<div class="alerta">O texto não é um JSON válido. Cole o arquivo inteiro, do <code>{</code> ao <code>}</code>.</div>'; }
}

function aplicarImport(){
  if (!_imp) return;
  const total = _imp.maquinas.reduce((a,m) => a + (Number(m.qtd)||0), 0);
  if ((db.setores.length || db.maquinas.length) &&
      !confirm('Isto apaga o que está cadastrado (' + db.maquinas.length + ' máquinas) e põe ' +
               _imp.maquinas.length + ' no lugar.\n\nNão dá para desfazer. Continuar?')) return;
  /* Normaliza na entrada: id garantido, quantidade numérica, etiquetas
     sempre lista. Um json escrito à mão erra justamente nisso, e um campo
     torto aqui vira uma linha que não soma no total. */
  db.setores = _imp.setores.map((s,i) => ({
    id: s.id || uid('s'), nome: String(s.nome||'Setor '+(i+1)), cor: s.cor || CORES[i % CORES.length].hex,
    corNome: s.corNome || '', responsavel: String(s.responsavel||''), ordem: s.ordem != null ? s.ordem : i }));
  db.maquinas = _imp.maquinas.map(m => ({
    id: m.id || uid('m'), nome: String(m.nome||'').trim(), modelo: String(m.modelo||'').trim(),
    qtd: Math.max(0, Number(m.qtd)||0), setor: m.setor || '',
    situacao: m.situacao === 'manutencao' ? 'manutencao' : 'uso',
    etiquetas: Array.isArray(m.etiquetas) ? m.etiquetas.filter(Boolean).map(String) : [],
    preco: m.preco === undefined || m.preco === null || m.preco === '' ?
      precoBase(m.nome,m.modelo) : Math.max(0,Number(m.preco)||0),
    precoFonte: m.precoFonte || '' }))
    .filter(m => m.nome && m.qtd > 0);
  db.auditorias = db.auditorias || [];
  salvar(); fecharModal(); render();
  toast(db.setores.length + ' setores e ' + db.maquinas.length + ' máquinas · ' + total + ' peças');
}

/* ---------- nuvem ---------- */
function mostrarVersao(){ const e = $('appVer'); if (e) e.textContent = APP_VER; }
/* Botao de emergencia: limpa o cache do app instalado e recarrega da rede.
   E o que resolve "publiquei e o celular nao viu". */
function forcarAtualizacao(){
  if (!confirm('Buscar a versão mais nova do sistema?\n\nO estoque não é afetado.')) return;
  const fim = () => location.reload(true);
  if (!('caches' in window)) return fim();
  caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k))))
    .then(() => navigator.serviceWorker && navigator.serviceWorker.getRegistrations
      ? navigator.serviceWorker.getRegistrations().then(rs => Promise.all(rs.map(r => r.unregister())))
      : null)
    .then(fim).catch(fim);
}

/* ---------- Resposta da tela de entrada ----------
   O botao passa a dizer que esta trabalhando, e o cartao treme quando a senha
   nao confere -- as duas coisas que faltavam para a tela responder ao toque.*/
function loginCartao(){

function loginAviso(el){
  /* remover, forcar o recalculo e recolocar a classe reinicia a animacao:
     errar a senha duas vezes seguidas tem de tremer duas vezes, e sem o
     recalculo a segunda nao acontece, porque a classe ja estava la. */
  if(el){ el.classList.remove('on'); void el.offsetWidth; el.classList.add('on'); }
  var c=loginCartao();
  /* a classe fica: tirar ela devolveria o nome da animacao para a de entrada,
     e o cartao entraria de novo, inteiro, a cada erro. */
  if(c){ c.classList.remove('treme'); void c.offsetWidth; c.classList.add('treme'); }
}
function loginOcupado(v){

/* Girar o celular ou abrir num tablet muda a resposta de ehMobile(). Só

/* Instalação no celular ("adicionar à tela de início"). Sem o manifest e o
   service worker o navegador não oferece a opção, e o sistema abre dentro
   da barra do Chrome, com meia tela útil -- ruim justamente para quem anda
   pelo galpão com o aparelho na mão fazendo auditoria.

   Só registra quando o endereço é http(s). Dentro da RM Central os sistemas
   rodam de file://, onde service worker não vale; e se o aparelho já tiver
   um registrado de uma visita pelo navegador, aqui ele é removido -- senão
   uma cópia velha em cache poderia responder no lugar do arquivo que a
   Central acabou de sincronizar. */
if ('serviceWorker' in navigator) {
  if (location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => {
        /* O app instalado no celular nao navega de novo quando volta do
           multitarefa: fica no documento que ja estava aberto, que pode ser de
           semanas atras. Entao procura versao nova ao abrir E toda vez que a
           tela volta a aparecer. */
        const procurar = () => { try { reg.update(); } catch(e){} };
        procurar();
        document.addEventListener('visibilitychange', () => { if (!document.hidden) procurar(); });
        /* Assumindo o controle uma versao nova, recarrega uma unica vez para o
           usuario passar a ver o que foi publicado. */
        let jaTrocou = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (jaTrocou) return; jaTrocou = true; location.reload();
        });
      }).catch(()=>{});
    });
  } else {
    navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(()=>{});
  }
}

<script>
/* ===========================================================================
   O ESTADO DA NUVEM, IGUAL EM TODOS OS SISTEMAS

   Antes cada sistema dizia isso do seu jeito. Medido nos quinze, havia NOVE
   implementacoes diferentes e nenhuma igual a outra:

     Perfitec        syncDot     "conectando…"
     Almocos         fbStat      "local"
     Pre-moldados    saveStatus + fbBadge   (duas, separadas)
     Compras         syncChip    "● local"
     Obras           cloudBtn    "Local"
     Orcamento       syncStatus  "● local"
     Recibos         syncPill    "somente neste aparelho"
     Contas          syncPill    "somente neste aparelho"
     Calculadora PU  fbBadgePainel  "🔥 Firebase"

   -- e seis sistemas sem dizer nada. O da Calculadora era o pior: nascia com
   position:fixed, top:14px, right:20px, pendurado no <body> e nao na barra,
   entao pousava POR CIMA do botao de sair. Foi o que apareceu na tela do
   Everton.

   Aqui e' um so'. E ele nao pergunta nada a ninguem: le o estado direto do
   Firebase -- .info/connected para a conexao, onAuthStateChanged para o
   login. Sistema nenhum precisa avisar. Assim nao ha como um deles ficar
   para tras na proxima mudanca, que foi exatamente como se chegou a nove.

   Quatro estados, quatro frases, uma palavra so' para o caso bom:

     Nuvem               verde    conectado E autenticado
     Conectando          ambar    ainda tentando, ou logado sem resposta
     Só neste aparelho   cinza    sem Firebase, ou nao autenticado
     Sem conexão         vermelho tinha conexao e caiu

   A bolinha e' a mesma em todos: um circulo. Sem emoji, sem ⚠, sem ●
   desenhado com texto -- tres coisas que apareciam em sistemas diferentes e
   que nao se parecem entre si nem no mesmo tamanho de letra.
   =========================================================================== */
(function () {
  if (window.rmNuvem) return;

  var ESTADOS = {
    ligada:   { txt: 'Nuvem',             cor: '#1E8E4F', ponto: '#2CA05A',
                dica: 'Conectado ao Firebase — o que você grava aqui aparece nos outros aparelhos' },
    ligando:  { txt: 'Conectando',        cor: '#8A6D1F', ponto: '#D9A520',
                dica: 'Procurando o Firebase' },
    local:    { txt: 'Só neste aparelho', cor: '#6E747C', ponto: '#A8AEB6',
                dica: 'Sem nuvem: o que você grava fica só neste aparelho' },
    erro:     { txt: 'Sem conexão',       cor: '#B3123C', ponto: '#D93B5C',
                dica: 'A conexão com o Firebase caiu — os dados continuam salvos neste aparelho' }
  };

  /* Os selos antigos, um por sistema. Sao escondidos, e nao removidos: o
     codigo que os atualiza continua rodando e escrevendo neles, e apagar o
     no' faria esse codigo estourar num null no meio de um evento do
     Firebase. Escondido, ele escreve no vazio e ninguem se machuca. */
  var VELHOS = ['#fbBadgePainel', '#fbStat', '#fbBadge', '#syncDot', '#syncChip',
                '#syncPill', '#syncStatus', '#cloudBtn', '#pill.storage-pill'];

  var selo = null, estadoAtual = null;

  function estilo() {
    if (document.getElementById('rm-nuvem-css')) return;
    var s = document.createElement('style');
    s.id = 'rm-nuvem-css';
    s.textContent =
      '#rm-nuvem{display:inline-flex;align-items:center;gap:6px;flex:none;' +
      'font-size:11px;font-weight:650;letter-spacing:.02em;white-space:nowrap;' +
      'padding:4px 10px;border-radius:20px;background:rgba(127,127,127,.10);' +
      'font-family:inherit;cursor:default;user-select:none}' +
      '#rm-nuvem .rm-nuvem-ponto{width:8px;height:8px;border-radius:50%;flex:none;display:block}' +
      /* A COR DE CADA ESTADO MORA NA FOLHA, e nao no atributo style do selo.
         Escrita no elemento a cada troca, ela escapava da traducao do tema
         escuro numa das trocas (Conectando -> Só neste aparelho) e o cinza
         do claro ficava sobre a barra escura, a 3,7:1. Regra de folha o
         tema escuro sempre traduz. */
      Object.keys(ESTADOS).map(function (k) {
        return '#rm-nuvem[data-estado="' + k + '"]{color:' + ESTADOS[k].cor + '}' +
          '#rm-nuvem[data-estado="' + k + '"] .rm-nuvem-ponto{background:' + ESTADOS[k].ponto + '}';
      }).join('') +
      /* A palavra tambem no filho, e nao so' no selo: a barra da
         Calculadora PU escreve text-transform:uppercase nos filhos dela, e
         o selo saia "SO NESTE APARELHO" la' e "So neste aparelho" nos
         outros. Como e' CSS e nao texto, o teste que comparava o
         textContent dos quinze nao via diferenca nenhuma. */
      '#rm-nuvem .rm-nuvem-txt{text-transform:none;letter-spacing:.02em;font-size:11px;font-weight:650}' +
      /* Abaixo de 1100px fica so' a bolinha, que e' o que se olha de
         relance. Nao e' so' o telefone: medindo a 1024px, o selo inteiro
         empurrava a barra da Telha Termica e a do Controle de Obras para
         duas linhas -- 75px e 81px onde as outras treze tinham 52. */
      '@media screen and (max-width:1100px){#rm-nuvem{padding:4px;gap:0}' +
      '#rm-nuvem .rm-nuvem-txt{display:none}}' +
      VELHOS.join(',') + '{display:none!important}';
    (document.head || document.documentElement).appendChild(s);
  }

  /* ONDE O SELO MORA. Sempre na barra do alto, nunca pendurado no body com
     position:fixed -- foi assim que o da Calculadora foi parar em cima do
     botao de sair. Depois do .spacer quando existe (e' o empurrador que
     todas as barras usam), senao no fim do miolo da barra. */
  /* Achar a LINHA, e nao a barra.
     Na primeira versao eu pendurava o selo no .appbar quando nao havia
     .appbar-in. Em oito sistemas o .appbar e' um bloco que contem a linha dos
     botoes dentro dele: o selo caia DEPOIS da linha, abria uma segunda, e a
     barra inteira crescia 24px. Medi os quinze antes e depois e os oito
     estavam todos +24 -- foi assim que apareceu.

     Entao procura, nesta ordem: o empurrador (.spacer, que so' existe dentro
     da linha), depois quem de fato e' flex e contem a marca, e so' por ultimo
     a barra. */
  function linhaDaBarra(barra) {
    var esp = barra.querySelector('.spacer, .sp, .flex1');
    if (esp && esp.parentNode) return { pai: esp.parentNode, depoisDe: esp };
    var marca = barra.querySelector('img, .rm-simb, .brand, .logo');
    var p = marca && marca.parentElement;
    while (p && p !== barra.parentElement) {
      var d = getComputedStyle(p).display;
      if (d === 'flex' || d === 'grid') return { pai: p, depoisDe: null };
      p = p.parentElement;
    }
    var flex = [...barra.querySelectorAll('*')].filter(function (el) {
      var d = getComputedStyle(el).display;
      return (d === 'flex' || d === 'grid') && el.getBoundingClientRect().height > 0;
    })[0];
    if (flex) return { pai: flex, depoisDe: null };
    return { pai: barra, depoisDe: null };
  }
  function poe() {
    if (selo && selo.isConnected) return selo;
    var barra = document.querySelector('.appbar, .topbar, header');
    if (!barra) return null;
    estilo();
    selo = document.createElement('span');
    selo.id = 'rm-nuvem';
    selo.innerHTML = '<span class="rm-nuvem-ponto"></span><span class="rm-nuvem-txt"></span>';
    var onde = linhaDaBarra(barra);
    if (onde.depoisDe) onde.pai.insertBefore(selo, onde.depoisDe.nextSibling);
    else onde.pai.appendChild(selo);
    return selo;
  }

  function pinta(qual) {
    var e = ESTADOS[qual] || ESTADOS.local;
    estadoAtual = qual;
    var el = poe();
    if (!el) return;
    el.setAttribute('data-estado', ESTADOS[qual] ? qual : 'local');
    el.querySelector('.rm-nuvem-txt').textContent = e.txt;
    el.title = e.dica;
  }

  /* --------- de onde vem o estado ---------
     Do proprio Firebase, e nao de cada sistema avisando. Duas perguntas:
     ha' conexao (.info/connected) e ha' usuario (onAuthStateChanged). Verde
     so' com as duas respondidas -- "logado", como o Everton pediu. */
  var temConexao = null, temUsuario = null, jaTeveConexao = false;
  function decide() {
    if (temUsuario && temConexao) return pinta('ligada');
    if (temUsuario === false) return pinta('local');
    if (jaTeveConexao && temConexao === false) return pinta('erro');
    pinta('ligando');
  }

  function liga() {
    var fb = window.firebase;
    if (!fb || !fb.apps || !fb.apps.length) return false;
    try {
      if (fb.auth) {
        fb.auth().onAuthStateChanged(function (u) { temUsuario = !!u; decide(); });
      } else { temUsuario = true; }
      if (fb.database) {
        fb.database().ref('.info/connected').on('value', function (s) {
          temConexao = !!s.val();
          if (temConexao) jaTeveConexao = true;
          decide();
        });
      } else { temConexao = true; }
    } catch (e) { return false; }
    decide();
    return true;
  }

  /* O Firebase costuma ser inicializado depois deste bloco, e em alguns
     sistemas so' depois do login. Entao tenta, e se nao houver ainda,
     reprocura por um tempo -- desistindo em silencio, porque sistema sem
     nuvem e' um caso legitimo e nao um defeito. */
  function comeca() {
    pinta('ligando');
    if (liga()) return;
    pinta('local');
    var voltas = 0;
    var t = setInterval(function () {
      if (liga() || ++voltas > 40) clearInterval(t);   /* 40 x 500ms = 20s */
    }, 500);
  }

  /* Escape para quem sabe mais do que o .info/connected -- a Central, por
     exemplo, que le doze nos e sabe se as regras recusaram algum. */
  window.rmNuvem = function (estado) {
    if (estado && ESTADOS[estado]) pinta(estado);
    return estadoAtual;
  };
  window.rmNuvem.estados = Object.keys(ESTADOS);

  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', comeca);
  else comeca();
})();
</script>

  background:#4a3f3b center/cover no-repeat;outline:2px solid #F24619;outline-offset:3px;box-shadow:0 14px 32px rgba(0,0,0,.28);margin:20px 0 14px}
.rmp-foto span{font-size:42px;font-weight:800;color:#fff;letter-spacing:-.02em;font-family:inherit}
.rmp-foto.com-foto span{display:none}
.rmp-sauda{font-size:13px;font-weight:600;opacity:.65}
.rmp-nome{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.12;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmp-chip{margin-top:10px;display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:4px 4px 4px 12px;border-radius:999px;
  background:rgba(127,127,127,.1);border:1px solid rgba(127,127,127,.22);box-sizing:border-box}
.rmp-chip span{font-size:14px;font-weight:530;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rmp-link{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.rmp-chip .rmp-link{flex:none;font-size:13px;font-weight:700;color:#C1310B;padding:6px 11px;border-radius:999px;background:rgba(242,70,24,.13)}
.rmp-outra{display:none;width:100%;min-height:44px;font-size:14px;font-weight:600;margin-top:6px}
.rmp-outra span{opacity:.7}.rmp-outra b{color:#C1310B;font-weight:700}
.rmp-voltar{display:none;width:100%;min-height:40px;font-size:13px;font-weight:600;opacity:.7}
.rmp-voltar.on{display:block}
.rmp-lembrar{display:flex;align-items:center;gap:10px;min-height:40px;cursor:pointer;font-size:14px;font-weight:560;margin:2px 0 4px;position:relative;text-transform:none;letter-spacing:normal}
.rmp-lembrar input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.rmp-caixa{width:20px;height:20px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;
  border:1.5px solid rgba(127,127,127,.45);color:transparent;box-sizing:border-box;transition:background .15s,border-color .15s}
.rmp-lembrar input:checked+.rmp-caixa{background:#D53309;border-color:#D53309;color:#fff}
.rmp-lembrar input:focus-visible+.rmp-caixa{box-shadow:0 0 0 3px rgba(242,70,24,.3)}
.rmp-senha{position:relative;display:block;width:100%}
.rmp-senha input{width:100%;box-sizing:border-box;padding-right:46px!important}
.rmp-olho{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;background:none;cursor:pointer;
  color:inherit;opacity:.55;display:flex;align-items:center;justify-content:center;border-radius:10px}
.rmp-olho[aria-pressed="true"]{color:#F24619;opacity:1}
/* modo lembrado: a foto no lugar do logo, o nome do sistema vira uma linha
   pequena em cima; some o campo do e-mail e a caixa de lembrar */
.rmp-lembrado .rmp-conta{display:flex}
.rmp-lembrado .rmp-outra{display:block}
.rmp-lembrado .rmp-some,.rmp-lembrado .rmp-lembrar,.rmp-lembrado #loginLogo,.rmp-lembrado .lc-head>img,.rmp-lembrado .lc-head>svg{display:none!important}
/* sem o logo, o rotulo da empresa e o nome do sistema centralizam (na PU o
   rotulo era alinhado a direita, para ficar ao lado do logo) */
.rmp-lembrado .lc-head>*{text-align:center}
/* o icone do Entrar sem tamanho proprio enchia o botao inteiro (Compras) */
#loginBtn svg{width:16px;height:16px;flex:none}
/* 16px: o minimo para o iPhone nao ampliar a pagina ao tocar no campo */
@media (pointer:coarse){#loginScreen input{font-size:16px!important}}
</style>
<script id="rmPortaBloco">
(function(){
  if (window.__rmPorta) return; window.__rmPorta = 1;
  /* iPhone: sem zoom automatico ao tocar num campo (a pinca continua) */
  try {
    var ua = navigator.userAgent || '';
    if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) {
      var mv = document.querySelector('meta[name="viewport"]');
      if (mv && !/maximum-scale/.test(mv.content)) mv.setAttribute('content', mv.content + ', maximum-scale=1.0');
    }
  } catch(e){}

  var tela = document.getElementById('loginScreen'); if (!tela) return;
  var pass = tela.querySelector('input[type="password"]'); if (!pass) return;
  var card = pass.closest('.login-card,.login-box') || tela;
  var user = [].slice.call(card.querySelectorAll('input')).filter(function(i){ return i !== pass && i.type !== 'checkbox' && i.type !== 'hidden'; })[0];
  var btn = document.getElementById('loginBtn') || card.querySelector('button');
  if (!user || !btn) return;
  var CHAVE = 'rm_login_lembrado';   // a mesma chave da Central (mesmo endereco na internet)

  function lembrado(){ try { var v = JSON.parse(localStorage.getItem(CHAVE) || 'null'); return (v && v.email) ? v : null; } catch(e){ return null; } }
  function fotos(){ try { return JSON.parse(localStorage.getItem('rm_avatares_dispositivo') || '{}'); } catch(e){ return {}; } }
  function primeiroNome(nome, email){
    var n = String(nome || '').trim().split(/\s+/)[0];
    if (n) return n.charAt(0).toUpperCase() + n.slice(1);
    var l = String(email || '').split('@')[0].split(/[._-]/)[0];
    return l ? l.charAt(0).toUpperCase() + l.slice(1) : '';
  }
  function pelaMetade(email){
    var p = String(email || '').split('@'); if (!p[1]) return email || '';
    var l = p[0], m = l.length >= 6 ? 4 : Math.max(1, l.length - 2);
    return l.slice(0, m) + '•••@' + p[1];
  }
  function saudacao(){ var h = new Date().getHours(); return h >= 5 && h < 12 ? 'Bom dia,' : (h >= 12 && h < 18 ? 'Boa tarde,' : 'Boa noite,'); }
  function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

  /* ---- montagem ---- */
  // o campo do e-mail (com o rotulo dele) some no modo lembrado
  var linhaUser = user.closest('.f,.field');
  if (linhaUser && linhaUser.contains(pass)) linhaUser = null;
  if (linhaUser) linhaUser.classList.add('rmp-some');
  else { user.classList.add('rmp-some'); var lab = user.previousElementSibling; if (lab && lab.tagName === 'LABEL') lab.classList.add('rmp-some'); }

  var conta = el('div', 'rmp-conta',
    '<div class="rmp-foto" aria-hidden="true"><span></span></div>' +
    '<div class="rmp-sauda"></div><div class="rmp-nome"></div>' +
    '<div class="rmp-chip"><span></span><button type="button" class="rmp-link">Trocar</button></div>');
  var head = card.querySelector('.lc-head');
  if (head) head.appendChild(conta); else card.insertBefore(conta, card.firstChild);

  var caixa = el('label', 'rmp-lembrar',
    '<input type="checkbox" checked><span class="rmp-caixa" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>Lembrar meu e-mail neste aparelho');
  btn.parentNode.insertBefore(caixa, btn);
  var outra = el('button', 'rmp-link rmp-outra', '<span>Não é você?</span> <b>Entrar com outra conta</b>'); outra.type = 'button';
  var voltar = el('button', 'rmp-link rmp-voltar'); voltar.type = 'button';
  btn.parentNode.insertBefore(voltar, btn.nextSibling);
  btn.parentNode.insertBefore(outra, btn.nextSibling);

  // olho para mostrar a senha
  var envolve = el('span', 'rmp-senha');
  pass.parentNode.insertBefore(envolve, pass); envolve.appendChild(pass);
  var olho = el('button', 'rmp-olho', '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>');
  olho.type = 'button'; olho.setAttribute('aria-label', 'Mostrar senha'); olho.setAttribute('aria-pressed', 'false');
  envolve.appendChild(olho);
  olho.addEventListener('click', function(){
    var mostrar = pass.type === 'password'; pass.type = mostrar ? 'text' : 'password';
    olho.setAttribute('aria-pressed', mostrar ? 'true' : 'false'); olho.setAttribute('aria-label', mostrar ? 'Esconder senha' : 'Mostrar senha');
    pass.removeAttribute('readonly'); pass.focus();
  });
  if (user.type !== 'email') user.setAttribute('autocomplete', 'username');
  pass.setAttribute('autocomplete', 'current-password');
  pass.setAttribute('placeholder', 'Digite sua senha');

  /* ---- modo ---- */
  var modoLembrado = false, forcarForm = false;
  function preparar(focar){
    var lemb = forcarForm ? null : lembrado();
    modoLembrado = !!lemb;
    card.classList.toggle('rmp-lembrado', modoLembrado);
    pass.value = ''; pass.type = 'password'; pass.setAttribute('readonly', '');
    olho.setAttribute('aria-pressed', 'false'); olho.setAttribute('aria-label', 'Mostrar senha');
    tocou = false;
    var guardado = lembrado();
    voltar.classList.toggle('on', !modoLembrado && !!guardado);
    voltar.textContent = guardado ? '← Voltar para ' + (guardado.nome || pelaMetade(guardado.email)) : '';
    var foto = conta.querySelector('.rmp-foto');
    if (lemb) {
      user.value = lemb.login || lemb.email;   // o doLogin do sistema le daqui, como sempre
      conta.querySelector('.rmp-sauda').textContent = saudacao();
      conta.querySelector('.rmp-nome').textContent = lemb.nome || primeiroNome('', lemb.email);
      conta.querySelector('.rmp-chip span').textContent = pelaMetade(lemb.email);
      var f = fotos()[String(lemb.email).toLowerCase()];
      foto.classList.toggle('com-foto', !!f);
      foto.style.backgroundImage = f ? 'url("' + f + '")' : '';
      foto.querySelector('span').textContent = (lemb.nome || lemb.email || '?').charAt(0).toUpperCase();
    } else {
      caixa.querySelector('input').checked = true;
    }
    if (focar) setTimeout(function(){ var a = lemb ? pass : user; if (a === pass) pass.removeAttribute('readonly'); try { a.focus(); } catch(e){} }, 60);
  }
  function outraConta(){ forcarForm = true; user.value = ''; preparar(true); }

  /* A FOTO E O NOME QUE A CENTRAL MANDA. No programa do PC a Central é um
     arquivo local e os sistemas vêm do github.io: endereços diferentes, a
     memória do navegador não é a mesma, e esta porta abria sem a sua foto.
     A Central manda a conta de quem está nela ao abrir o sistema; só vale
     vindo da janela mãe, e só grava e-mail, nome e foto -- senha nunca. */
  window.addEventListener('message', function(ev){
    var d = ev && ev.data;
    if (!d || d.rm !== 'conta' || window.parent === window || ev.source !== window.parent) return;
    var email = String(d.email || '').trim(); if (email.indexOf('@') < 1) return;
    var k = email.toLowerCase();
    try {
      var m = fotos();
      if (typeof d.foto === 'string' && /^data:image\//.test(d.foto)) m[k] = d.foto; else if (d.foto === null) delete m[k];
      localStorage.setItem('rm_avatares_dispositivo', JSON.stringify(m));
      var l = lembrado();
      if (!l || String(l.email).toLowerCase() === k)
        localStorage.setItem(CHAVE, JSON.stringify({ email: email, nome: (d.nome ? primeiroNome(d.nome, email) : '') || (l && l.nome) || '', login: (l && l.login) || undefined }));
    } catch(e){}
    if (!forcarForm) { try { preparar(false); } catch(e){} }
  });
  conta.querySelector('.rmp-chip .rmp-link').addEventListener('click', outraConta);
  outra.addEventListener('click', outraConta);
  voltar.addEventListener('click', function(){ forcarForm = false; preparar(true); });

  /* ---- senha: nada entra sem voce pedir ----
     Face ID / chaveiro / lista do navegador so' preenchem depois de um toque
     seu, e isso vale. Barrado: o navegador encher a senha SOZINHO ao abrir a
     porta, antes de qualquer toque (campo travado ate' o toque, e o que
     chegar sem digitacao antes disso e' apagado). */
  var tocou = false;
  ['pointerdown','touchstart','keydown'].forEach(function(ev){ tela.addEventListener(ev, function(){ tocou = true; }, { capture: true, passive: true }); });
  var destrava = function(){ pass.removeAttribute('readonly'); };
  pass.addEventListener('pointerdown', destrava); pass.addEventListener('focus', destrava);
  pass.addEventListener('input', function(e){ if (!tocou && (!e.inputType || e.inputType === 'insertReplacementText')) pass.value = ''; });
  setTimeout(function(){ try { if (!tocou && (pass.matches(':autofill') || pass.matches(':-webkit-autofill'))) pass.value = ''; } catch(e){} }, 600);

  /* ---- guardar o e-mail quando o login da' certo ----
     A escolha (caixa) e o que foi digitado sao anotados no clique/Enter;
     quem confirma que deu certo e' o proprio Firebase do sistema. */
  var pedido = null;
  function anota(){ pedido = { lembrar: modoLembrado ? true : caixa.querySelector('input').checked, login: user.value.trim() }; }
  btn.addEventListener('click', anota, true);
  card.addEventListener('keydown', function(e){ if (e.key === 'Enter' && (e.target === user || e.target === pass)) anota(); }, true);
  function guardar(u){
    var nome = primeiroNome(u.displayName, u.email), atual = lembrado();
    var mesma = atual && String(atual.email).toLowerCase() === String(u.email).toLowerCase();
    try {
      if (pedido && pedido.lembrar) localStorage.setItem(CHAVE, JSON.stringify({ email: u.email, login: pedido.login || u.email, nome: nome }));
      else if (pedido && !pedido.lembrar) { if (mesma) localStorage.removeItem(CHAVE); }
      /* sessao que ja estava aberta: o perfil guardado pode ser o de antes
         de trocar o nome, e regravava o antigo por cima do que a Central
         mandou. Busca o perfil atual; sem internet, nao mexe. */
      else if (mesma && typeof u.reload === 'function') u.reload().then(function(){
        var n = String(u.displayName || '').trim() ? primeiroNome(u.displayName, u.email) : '', a = lembrado();
        if (n && a && String(a.email).toLowerCase() === String(u.email).toLowerCase() && a.nome !== n) { a.nome = n; try { localStorage.setItem(CHAVE, JSON.stringify(a)); } catch(e){} if (!forcarForm) { try { preparar(false); } catch(e){} } }
      }, function(){});
    } catch(e){}
    pedido = null;
  }
  window.__rmPortaGuardar = guardar;   // para a bateria de testes
  var tentativas = 0;
  (function escuta(){
    try {
      if (window.firebase && firebase.apps && firebase.apps.length && firebase.auth) {
        firebase.auth().onAuthStateChanged(function(u){ if (u) guardar(u); else { forcarForm = false; preparar(true); } });
        return;
      }
    } catch(e){}
    if (++tentativas < 60) setTimeout(escuta, 500);
  })();
  preparar(false);
})();
</script>
<script id="rmVersaoBloco">
/* ===== SELO DE VERSÃO — igual em todos os sistemas (PADRAO_RM.md §3) =====
   O número vem de APP_VER ('vNN'), o mesmo que fecha o nome do cache do
   service worker. O selo fica ao lado do nome do sistema, na barra do alto:
   é por ele que se vê, num relance, se a tela é a publicação nova. Selo que
   o sistema já tinha (verPill, verTag, ver, appVer) é adotado, não duplicado. */
(function(){
  var v=(typeof APP_VER!=='undefined')?String(APP_VER):'';
  if(!v)return;
  function estilo(){
    if(document.getElementById('rmVerEstilo'))return;
    var s=document.createElement('style');s.id='rmVerEstilo';
    s.textContent='.rm-ver{display:inline-flex;align-items:center;flex:none;margin-left:8px;padding:0;'+
      'font-family:var(--mono,ui-monospace,SFMono-Regular,Menlo,monospace);font-size:11px;font-weight:600;'+
      'letter-spacing:.04em;line-height:1;text-transform:none;color:var(--muted,#6e7178);background:none;border:0;white-space:nowrap;vertical-align:middle}'+
      '@media print{.rm-ver{display:none!important}}';
    document.head.appendChild(s);
  }
  function pinta(){
    estilo();
    var alvos=[].slice.call(document.querySelectorAll('[data-rm-ver]'));
    if(!alvos.length){
      var velho=document.querySelector('.appbar #verPill,.appbar #verTag,.appbar #appVer,.appbar #ver,.topbar #verTag,.topbar-brand #verTag');
      if(velho){velho.setAttribute('data-rm-ver','');alvos=[velho];}
      else{
        var casa=document.querySelector('.rm-brand,.appbar .brand,.topbar-brand,.topbar .brand,.topbar-in h1,.appbar h1,header h1');
        if(!casa)return;
        var sp=document.createElement('span');sp.setAttribute('data-rm-ver','');
        var sub=casa.querySelector('.sub');if(sub&&sub.parentNode===casa)casa.insertBefore(sp,sub.nextSibling);else casa.appendChild(sp);alvos=[sp];
      }
    }
    alvos.forEach(function(e){e.className='rm-ver';e.textContent=v;e.title='Versão publicada: '+v;});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',pinta);else pinta();
})();
</script>
<script id="rmImpressaoBloco">
/* ===================== IMPRESSAO RM · bloco compartilhado =====================
   Copia IDENTICA em todos os sistemas e na Central.
   No programa instalado, window.print() abre a janela de impressao do
   Windows, e quem escolhia "Microsoft Print to PDF" recebia o documento como
   IMAGEM de ~82 dpi em JPEG -- a baixa qualidade que aparecia em alguns
   relatorios. Aqui o Imprimir passa a ir pela ponte do app: a pagina e'
   congelada como esta' (o mesmo HTML que o navegador imprimiria), vira PDF
   com texto vetorial e abre no leitor de PDF do computador, de onde se
   imprime no papel ou se salva.
   So' troca quando a ponte existe de fato: na janela do app (rmDesktop) ou
   dentro da Central, que responde "ponte:sim" ao ser perguntada. No
   navegador comum nada muda -- o "Salvar como PDF" do Chrome ja' e' vetorial.
   beforeprint/afterprint continuam disparando, entao quem prepara a folha
   nesses eventos (esconder a tela, desembrulhar abas) segue funcionando. */
(function(){
  if (window.__rmImpressao) return; window.__rmImpressao = 1;
  var printNativo = window.print.bind(window);
  var ponte = (window.rmDesktop && typeof window.rmDesktop.salvarPDF === 'function') ? 'app' : null;
  var noQuadro = false;
  try { noQuadro = window.parent && window.parent !== window; } catch(e){}
  if (!ponte && noQuadro) {
    window.addEventListener('message', function(ev){
      var m = ev.data;
      if (m && m.rm === 'ponte:sim' && ev.source === window.parent) ponte = 'quadro';
    });
    try { window.parent.postMessage({ rm: 'ponte?' }, '*'); } catch(e){}
  }
  /* Nome do arquivo: o sistema que souber o nome do documento define
     window.rmNomePDF() (o orcamento da "Orcamento CLIENTE 28-09-2026").
     Sem ele, o titulo da pagina e a data de hoje, como sempre foi. */
  function limpaNome(t){ return String(t || '').replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim(); }
  function nomeProprio(){ try { return window.rmNomePDF ? limpaNome(window.rmNomePDF()).slice(0, 90) : ''; } catch(e){ return ''; } }
  function nomeDoc(){
    var p = nomeProprio(); if (p) return p;
    var t = limpaNome(document.title || 'documento') || 'documento';
    var d = new Date();
    return (t + ' ' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0')).slice(0, 90);
  }
  /* No navegador, o "Salvar como PDF" sugere o TITULO da pagina: durante a
     impressao o titulo vira o nome proprio, e volta depois. */
  var tituloAntes = null;
  window.addEventListener('beforeprint', function(){ var p = nomeProprio(); if (p && tituloAntes === null) { tituloAntes = document.title; document.title = p; } });
  window.addEventListener('afterprint', function(){ if (tituloAntes !== null) { document.title = tituloAntes; tituloAntes = null; } });
  /* a pagina como esta' agora, com o que foi digitado nos campos e sem scripts */
  function congelar(){
    var clone = document.documentElement.cloneNode(true);
    var vivos = document.querySelectorAll('input, select, textarea'), copias = clone.querySelectorAll('input, select, textarea');
    for (var i = 0; i < vivos.length && i < copias.length; i++) {
      var o = vivos[i], c = copias[i];
      if (o.tagName === 'INPUT') {
        if (o.type === 'checkbox' || o.type === 'radio') { if (o.checked) c.setAttribute('checked','checked'); else c.removeAttribute('checked'); }
        else c.setAttribute('value', o.value == null ? '' : o.value);
      } else if (o.tagName === 'SELECT') {
        for (var j = 0; j < o.options.length && j < c.options.length; j++) {
          if (o.options[j].selected) c.options[j].setAttribute('selected','selected'); else c.options[j].removeAttribute('selected');
        }
      } else c.textContent = o.value == null ? '' : o.value;
    }
    /* canvas nao vai no clone (so' o elemento vazio): vira imagem no tamanho real dele.
       O FUNDO EM MOVIMENTO NAO: virava imagem sem o id, a regra que o tira
       do papel (#rmMovimento) nao pegava mais, e as cotas do fundo saiam no
       PDF por cima do contrato. Enfeite (aria-hidden) sai do clone; o id
       vai junto para a imagem, para o CSS de impressao continuar valendo. */
    var cv = document.querySelectorAll('canvas'), cc = clone.querySelectorAll('canvas');
    for (var k = 0; k < cv.length && k < cc.length; k++) {
      if (cv[k].id === 'rmMovimento' || cv[k].getAttribute('aria-hidden') === 'true') { if (cc[k].parentNode) cc[k].parentNode.removeChild(cc[k]); continue; }
      try { var im = document.createElement('img'); im.src = cv[k].toDataURL('image/png');
        im.setAttribute('style', cc[k].getAttribute('style') || ''); im.style.width = cv[k].getBoundingClientRect().width + 'px';
        im.className = cc[k].className; if (cc[k].id) im.id = cc[k].id; cc[k].parentNode.replaceChild(im, cc[k]); } catch(e){}
    }
    Array.prototype.forEach.call(clone.querySelectorAll('script'), function(s){ s.parentNode && s.parentNode.removeChild(s); });
    return '<!DOCTYPE html>' + clone.outerHTML;
  }
  var ocupado = false;
  /* Documento pronto (HTML inteiro, montado a parte): mesmo caminho do
     Imprimir. Devolve true se a ponte assumiu; false = o chamador segue com
     o jeito dele (janela nova + print no navegador). */
  window.rmImprimirHTML = function(html, nome){
    if (!ponte || ocupado) return false;
    ocupado = true; nome = nome || nomeDoc();
    if (ponte === 'app') {
      var gerar = window.rmDesktop.abrirPDF || window.rmDesktop.salvarPDF;

     papel na resolucao da tela, ~96 pontos por polegada, e saia borrado ao

<script>
/* ===== RELATO DE ERRO À CENTRAL — igual em todos os sistemas =====
   Um erro de JavaScript aqui dentro morre no console do iframe e ninguém
   fica sabendo. Dentro da RM Central, o texto do erro vai para ela registrar
   no Diagnóstico. Sai daqui só a mensagem, o arquivo, o topo da pilha e a
   VERSÃO publicada (APP_VER) -- é ela que diz, no relatório de melhorias, se
   o erro é de antes ou depois de uma correção. Nenhum dado de tela, nenhum
   valor digitado. O nome do sistema quem põe é a Central (a aba que o abriu). */
(function () {

    if (ultimos[chave] && Date.now() - ultimos[chave] < 10000) return;
    ultimos[chave] = Date.now();
    try {
      window.parent.postMessage({
        rm: 'erro', ver: versao(),
        msg: String(msg).slice(0, 300),

        pilha: pilha ? String(pilha).slice(0, 400) : ''

    var r = ev.reason;

   distante". Aqui o Tab, o clique e a digitação terminam onde deviam: se o
   foco se perdeu porque a caixa foi refeita, ele vai para a caixa

<script>
/* ===== FUNDO DA CENTRAL NOS SISTEMAS — igual em todos ===== 
   O fundo escolhido na Central (padrão, cor da marca e intensidade) vale em
   todos os sistemas, pelo mesmo caminho do tema: a Central manda {rm:'fundo'}
   a quem está no quadro e grava a escolha nas chaves comuns (rm_fundo,
   rm_fundo_marca, rm_fundo_op) -- os sistemas moram no mesmo endereço e as
   leem ao abrir, mesmo fora da Central. Sem escolha gravada, fica o canto
   próprio do sistema. A camada é a mesma da Central (fundo-estilo.html). */
(function () {
  if (window.__rmFundo) return; window.__rmFundo = 1;
  var NO_QUADRO = window.parent !== window;
  var NOME = /^[a-z]{2,16}$/;
  function le() {
    try { return { fundo: localStorage.getItem('rm_fundo') || '', marca: localStorage.getItem('rm_fundo_marca') || '', op: localStorage.getItem('rm_fundo_op') || '' }; }
    catch (e) { return { fundo: '', marca: '', op: '' }; }
  }
  function grava(c) {
    try { localStorage.setItem('rm_fundo', c.fundo || ''); localStorage.setItem('rm_fundo_marca', c.marca || ''); localStorage.setItem('rm_fundo_op', c.op == null ? '' : String(c.op)); } catch (e) { }
  }

<script>
/* ===== LISTA DE SUGESTÕES PRESA AO CAMPO — igual em todos os sistemas =====
   O <datalist> do navegador não segue a tela: abre preto, com a letra e o
   espaçamento do Chrome, e o campo ganha uma setinha que não é nossa (visto
   na peça do Propostas e Contratos). O Recibos já tinha resolvido isso com
   uma lista desenhada pela própria página -- cartões brancos, presos embaixo
   do campo, o item em destaque no tom da marca. Este bloco faz o mesmo para
   TODO campo com list="...", em qualquer sistema, sem o sistema mudar nada:
   o <datalist> continua sendo a fonte das opções (lido na hora de abrir, então
   lista que muda vale na hora); só quem desenha passa a ser a página.
   - a lista vai em position:fixed, medida a partir do campo: não é cortada
     por tabela ou modal com overflow, e abre para cima quando não cabe embaixo;
   - escolher (clique, Enter) põe o valor e dispara input e change, como se
     a pessoa tivesse digitado -- o sistema grava pelo caminho de sempre;
   - opção com rótulo (<option value="x" label="y">) mostra o rótulo embaixo,

(function(){

    + '.rm-lista.open{display:block}'
    + '.rm-lista .it{padding:9px 13px;cursor:pointer;border-bottom:1px solid var(--line-2,#EEF0F3)}'
    + '.rm-lista .it:last-child{border-bottom:0}'
    + '.rm-lista .it:hover,.rm-lista .it.active{background:var(--red-soft,#F7EBEA)}'
    + '.rm-lista .it .d{font-size:14px;font-weight:700;color:var(--ink,#16171A);overflow-wrap:anywhere}'
    + '.rm-lista .it .g{font-size:12px;color:var(--muted,#5e6169);margin-top:1px;font-weight:560}'
