/* Folha para conferir de prancheta e caneta. A auditoria digital resolve
   quem confere pelo celular; esta é para quem imprime, anda pelo galpão e
   anota. Por isso não tem botão nem edição: traz a quantidade que o sistema
   diz ter e deixa a coluna do lado em branco, para escrever o que contou.
   A divergência aparece na hora, no papel, sem depender de memória. */
/* ---------- recorte da folha: tudo ou um setor só ----------

   Quem confere um setor não quer as 64 linhas na mão -- quer a folha do
   setor dele. O recorte vale para os três caminhos (tela, Imprimir e PDF)
   porque todos leem daqui; se cada um filtrasse do seu jeito, uma hora a
   tela mostraria uma coisa e o papel outra.

   Escolhido um setor, a folha traz junto as peças DELE que estão no
   conserto. Sem isso a conferência acusaria falta: a pessoa procura 7
   baterias na prateleira, acha 6, e não tem como saber que a sétima está
   no conserto e não sumiu. */
function setoresDoRelatorio(){
  const ord = db.setores.slice().sort((a,b) => (a.ordem||0) - (b.ordem||0));
  if (ui.relSetor === 'todos') return ord;
  if (ui.relSetor === '__sem__') return [];
  return ord.filter(s => s.id === ui.relSetor);
}
function manutencaoDoRelatorio(){
  const m = daSituacao('manutencao');
  if (ui.relSetor === 'todos') return m;
  if (ui.relSetor === '__sem__') return m.filter(x => !setorPorId(x.setor));
  return m.filter(x => x.setor === ui.relSetor);
}
function semSetorDoRelatorio(){
  if (ui.relSetor !== 'todos' && ui.relSetor !== '__sem__') return [];
  return db.maquinas.filter(m => m.situacao === 'uso' && !setorPorId(m.setor));
}
function rotuloRelatorio(){
  if (ui.relSetor === 'todos') return 'Todos os setores';
  if (ui.relSetor === '__sem__') return 'Sem setor';
  const s = setorPorId(ui.relSetor);
  return s ? s.nome : 'Todos os setores';
}
function mudarRelSetor(v){ ui.relSetor = v; render(); }

/* ---------- CONFERÊNCIAS JÁ FECHADAS ----------
   As auditorias eram gravadas em db.auditorias desde sempre e nunca apareciam
   em lugar nenhum: o resultado passava numa mensagem de 3 segundos e sumia.
   Quem quisesse saber o que faltou no Pré-Moldado no mês passado não tinha
   onde olhar -- e é justamente esse histórico que mostra o setor onde some
   coisa toda vez. */
function htmlConferencias(){
  if (!db.auditorias.length)
    return '<div class="vazio">Nenhuma conferência fechada ainda.<br>' +
      '<span style="font-size:12.5px">O resultado de cada auditoria fica guardado aqui assim que você fecha um setor.</span></div>';

  const linhas = a => (a || []).map(x =>
    '<li>' + esc(x.nome) + (x.modelo ? ' <span class="conf-mod">' + esc(x.modelo) + '</span>' : '') +
    (x.etiqueta ? ' <span class="mono conf-etq">' + esc(x.etiqueta) + '</span>' : '') +
    (x.esperado != null ? ' <span class="conf-num">esperado ' + x.esperado + ' · achou ' + (x.achou||0) + '</span>' : '') +
    (x.qtd > 1 ? ' <span class="mono">×' + x.qtd + '</span>' : '') +
    (x.texto ? ' <span class="conf-org">' + esc(x.texto) + '</span>' : '') + '</li>').join('');

  return db.auditorias.map((a, i) => {
    const st = setorPorId(a.setor);
    const blocos = [];
    if ((a.faltas||[]).length)        blocos.push(['falta', 'Faltando', a.faltas]);
    if ((a.adicionadas||[]).length)   blocos.push(['sobra', 'A mais', a.adicionadas]);
    if ((a.manutencao||[]).length)    blocos.push(['mnt', 'Para conserto', a.manutencao]);
    if ((a.naoConferidos||[]).length) blocos.push(['nc', 'Não conferidos', a.naoConferidos]);
    const limpo = !blocos.length;
    return '<div class="conf">' +
      '<div class="conf-top">' +
        '<span class="setor-cor" style="background:' + esc(st ? st.cor : '#6e7178') + '"></span>' +
        '<div style="flex:1;min-width:0">' +
          '<div class="conf-nome">' + esc(a.setorNome || (st ? st.nome : 'setor removido')) + '</div>' +
          '<div class="conf-sub">' + brDia(a.data) +
            (a.responsavel ? ' · ' + esc(a.responsavel) : '') +
            ' · ' + a.conferidos + ' de ' + a.itens + ' conferidos</div>' +
        '</div>' +
        '<button class="btn sm" onclick="apagarConferencia(' + i + ')">Apagar</button>' +
      '</div>' +
      (limpo
        ? '<div class="conf-ok">Tudo conferido, nada faltando.</div>'
        : blocos.map(([cls, rot, itens]) =>
            '<div class="conf-bloco ' + cls + '"><b>' + rot + ' (' + itens.length + ')</b><ul>' +
            linhas(itens) + '</ul></div>').join('')) +
    '</div>';
  }).join('');

function apagarConferencia(i){
  const a = db.auditorias[i]; if (!a) return;
  if (!confirm('Apagar a conferência de ' + (a.setorNome||'') + ' de ' + brDia(a.data) + '?\n\n' +
               'O histórico some; o estoque não muda — o que essa conferência mexeu já foi aplicado na época.')) return;
  db.auditorias.splice(i, 1);
  salvar(); render();
}

/* ---------- anexo de compras ----------
   A soma responde quantas eu tenho; o anexo responde de quem e quando. Vai
   agrupado pela MESMA chave do Total geral, com uma linha por compra debaixo
   do total -- que é a mesma coisa que a tela mostra ao abrir a linha, só que
   já aberta, porque papel não expande.

   Item sem nenhuma compra registrada fica de fora: encheria a folha de
   travessões e esconderia o que interessa. */
function anexoCompras(){
  const itens = consolidado()
    .map(l => ({ l: l, comp: l.linhas.filter(m => m.dataCompra || (m.fornecedor||'').trim()) }))
    .filter(x => x.comp.length)
    .sort((a,b) => a.l.nome.localeCompare(b.l.nome,'pt-BR'));
  if (!itens.length) return '<section class="rel-bloco"><h3>Compras e garantia</h3>' +
    '<div class="vazio">Nenhuma máquina com compra registrada ainda.</div></section>';
  const pecasCom = itens.reduce((s,x) => s + x.comp.reduce((t,m) => t + (Number(m.qtd)||0), 0), 0);
  return '<section class="rel-bloco rel-anexo"><h3>Compras e garantia' +
    '<span class="rel-tot">' + pecasCom + ' peças com compra registrada</span></h3>' +
    '<div class="rel-rolagem"><table class="rel-tab"><thead><tr>' +
      '<th>Máquina</th><th>Modelo</th><th class="t-num">Qtd</th><th>Onde está</th>' +
      '<th>Compra</th><th>Fornecedor</th><th>Nota fiscal</th><th>Garantia</th>' +
    '</tr></thead><tbody>' +
    itens.map(x => {
      const l = x.l, ls = x.comp.slice().sort(ordemCompra);
      const total = ls.reduce((t,m) => t + (Number(m.qtd)||0), 0);
      return '<tr class="an-tot"><td><b>' + esc(l.nome) + '</b></td>' +
        '<td class="modelo">' + esc(l.modelo || '—') + '</td>' +
        '<td class="t-num mono"><b>' + total + '</b></td>' +
        '<td colspan="4">' + (ls.length > 1 ? ls.length + ' compras' : '1 compra') + '</td><td></td></tr>' +
        ls.map(m => {
          const s = m.situacao === 'manutencao' ? null : setorPorId(m.setor);
          const g = garantia(m);
          return '<tr class="an-l"><td></td><td></td>' +
            '<td class="t-num mono">' + (Number(m.qtd)||0) + '</td>' +
            '<td>' + (m.situacao === 'manutencao' ? 'Manutenção' : (s ? esc(s.nome) : 'sem setor')) + '</td>' +
            '<td class="mono">' + (dataBR(m.dataCompra) || '—') + '</td>' +
            '<td>' + (esc(m.fornecedor||'') || '—') + '</td>' +
            '<td class="mono">' + (esc(m.notaFiscal||'') || '—') + '</td>' +
            '<td>' + (g && g.fim ? (dataBR(g.fim) + (g.estado === 'vencida' ? ' (vencida)' : '')) : '—') + '</td></tr>';
        }).join('');
    }).join('') + '</tbody></table></div></section>';
}

/* ---------- o mesmo relatório, em PDF ----------

   Por que não basta o window.print(): dentro da RM Central o print abre a
   janela do Windows, que só lista impressoras. A única com cara de PDF é o
   "Microsoft Print to PDF", que é impressora virtual — rasteriza a folha a
   ~82 dpi e embrulha a imagem num PDF. O relatório saía com aspecto de
   documento escaneado, e o galpão precisa ler o nome da máquina.

   A Central já resolve isso para os outros sistemas: ela recebe o HTML por
   postMessage e manda no printToPDF do próprio Chrome, que sai vetorial —
   nítido em qualquer zoom, pesquisável e com poucos KB. Aqui a folha é
   remontada como documento solto, sem depender de uma linha do CSS da tela,
   porque quem vai renderizar é outra janela.

   Três caminhos, nessa ordem: a ponte direta (se um dia o sistema rodar como
   quadro principal do Electron), a ponte da Central (o caso real, dentro do
   iframe) e, sem nenhuma das duas, o navegador — onde o "Salvar como PDF" do
   Chrome já dá conta e só falta abrir a janela com a folha pronta. */
function salvarRelatorioPDF(){
  const html = htmlPDFRelatorio();
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  /* O setor entra no nome do arquivo: quem tira a folha de cinco setores um
     atrás do outro acaba com cinco PDFs, e sem isso todos teriam o mesmo
     nome e um sobrescreveria o outro na pasta de downloads. */
  const recorte = ui.relSetor === 'todos' ? '' : '_' + chave(rotuloRelatorio()).slice(0, 24);
  /* Sem ".pdf" no nome: a Central troca tudo que não for letra, número, "_"
     ou "-" por "_" e depois acrescenta a extensão. Mandar a extensão aqui
     viraria "..._pdf.pdf". */
  const nome = 'RM_Conferencia_Maquinas' + recorte + '_' +
    d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());

  enviarPDF(html, nome, 'PDF pronto ✓');
}

function abrirPDFNoNavegador(html){
  const w = window.open('', '_blank', 'width=900,height=1000');
  if (!w) { toast('O navegador bloqueou a janela do PDF. Permita pop-ups para este sistema.', true); return; }
  w.document.open(); w.document.write(html); w.document.close();
  w.onload = () => setTimeout(() => { w.focus(); w.print(); }, 250);
}

/* A folha do PDF: identidade RM no topo (logo, faixa vermelha, dados da
   empresa), tarja escura com o título e um bloco por setor — a mesma leitura
   da aba Relatório, remontada com CSS próprio.

   As colunas "Contado" e "Obs." saem em branco de propósito: é uma folha de
   conferência, quem anda pelo galpão escreve nelas o que achou na prateleira
   e a divergência aparece na hora, ao lado do número que o sistema diz ter. */
function htmlPDFRelatorio(){
  const hoje = new Date().toLocaleDateString('pt-BR');
  const noConserto = manutencaoDoRelatorio();
  const emUso = [].concat(...setoresDoRelatorio().map(s => doSetor(s.id)), semSetorDoRelatorio());
  const uso = pecas(emUso), mnt = pecas(noConserto);
  const tudo = ui.relSetor === 'todos';

  const linhas = (ms, comOrigem) =>
    '<table><thead><tr><th>Máquina</th><th>Modelo</th>' +
    (comOrigem ? '<th>Setor de origem</th>' : '') +
    '<th class="num">Sistema</th><th class="vazio w-cont">Contado</th><th class="vazio w-obs">Obs.</th>' +
    '</tr></thead><tbody>' +
    ms.map(m => {
      const s = comOrigem ? setorPorId(m.setor) : null;
      return '<tr><td><b>' + esc(m.nome) + '</b></td><td>' + esc(m.modelo || '—') + '</td>' +
        (comOrigem ? '<td>' + (s ? esc(s.nome) : 'Sem setor') + '</td>' : '') +
        '<td class="num">' + (Number(m.qtd)||0) + '</td>' +
        '<td class="vazio"></td><td class="vazio"></td></tr>';
    }).join('') + '</tbody></table>';

  let corpo = '';
  setoresDoRelatorio().forEach(s => {
    const ms = doSetor(s.id);
    corpo += '<section class="bloco"><h2>' +
      '<span class="dot" style="background:' + esc(s.cor) + '"></span>' + esc(s.nome) +
      (s.responsavel ? '<span class="resp">· ' + esc(s.responsavel) + '</span>' : '') +
      '<span class="tot">' + pecas(ms) + ' peças</span></h2>' +
      (ms.length ? linhas(ms, false) : '<div class="nada">Nenhuma máquina neste setor.</div>') +
      '</section>';
  });

  const semSetor = semSetorDoRelatorio();
  if (semSetor.length) {
    corpo += '<section class="bloco"><h2><span class="dot vago"></span>Sem setor' +
      '<span class="tot">' + pecas(semSetor) + ' peças</span></h2>' + linhas(semSetor, false) + '</section>';
  }

  /* Manutenção é situação, não setor: a peça continua sendo do setor de
     origem. Na folha inteira a coluna de origem aparece -- sem ela ninguém
     sabe para onde devolver quando o conserto termina. Na folha de um setor
     só ela seria uma coluna repetindo o mesmo nome, então sai. */
  if (noConserto.length) {
    corpo += '<section class="bloco"><h2><span class="dot mnt"></span>Em manutenção' +
      (ui.relSetor === 'todos' ? '' : '<span class="resp">· deste setor</span>') +
      '<span class="tot">' + mnt + ' peças</span></h2>' +
      linhas(noConserto, ui.relSetor === 'todos') + '</section>';
  }

  /* O anexo de compras e garantia, quando ligado na tela, sai aqui tambem.
     Antes so' o Imprimir da tela o levava -- e este e' agora o unico botao. */
  if (ui.relCompras) {
    const itens = consolidado()
      .map(l => ({ l: l, comp: l.linhas.filter(m => m.dataCompra || (m.fornecedor||'').trim()) }))
      .filter(x => x.comp.length)
      .sort((a,b) => a.l.nome.localeCompare(b.l.nome,'pt-BR'));
    corpo += '<section class="bloco anexo"><h2>Compras e garantia' +
      '<span class="tot">' + itens.reduce((s,x) => s + x.comp.reduce((t,m) => t + (Number(m.qtd)||0), 0), 0) +
      ' peças com compra registrada</span></h2>' +
      (!itens.length ? '<div class="nada">Nenhuma máquina com compra registrada ainda.</div>' :
      '<table><thead><tr><th>Máquina</th><th>Modelo</th><th class="num">Qtd</th><th>Onde está</th>' +
      '<th>Compra</th><th>Fornecedor</th><th>Nota fiscal</th><th>Garantia</th></tr></thead><tbody>' +
      itens.map(x => {
        const l = x.l, ls = x.comp.slice().sort(ordemCompra);
        return '<tr class="an-tot"><td><b>' + esc(l.nome) + '</b></td><td>' + esc(l.modelo || '—') + '</td>' +
          '<td class="num">' + ls.reduce((t,m) => t + (Number(m.qtd)||0), 0) + '</td>' +
          '<td colspan="5">' + (ls.length > 1 ? ls.length + ' compras' : '1 compra') + '</td></tr>' +
          ls.map(m => {
            const s = m.situacao === 'manutencao' ? null : setorPorId(m.setor), g = garantia(m);
            return '<tr><td></td><td></td><td class="num">' + (Number(m.qtd)||0) + '</td>' +
              '<td>' + (m.situacao === 'manutencao' ? 'Manutenção' : (s ? esc(s.nome) : 'sem setor')) + '</td>' +
              '<td>' + (dataBR(m.dataCompra) || '—') + '</td><td>' + (esc(m.fornecedor||'') || '—') + '</td>' +
              '<td>' + (esc(m.notaFiscal||'') || '—') + '</td>' +
              '<td>' + (g && g.fim ? (dataBR(g.fim) + (g.estado === 'vencida' ? ' (vencida)' : '')) : '—') + '</td></tr>';
          }).join('');
      }).join('') + '</tbody></table>') + '</section>';
  }

  const css = cssFolhaRM();
  return montaRelatorio(css, hoje, uso, mnt, tudo, emUso, noConserto, corpo);
}
/* A folha de papel da RM: a mesma do relatório de conferência e do termo de
   responsabilidade -- um documento não pode sair diferente do outro. */
function cssFolhaRM(){
  return '@page{size:A4;margin:12mm}' +
    '*{box-sizing:border-box}' +
    'body{font-family:"Satoshi",Arial,Helvetica,sans-serif;color:#16171a;margin:0;background:#fff;font-size:11px;' +
      '-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
    '.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;border-bottom:2px solid #F24619;padding-bottom:11px;margin-bottom:16px;-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
    '.top img{height:34px;width:auto;display:block}' +
    /* A MARCA APARECE UMA VEZ SO. Aqui ela saia duas: o desenho a esquerda e,
       colado nele, "RM ESTRUTURAS" escrito de novo em laranja. O nome do
       sistema, que vinha no subtitulo dessa segunda marca, passa a ser o
       rotulo laranja do bloco da empresa -- o mesmo lugar em que ele aparece
       no cabecalho de tela dos quinze. */
    '.emp{margin-left:auto;text-align:right;font-size:8.5px;color:#6E747C;line-height:1.6;letter-spacing:.02em}' +
    '.emp b{display:block;font-size:8px;color:#6c7480;text-transform:uppercase;letter-spacing:.11em;margin-bottom:2px}' +
    /* "block", e nao "inline-block": o bloco da empresa e' texto separado por
       <br>, entao um rotulo inline colaria no fim da linha da cidade. */
    '.emp .rot{display:block;margin-top:6px;font-size:8px;letter-spacing:.18em;' +
      'text-transform:uppercase;color:#D53309;font-weight:800}' +
    /* O TITULO SEM O CARTAO PRETO. Area escura grande borra em impressora
       comum e come tinta a toa; o padrao da papelaria e' texto escuro em
       caixa alta, e o unico laranja da folha e' o filete do cabecalho. */
    '.title{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:26px 0 4px}' +
    '.title h1{margin:0;font-size:15px;font-weight:800;color:#141414;letter-spacing:.07em;text-transform:uppercase}' +
    '.title p{margin:4px 0 0;font-size:8.5px;color:#6E747C;text-transform:uppercase;letter-spacing:.7px;font-weight:700}' +
    '.title .dir{text-align:right;font-size:9px;line-height:1.6;white-space:nowrap;color:#6E747C}' +
    '.info{border:1px solid #e6e6e1;padding:10px 14px;display:flex;gap:26px;flex-wrap:wrap;margin-top:10px}' +
    '.info .k{font-size:8px;text-transform:uppercase;color:#777;font-weight:800;letter-spacing:.6px}' +
    '.info .v{font-size:14px;font-weight:900;margin-top:2px;font-variant-numeric:tabular-nums}' +
    '.info .v small{font-size:9px;font-weight:700;color:#777;margin-left:3px}' +
    /* O cabeçalho não pode ficar sozinho no pé da página, e a tabela de um
       setor grande precisa poder virar a folha levando o cabeçalho junto. */
    '.bloco{margin-top:16px}' +
    'h2{display:flex;align-items:center;gap:7px;margin:0 0 6px;font-size:12px;font-weight:900;' +
      'border-left:4px solid #D53309;padding-left:8px;break-after:avoid;page-break-after:avoid}' +
    '.dot{width:9px;height:9px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}' +
    '.dot.mnt{background:#b45309}.dot.vago{background:#9ca3af}' +
    '.resp{font-weight:500;color:#666;font-size:10px}' +
    '.tot{margin-left:auto;font-size:10px;font-weight:800;color:#666}' +
    'table{width:100%;border-collapse:collapse}' +
    'thead{display:table-header-group}' +
    'tr{break-inside:avoid;page-break-inside:avoid}' +
    /* Faixa CLARA no cabecalho de tabela, como nos outros relatorios: area
       escura grande borra em impressora comum. Texto #4A515B sobre #F2F4F7
       da 7,28:1, bem acima do minimo. */
    'th{background:#F2F4F7;color:#4A515B;padding:7px 9px;text-align:left;font-size:8.5px;' +
      'text-transform:uppercase;letter-spacing:.4px;font-weight:800;border-bottom:1.5px solid #c8ccd2;' +
      '-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
    'td{padding:7px 9px;border-bottom:1px solid #e0e0e0;font-size:10.5px}' +
    'tbody tr:nth-child(even) td{background:#fafafa}' +
    '.anexo tbody tr td{background:none}.anexo tr.an-tot td{background:#F7F8FA;border-top:1px solid #d6d9de}' +
    'th.num,td.num{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}' +
    /* Coluna de escrever à mão: fundo branco mesmo na faixa zebrada, senão
       caneta em cima de cinza fica ruim de ler. */
    'th.vazio{background:#e4e7eb}' +
    'td.vazio{background:#fff !important;border-left:1px solid #ccc}' +
    '.w-cont{width:66px}.w-obs{width:108px}' +
    '.nada{padding:8px 10px;border:1px dashed #ddd;color:#888;font-size:9.5px}' +
    '.ass{display:flex;gap:34px;margin-top:26px;break-inside:avoid;page-break-inside:avoid}' +
    '.ass div{flex:1;font-size:9px;color:#666}' +
    '.ass span{display:block;border-bottom:1px solid #16171a;height:26px;margin-bottom:4px}' +
    '.foot{margin-top:20px;padding-top:9px;border-top:1px solid #e6e6e1;color:#6E747C;font-size:7.5px;' +
      'letter-spacing:.06em;text-transform:uppercase}' +
    '.foot .lin{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;gap:8px}' +
    '.foot .lin .c{text-align:center;font-weight:700;color:#6C7480}' +
    '.foot .lin .d{text-align:right}' +
    '.foot .lin .d img{height:16px;width:auto;display:inline-block;vertical-align:middle}' +
    /* o pe no pe de CADA folha, com a folga repetida para nao tampar linhas */
    '@media print{.foot{position:fixed;left:0;right:0;bottom:0;margin:0!important;background:#fff;z-index:60;-webkit-print-color-adjust:exact;print-color-adjust:exact}body{padding-bottom:18mm!important;-webkit-box-decoration-break:clone;box-decoration-break:clone}}' +
    '.foot .nota{margin-top:5px;text-align:center;font-size:7px;color:#6F747A;letter-spacing:.03em;text-transform:none}' +
    TB2_CSS + DAGUA_CSS_DOC;
}
function montaRelatorio(css, hoje, uso, mnt, tudo, emUso, noConserto, corpo){
  return '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">' +
    '<title>Relatório de conferência · ' + esc(EMPRESA.nome) + '</title>' +
    '<style>' + RM_FONTE + css + '</style></head><body>' +
    '<div class="top">' +
      (LOGO_RM ? '<img src="' + LOGO_RM + '" alt="' + esc(EMPRESA.nome) + '">' : '') +
      timbreRM2() +
    '</div>' +
    '<div class="tb2-tipo">' + esc(EMPRESA.sistema) + '</div>' +
    '<div class="title">' +
      '<div><h1>Relatório de conferência</h1><p>' + esc(rotuloRelatorio()) + '</p></div>' +
      '<div class="dir">Emitido em ' + esc(hoje) + '</div>' +
    '</div>' +
    /* Na folha de um setor os números são os DELE. Repetir o total do galpão
       aqui faria a conferência bater errado: a pessoa somaria o que contou
       na prateleira contra um total que inclui setor que ela nem viu. */
    '<div class="info">' +
      '<div><div class="k">Peças nesta folha</div><div class="v">' + (uso + mnt) + '</div></div>' +
      '<div><div class="k">Em uso</div><div class="v">' + uso + '</div></div>' +
      '<div><div class="k">Em manutenção</div><div class="v">' + mnt + '</div></div>' +
      (tudo ? '<div><div class="k">Setores</div><div class="v">' + db.setores.length + '</div></div>' : '') +
      '<div><div class="k">Itens listados</div><div class="v">' + (emUso.length + noConserto.length) +
        '<small>linhas</small></div></div>' +
    '</div>' +
    corpo +
    '<div class="ass"><div><span></span>Conferido por</div><div><span></span>Data</div></div>' +
    '<div class="foot"><div class="lin">' +
      '<div class="e">' + esc(EMPRESA.fone) + ' · @rm.estruturas</div>' +
      '<div class="c">www.rmestruturas.com.br</div>' +
      '<div class="d">' + (typeof RM_SIMBOLO_BARRA === 'string' ? '<img src="' + RM_SIMBOLO_BARRA + '" alt="">' : '') + '</div>' +
      '</div><div class="nota">' + esc(EMPRESA.nome) + ' · Documento interno de conferência · gerado em ' +
      esc(hoje) + '</div></div>' +
    daguaHTML() +
    '</body></html>';
}

/* ---------- aba Setores ---------- */
function htmlSetores(){
  let h = '';
  const ps = parecidos();
  if (ps.length) {
    h += '<div class="alerta"><b>A mesma máquina escrita de formas diferentes:</b><ul>' +
      ps.map(g => '<li>' + g.formas.map(f => esc((f[0] + ' · ' + (f[1]||'—')))).join('   |   ') +
        '<br><span style="color:var(--muted)">vira: <b>' + esc(g.alvo[0] + ' · ' + (g.alvo[1]||'—')) + '</b></span></li>').join('') +
      '</ul>Enquanto estiverem escritas diferente, o Inventário soma cada forma separada. ' +
      'Padronizar muda <b>só o texto</b> — nenhuma máquina é somada nem sai do seu setor.' +
      '<div style="margin-top:11px"><button class="btn sm primary" onclick="padronizarGrafia()">Padronizar a grafia</button></div></div>';
  }
  /* Diferente do bloco acima: ali o sistema TEM certeza (mesma chave) e
     padroniza tudo de uma vez. Aqui os nomes só se parecem, então cada
     grupo é uma pergunta -- e a resposta pode ser "não são a mesma". */
  const gsem = gruposSemelhantes();
  if (gsem.length) {
    h += '<div class="alerta"><b>Nomes parecidos — pode ser a mesma máquina:</b>' +
      gsem.map(g => '<div class="uni">' +
        g.itens.map(x => {
          const ls = Object.keys(x.setores);
          return '<div class="uni-l"><div class="uni-n"><b>' + esc(x.nome) + '</b>' +
            '<span>' + esc(x.modelo || 'sem modelo') + ' · ' + x.qtd + ' pç · ' +
            esc(ls.length > 2 ? ls.length + ' setores' : (ls.join(', ') || 'sem setor')) + '</span></div>' +
            '<button class="btn sm" onclick="unificarGrupo(\'' + g.sig + '\',\'' + x.k + '\')">Usar este nome</button></div>';
        }).join('') +
        '<div class="uni-bt"><button class="btn sm" onclick="ignorarGrupo(\'' + g.sig + '\')">Não são a mesma</button></div>' +
      '</div>').join('') +
      'Unificar muda <b>só o texto</b> — nenhuma máquina é somada nem sai do seu setor.</div>';
  }
  if (!setoresProducao().length) {
    return h + '<div class="vazio" style="padding:34px 18px">' +
      '<div style="font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px">Nada cadastrado ainda</div>' +
      'O levantamento do galpão entra sozinho na primeira abertura, então esta ' +
      'tela só aparece se tudo tiver sido apagado.<br>' +
      'Para repor, use <b>Importar da planilha</b> (no ⋯ ao lado de + Máquina).</div>';
  }
  if (filtrando()) return h + htmlResultados();
  setoresProducao().forEach(s => { h += blocoSetor(s, doSetor(s.id), false); });
  const orfas = db.maquinas.filter(m => m.situacao === 'uso' && !setorPorId(m.setor));
  if (orfas.length) {
    h += '<div class="setor"><div class="setor-h">' +
      '<span class="setor-cor" style="background:#d4d4d8"></span>' +
      '<span class="setor-nome">Sem setor</span>' +
      '<span class="setor-info"><span class="warn">ninguém responde por estas</span></span><span class="setor-esp"></span>' +
      '<span class="setor-qtd mono">' + pecas(orfas) + ' peças</span></div>' + tabela(orfas) + '</div>';
  }
  return h;
}

/* ---------- aba Estoque Interno ----------
   O estoque não disputa espaço com os setores produtivos. Continua sendo um
   setor técnico no banco: entrada, transferência e exclusão definitiva
   seguem a mesma lógica. */
function htmlEstoqueInterno(){
  const s = setorEstoqueInterno();
  const ms = doSetor(s.id).filter(m => passa(m, true));
  return '<div class="nota-aba">O que está disponível para alocação e o que os setores devolveram. Daqui sai para um setor com <b>Mover</b>; ' +
    'a exclusão definitiva só existe aqui.' + (filtrando() ? ' · <button type="button" class="lk-mini" onclick="limparFiltros()">limpar busca e filtros</button>' : '') + '</div>' +
    blocoSetor(s, ms, filtrando());
}

/* ---------- aba Conserto ---------- */
function htmlManutencao(){
  const ms = daSituacao('manutencao').filter(m => passa(m))
    .sort((a,b) => ((diasFora(b) == null ? -1 : diasFora(b)) - (diasFora(a) == null ? -1 : diasFora(a))));
  const ano = hoje().slice(0, 4);
  const voltas = db.eventos.filter(e => e && e.tipo === 'voltou' && String(e.data || '').slice(0, 4) === ano);
  const gasto = voltas.reduce((t, e) => t + (Number(e.custo) || 0), 0);
  let h = '<div class="nota-aba">A máquina no conserto continua sendo do setor de origem — o <b>Voltou</b> já sugere devolver para lá.' +
    (voltas.length ? ' Gasto com conserto em ' + ano + ': <b>' + moeda(gasto) + '</b> em ' + voltas.length + ' retorno' + (voltas.length > 1 ? 's' : '') + '.' : '') + '</div>';
  if (!ms.length) return h + '<div class="vazio">' + (filtrando() ? 'Nada no conserto com esta busca.' : 'Nenhuma máquina no conserto.') + '</div>';
  return h + '<div class="setor"><table class="tab-maq tab-cons"><colgroup><col class="k-nome"><col class="k-mod"><col class="k-qtd"><col class="k-orig">' +
    '<col class="k-onde"><col class="k-dias"><col class="k-prev"><col class="k-ac"></colgroup>' +
    '<thead><tr><th>Máquina</th><th>Modelo</th><th class="t-num">Qtd</th><th>Origem</th><th>Onde / motivo</th><th>Fora há</th><th>Previsão</th><th></th></tr></thead><tbody>' +
    ms.map(m => {
      const s = setorPorId(m.setor), c = m.conserto || {}, d = diasFora(m), venc = previsaoVencida(m);
      return '<tr data-id="' + m.id + '">' +
        '<td><button type="button" class="lk" onclick="abrirFicha(\'' + m.id + '\')">' + esc(m.nome) + '</button>' + selo(m) + '</td>' +
        '<td class="modelo">' + esc(m.modelo || '—') + '</td>' +
        '<td class="t-num mono" data-l="Qtd">' + (Number(m.qtd)||0) + '</td>' +
        '<td data-l="Origem">' + (s ? '<span class="setor-cor" style="display:inline-block;vertical-align:-2px;background:' + esc(s.cor) + '"></span> ' + esc(s.nome)
                                    : '<i class="fraco">não informado</i>') + '</td>' +
        '<td data-l="Onde">' + (c.onde || c.motivo ? esc(c.onde || '—') + (c.motivo ? '<div class="sub-l">' + esc(c.motivo) + '</div>' : '')
          : '<button type="button" class="lk-mini" onclick="editarConserto(\'' + m.id + '\')">informar</button>') + '</td>' +
        '<td data-l="Fora há"' + (d > DIAS_CONSERTO ? ' class="atr"' : '') + '>' + (d == null ? '<i class="fraco">sem data</i>' : (d === 0 ? 'hoje' : d + ' dia' + (d === 1 ? '' : 's'))) + '</td>' +
        '<td data-l="Previsão">' + (c.previsao ? '<span' + (venc ? ' class="atr"' : '') + '>' + dataBR(c.previsao) + (venc ? ' · vencida' : '') + '</span>' : '—') + '</td>' +
        '<td class="t-acao"><button class="btn sm" onclick="voltouConserto(\'' + m.id + '\')">Voltou</button> ' +
          '<button class="btn sm bt-mais" aria-label="Mais ações" onclick="menuMaquina(event,\'' + m.id + '\')">⋯</button></td></tr>';
    }).join('') + '</tbody></table></div>';
}

/* ---------- aba Valoração ----------
   Esta é a única área que exibe preços. As rotinas de relatório de
   conferência continuam montando apenas máquina, modelo e quantidade. */
function resumoValorSetor(s){
  const linhas = db.maquinas.filter(m => m.setor === s.id);
  return { setor:s, linhas:ordenarMaquinas(linhas), pecas:pecas(linhas),
    valor:valorLista(linhas), pendentes:semPreco(linhas) };
}
/* Relatório financeiro independente da conferência operacional. Ele usa a
   mesma ponte de PDF da Central, mas contém preços porque só pode ser aberto
   deliberadamente dentro da aba Valoração. */

  const d = new Date(), pad = n => String(n).padStart(2,'0');
  enviarPDF(htmlPDFValoracao(), 'RM_Valoracao_Maquinas_' + d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()),
    'Relatório de valores pronto ✓');
}

  const css = '@page{size:A4;margin:12mm 12mm 15mm}' +
    '*{box-sizing:border-box}body{margin:0;color:#16171a;background:#fff;font:10.5px "Satoshi",Arial,Helvetica,sans-serif;' +
      '-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
    '.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;border-bottom:2px solid #F24619;padding-bottom:11px;margin-bottom:16px;-webkit-print-color-adjust:exact;print-color-adjust:exact}' +

    /* Mesmo motivo do relatorio de conferencia: o titulo e' texto escuro em

    '.titulo h1{font-size:15px;margin:0;color:#141414;font-weight:800;letter-spacing:.07em;text-transform:uppercase}' +
    '.titulo p{font-size:8px;margin:4px 0 0;color:#6E747C;text-transform:uppercase;letter-spacing:.7px;font-weight:700}' +

function editarPreco(id){
  const m = db.maquinas.find(x => x.id === id); if (!m) return;
  const iguais = db.maquinas.filter(x => chavePreco(x.nome,x.modelo) === chavePreco(m.nome,m.modelo));
  abrirModal('Editar valor unitário',
    '<div style="font-size:14px;font-weight:750">' + esc(m.nome) + '</div>' +
    '<div class="modelo" style="margin-top:3px">' + esc(m.modelo || 'Sem modelo') + '</div>' +
    '<label>Valor unitário</label><input type="number" id="pvValor" min="0" step="0.01" value="' +
      (temPreco(m) ? precoUnit(m).toFixed(2) : '') + '" placeholder="0,00">' +
    (iguais.length > 1 ? '<label style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0">' +
      '<input type="checkbox" id="pvTodos" checked style="width:auto"> Aplicar às ' + pecas(iguais) +
      ' peças iguais em todos os setores</label>' : '') +
    '<div class="mod-dica">Valor usado somente nas análises internas. Digite zero para deixar como não definido.</div>',
    function(){
      const p = Number($('pvValor').value);
      if (!Number.isFinite(p) || p < 0) { toast('Informe um valor válido', true); return; }
      const todos = $('pvTodos') && $('pvTodos').checked;
      const alvo = todos ? iguais : [m];
      alvo.forEach(x => { x.preco = p; x.precoFonte = 'manual'; });
      salvar(); fecharModal(); render();
      toast('Valor atualizado' + (alvo.length > 1 ? ' em ' + alvo.length + ' registros' : ''));
    });
}

/* Toda compra ou entrada cadastrada pelo Total geral passa primeiro pelo
   Estoque Interno. Se esse setor tiver sido renomeado ou apagado, a busca
   tenta o id original e, em último caso, recria o setor para não deixar uma
   entrada sem destino. */
function estoqueInternoAtual(){
  return db.setores.find(x => chave(x.nome) === 'ESTOQUEINTERNO') || setorPorId('s5');
}
function setorEstoqueInterno(){
  let s = estoqueInternoAtual();
  if (!s) {
    s = { id: uid('s'), nome: 'Estoque Interno', cor: '#7030a0', corNome: 'ROXO',
          responsavel: '', ordem: db.setores.length };
    db.setores.push(s);
  }
  return s;
}

function adicionarAoEstoqueInterno(nome, modelo, qtd, preco){
  const s = setorEstoqueInterno();
  /* Só funde com uma linha sem etiquetas. Misturar uma compra sem número com
     máquinas já etiquetadas faria a auditoria perder a correspondência entre
     quantidade e identificação individual. */
  const igual = db.maquinas.find(m => m.situacao === 'uso' && m.setor === s.id &&
    chave(m.nome) === chave(nome) && chave(m.modelo) === chave(modelo) && !(m.etiquetas||[]).length);
  if (igual) {
    igual.qtd = (Number(igual.qtd)||0) + qtd;
    if (!temPreco(igual) && Number(preco) > 0) igual.preco = Number(preco);
  }
  else db.maquinas.push({ id: uid('m'), nome: nome, modelo: modelo, qtd: qtd,
                          setor: s.id, situacao: 'uso', etiquetas: [],
                          preco: Number(preco) >= 0 ? Number(preco) : precoBase(nome,modelo) });
  return s;
}

function avisoDestinoEstoque(){
  return '<div class="total-destino"><span class="setor-cor" style="background:#7030a0"></span>' +
    '<span><b>Destino automático:</b> Estoque Interno. Depois, faça o lançamento para o setor onde o item ficará.</span></div>';
}

function novoItemTotal(){
  abrirModal('Adicionar novo item',
    '<label>Máquina / item</label><input type="text" id="tgNome" placeholder="ESMERILHADEIRA" autocomplete="off">' +
    '<div id="tgSug"></div>' +
    '<label>Modelo</label><input type="text" id="tgMod" placeholder="GA5010 (MAKITA)">' +
    '<label>Quantidade</label><input type="number" id="tgQtd" min="1" step="1" value="1">' +
    '<label>Valor unitário <span style="text-transform:none;font-weight:600">(uso interno)</span></label>' +
    '<input type="number" id="tgPreco" min="0" step="0.01" placeholder="preenchido pela tabela quando houver">' +
    '<div id="tgPrecoDica" class="mod-dica">O valor não aparece nos relatórios de conferência.</div>' +
    avisoDestinoEstoque(),
    function(){
      const nome = $('tgNome').value.trim();
      const qtd = Math.floor(Number($('tgQtd').value));
      if (!nome) { toast('Diga o nome do item', true); return; }
      if (!Number.isFinite(qtd) || qtd < 1) { toast('Informe uma quantidade válida', true); return; }
      const modelo = confereDuplicata(nome, $('tgMod').value, null);
      if (modelo === null) return;
      const preco = $('tgPreco').value === '' ? precoBase(nome,modelo) : Number($('tgPreco').value);
      if (!Number.isFinite(preco) || preco < 0) { toast('Informe um valor unitário válido', true); return; }
      const jaExistia = consolidado().some(l => l.chave === chave(nome) + '|' + chave(modelo));
      adicionarAoEstoqueInterno(nome, modelo, qtd, preco);
      registrar('entrada', { nome: nome, modelo: modelo }, { qtd: qtd, para: 'Estoque Interno' });
      salvar(); fecharModal(); render();
      toast(qtd + ' peça(s) ' + (jaExistia ? 'acrescentada(s)' : 'cadastrada(s)') + ' no Estoque Interno');
    });
  ligarSugestoes('tgNome', 'tgMod', 'tgSug', null);
  ligarPrecoBase('tgNome','tgMod','tgPreco','tgPrecoDica');
}

function editarQuantidadeTotal(k){
  const l = consolidado().find(x => x.chave === k); if (!l) return;
  abrirModal('Editar quantidade',
    '<div style="font-size:14px;font-weight:750">' + esc(l.nome) + '</div>' +
    '<div class="modelo" style="margin-top:3px">' + esc(l.modelo || 'Sem modelo') + '</div>' +
    '<label>Quantidade total atual</label><input type="number" value="' + l.qtd + '" disabled>' +
    '<label>Nova quantidade total</label><input type="number" id="tgNovoTotal" min="' + l.qtd + '" step="1" value="' + l.qtd + '">' +
    '<div style="font-size:11.5px;color:var(--muted);margin-top:6px">Informe o novo total. A diferença será adicionada ao estoque; as quantidades já distribuídas não serão alteradas.</div>' +
    avisoDestinoEstoque(),
    function(){
      const novoTotal = Math.floor(Number($('tgNovoTotal').value));
      if (!Number.isFinite(novoTotal) || novoTotal < 1) { toast('Informe uma quantidade válida', true); return; }
      if (novoTotal < l.qtd) {
        toast('Para reduzir, edite o item no setor onde ele está atualmente', true); return;
      }
      const acrescimo = novoTotal - l.qtd;
      if (!acrescimo) { fecharModal(); toast('A quantidade não foi alterada'); return; }
      const preco = l.linhas.find(temPreco);
      adicionarAoEstoqueInterno(l.nome, l.modelo || '', acrescimo, preco ? precoUnit(preco) : precoBase(l.nome,l.modelo));
      registrar('entrada', l, { qtd: acrescimo, para: 'Estoque Interno' });
      salvar(); fecharModal(); render();
      toast('+' + acrescimo + ' peça(s) adicionada(s) ao Estoque Interno');
    });
}

function excluirItemTotal(k){
  const l = consolidado().find(x => x.chave === k); if (!l) return;
  const linhas = db.maquinas.filter(m => chave(m.nome) + '|' + chave(m.modelo) === k);
  const estoque = estoqueInternoAtual();
  const fora = linhas.filter(m => !estoque || m.setor !== estoque.id || m.situacao !== 'uso');
  if (fora.length) {
    const locaisFora = [];
    fora.forEach(m => {
      const s = setorPorId(m.setor);
      const nomeLocal = m.situacao === 'manutencao' ? 'Manutenção' : (s ? s.nome : 'Sem setor');
      if (!locaisFora.includes(nomeLocal)) locaisFora.push(nomeLocal);
    });
    alert('Exclusão definitiva bloqueada.\n\n' +
          'Este item ainda possui ' + pecas(fora) + ' peça(s) fora do Estoque Interno: ' + locaisFora.join(', ') + '.\n\n' +
          'Primeiro use “Enviar ao estoque” nos setores. A exclusão definitiva só pode ser feita quando todas as unidades estiverem no Estoque Interno.');
    return;
  }
  const locais = [];
  linhas.forEach(m => {
    const s = setorPorId(m.setor);
    const nomeLocal = m.situacao === 'manutencao' ? 'Manutenção' : (s ? s.nome : 'Sem setor');
    if (!locais.includes(nomeLocal)) locais.push(nomeLocal);
  });
  const detalhe = locais.length ? '\nLocais afetados: ' + locais.join(', ') + '.' : '';
  if (!confirm('Excluir definitivamente "' + l.nome + (l.modelo ? ' · ' + l.modelo : '') + '"?\n\n' +
               'Serão removidas ' + l.qtd + ' peça(s) do Estoque Interno.' + detalhe +
               '\n\nEsta ação não pode ser desfeita.')) return;
  db.maquinas = db.maquinas.filter(m => chave(m.nome) + '|' + chave(m.modelo) !== k);
  registrar('baixa', l, { qtd: l.qtd, de: 'Estoque Interno' });
  salvar(); render();
  toast(l.nome + ': ' + l.qtd + ' peça(s) excluída(s)');
}

/* ---------- AUDITORIA ---------- */
function htmlAuditoria(){
  if (!ui.audSetor) {
    let h = '<div class="alerta" style="background:var(--surface-2);border-color:var(--border)">' +
      'Escolha o setor que você vai conferir agora. Um por vez — é assim que se anda pelo galpão.</div>';
    setoresProducao().forEach(s => {
      const n = doSetor(s.id).length;
      h += '<div class="aud-linha" onclick="abrirAud(\'' + s.id + '\')" style="cursor:pointer">' +
        '<div style="display:flex;align-items:center;gap:11px">' +
        '<span class="setor-cor" style="width:20px;height:20px;background:' + esc(s.cor) + '"></span>' +
        '<div style="flex:1;min-width:0"><div class="aud-nome">' + esc(s.nome) + '</div>' +
        '<div class="aud-sub">' + n + ' itens · ' + pecas(doSetor(s.id)) + ' peças' +
        (s.responsavel ? ' · ' + esc(s.responsavel) : '') + '</div></div>' +
        '<span style="color:var(--faint);font-size:20px">›</span></div></div>';
    });
    return h;
  }

  const s = setorPorId(ui.audSetor);
  const ms = itensAud(ui.audSetor);
  const feitos = ms.filter(m => ui.audResp[m.chaveAud]).length;
  let h = '<div class="aud-topo">' +
    '<div style="display:flex;align-items:center;gap:10px">' +
    '<button class="btn sm" onclick="ui.audSetor=null;render()">‹ Setores</button>' +
    '<span class="setor-cor" style="background:' + esc(s.cor) + '"></span>' +
    '<b style="flex:1;min-width:0">' + esc(s.nome) + '</b>' +
    '<span class="mono" style="font-size:12.5px;color:var(--muted)">' + feitos + '/' + ms.length + '</span></div>' +
    '<div class="aud-prog"><i style="width:' + (ms.length ? Math.round(feitos/ms.length*100) : 0) + '%"></i></div></div>';

  /* Quem volta ao setor precisa saber que está CONTINUANDO, e ter como
     recomeçar. Sem isso, marcas de ontem passariam por conferência de hoje. */
  const emCurso = ui.audPorSetor[ui.audSetor];
  if (emCurso && feitos) {
    const t = new Date(emCurso.inicio || Date.now());
    h += '<div class="aud-retoma">Continuando a conferência começada ' +
      brDia(rmDiaISO(t)) + ' às ' +
      String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0') +
      ' · ' + feitos + ' de ' + ms.length + ' já conferidos' +
      '<button class="btn sm" onclick="recomecarAud()">Recomeçar</button></div>';
  }

  /* O botão de adicionar vivia só no fim da lista, depois dos onze itens: era
     encontrado justamente quando já não se precisava dele. A hora de dizer que
     apareceu uma máquina a mais é quando se está olhando para a prateleira, no
     meio da conferência -- então ele fica aqui em cima também, e o formulário
     abre no lugar de onde foi chamado. */
  if (ui.audForm && ui.audFormTopo) h += htmlFormExtra();
  else h += '<button class="btn add-extra" onclick="abrirFormExtra(1)">' +
            '+ Achei uma máquina a mais neste setor</button>';

  if (!ms.length) return h + '<div class="vazio">Nenhuma máquina neste setor.</div>';

  ms.forEach(it => {
    const m = it.maquina;
    const r = ui.audResp[it.chaveAud];
    const cls = r ? (r.tipo === 'ok' ? ' ok' : r.tipo === 'falta' ? ' falta' : ' mnt') : '';
    h += '<div class="aud-linha' + cls + '">' +
      '<div class="aud-nome">' + esc(m.nome) + '</div>' +
      (m.modelo ? '<div class="aud-sub">' + esc(m.modelo) + '</div>' : '') +
      (it.etiqueta
        ? '<div class="aud-etq mono">' + esc(it.etiqueta) + '</div>'
        : '<div class="aud-esperado mono">esperado: ' + (Number(m.qtd)||0) + '</div>') +
      '<div class="aud-bts">' +
        btAud(it.chaveAud, 'ok', '✓', 'confere') +
        btAud(it.chaveAud, 'falta', '✕', it.etiqueta ? 'não achei' : 'falta') +
        btAud(it.chaveAud, 'mnt', '⚠', 'conserto') +
      '</div>' +
      /* Sem etiqueta a pergunta é "quantas achou". Com etiqueta a peça é
         uma só: perguntar quantidade não faria sentido. */
      (r && r.tipo === 'falta' && !it.etiqueta
        ? '<div class="aud-qtd"><span style="font-size:12.5px;color:var(--muted);font-weight:600">Achei</span>' +
          /* sem teto: contar MAIS do que o esperado é informação, não erro de
             digitação. Passando do esperado, o sistema pergunta de onde veio a
             sobra em vez de aceitar um "falta 2 de 1" que não quer dizer nada. */
          '<input type="number" min="0" value="' + (r.achou != null ? r.achou : 0) + '" ' +
          'onchange="setAchou(\'' + it.chaveAud + '\',this.value)"> de ' + (Number(m.qtd)||0) + '</div>'
        : '') +
      '</div>';
  });

  /* ---- máquina a mais no setor ----
     O galpão anda: uma máquina volta do conserto, outra é emprestada e fica.
     A conferência que só sabe registrar FALTA obriga o auditor a ignorar o que
     está sobrando -- e o estoque nunca acerta.

     Adicionar aqui exige dizer DE ONDE veio. Sem isso a peça apareceria do
     nada e a soma da obra deixaria de fechar: toda entrada num setor é saída
     de outro lugar (da manutenção, de outro setor) ou uma máquina que nunca
     foi cadastrada. */
  const extras = addsDo(ui.audSetor);
  extras.forEach((x, i) => {
    h += '<div class="aud-linha sobra">' +
      '<div class="aud-nome">' + esc(x.nome) + (x.qtd > 1 ? ' <span class="mono">×' + x.qtd + '</span>' : '') + '</div>' +
      (x.modelo ? '<div class="aud-sub">' + esc(x.modelo) + '</div>' : '') +
      '<div class="aud-origem">Máquina adicionada — ' + esc(textoOrigem(x)) +
        '<button class="btn sm" onclick="tirarExtra(' + i + ')">Remover</button></div>' +
      '</div>';
  });

  if (ui.audForm && !ui.audFormTopo) h += htmlFormExtra();
  else if (!ui.audForm) h += '<button class="btn add-extra" onclick="abrirFormExtra(0)">' +
            '+ Achei uma máquina a mais neste setor</button>';

  h += '<div class="aud-fim" style="margin-top:14px">' +
    '<b>Fechar a conferência de ' + esc(s.nome) + '</b>' +
    '<div style="font-size:12.5px;color:var(--muted);margin:5px 0 12px">' +
    (feitos < ms.length ? ('Faltam ' + (ms.length - feitos) + ' item(ns). Você pode fechar assim mesmo — o que não foi conferido fica registrado como não conferido.') : 'Tudo conferido.') +
    '</div><button class="btn primary" style="width:100%" onclick="fecharAuditoria()">Fechar e gerar o resultado</button></div>';
  return h;
}
/* ---------- a máquina que apareceu a mais ---------- */
function textoOrigem(x){
  if (x.origem === 'manutencao') return 'reposta pela manutenção';
  if (x.origem === 'setor') return 'veio do setor ' + (x.setorNome || '?');
  return 'não estava cadastrada';
}
function abrirFormExtra(topo){
  ui.audFormTopo = !!topo;
  ui.audForm = { origem: 'manutencao', ref: '', setorOrigem: '', nome: '', modelo: '', qtd: 1 };
  render();
}
function fecharFormExtra(){ ui.audForm = null; render(); }
function formExtra(campo, v){
  if (!ui.audForm) return;
  ui.audForm[campo] = v;
  if (campo === 'origem' || campo === 'setorOrigem') ui.audForm.ref = '';
  render();
}
/* candidatas por origem: da manutenção, ou em uso noutro setor */
function candidatasExtra(){
  const f = ui.audForm;
  if (f.origem === 'manutencao') return db.maquinas.filter(m => m.situacao === 'manutencao');
  if (f.origem === 'setor' && f.setorOrigem)
    return db.maquinas.filter(m => m.situacao === 'uso' && m.setor === f.setorOrigem && m.setor !== ui.audSetor);
  return [];
}
function htmlFormExtra(){
  const f = ui.audForm, cand = candidatasExtra();
  const rot = m => esc(m.nome) + (m.modelo ? ' · ' + esc(m.modelo) : '') +
    ((Number(m.qtd)||0) > 1 ? ' (' + m.qtd + ')' : '');
  let h = '<div class="aud-form"><b>' +
    (f.sobraDe ? 'Achou ' + f.qtd + ' a mais de ' + esc(f.sobraDe) + ' — de onde veio?'
               : 'Máquina a mais — de onde ela veio?') + '</b>' +
    '<select onchange="formExtra(\'origem\',this.value)">' +
      '<option value="manutencao"' + (f.origem==='manutencao'?' selected':'') + '>Voltou da manutenção</option>' +
      '<option value="setor"' + (f.origem==='setor'?' selected':'') + '>Veio de outro setor</option>' +
      '<option value="nova"' + (f.origem==='nova'?' selected':'') + '>Não estava cadastrada</option>' +
    '</select>';
  if (f.origem === 'setor') {
    h += '<select onchange="formExtra(\'setorOrigem\',this.value)">' +
      '<option value="">— setor de origem —</option>' +
      db.setores.filter(x => x.id !== ui.audSetor).slice().sort((a,b)=>(a.ordem||0)-(b.ordem||0))
        .map(x => '<option value="' + x.id + '"' + (f.setorOrigem===x.id?' selected':'') + '>' + esc(x.nome) + '</option>').join('') +
      '</select>';
  }
  if (f.origem === 'nova') {
    /* oninput em vez de listener: este formulário é redesenhado pelo render()
       e um addEventListener se perderia junto com o nó antigo. */
    h += '<input type="text" id="audNome" autocomplete="off" placeholder="Nome da máquina" value="' + esc(f.nome) +
           '" oninput="ui.audForm.nome=this.value;pintarSug(\'audNome\',\'audMod\',\'audSug\')">' +
         '<div id="audSug"></div>' +
         '<input type="text" id="audMod" placeholder="Modelo (opcional)" value="' + esc(f.modelo) +
           '" oninput="ui.audForm.modelo=this.value">';
  } else {
    h += cand.length
      ? '<select onchange="formExtra(\'ref\',this.value)"><option value="">— qual máquina —</option>' +
        cand.map(m => '<option value="' + m.id + '"' + (f.ref===m.id?' selected':'') + '>' + rot(m) + '</option>').join('') +
        '</select>'
      : '<div class="aud-form-vazio">' + (f.origem==='manutencao'
          ? 'Não há nenhuma máquina em manutenção para repor.'
          : (f.setorOrigem ? 'Este setor não tem máquinas em uso.' : 'Escolha o setor de origem.')) + '</div>';
  }
  h += '<div class="aud-form-qtd"><span>Quantas</span>' +
       '<input type="number" min="1" value="' + (f.qtd||1) + '" oninput="ui.audForm.qtd=Math.max(1,Number(this.value)||1)"></div>' +
       '<div class="aud-form-bts">' +
         '<button class="btn sm" onclick="fecharFormExtra()">Cancelar</button>' +
         '<button class="btn primary sm" onclick="confirmarExtra()">Adicionar ao setor</button>' +
       '</div></div>';
  return h;
}
function confirmarExtra(){
  const f = ui.audForm; if (!f) return;
  const qtd = Math.max(1, Number(f.qtd)||1);
  let novo;
  if (f.origem === 'nova') {
    if (!String(f.nome||'').trim()) { toast('Escreva o nome da máquina.', true); return; }
    novo = { origem: 'nova', nome: f.nome.trim(), modelo: (f.modelo||'').trim(), qtd: qtd };
  } else {
    const m = db.maquinas.find(x => x.id === f.ref);
    if (!m) { toast('Escolha qual máquina apareceu.', true); return; }
    const disp = Number(m.qtd)||0;
    if (qtd > disp) { toast('Só há ' + disp + ' peça(s) nessa origem.', true); return; }
    novo = { origem: f.origem, ref: m.id, nome: m.nome, modelo: m.modelo, qtd: qtd,
             setorOrigem: f.setorOrigem || '', setorNome: f.origem==='setor' ? (setorPorId(f.setorOrigem)||{}).nome : '' };
  }
  addsDo(ui.audSetor).push(novo);
  ui.audForm = null;
  salvarAud(); render();
  toast('Máquina adicionada — ' + textoOrigem(novo));
}
function tirarExtra(i){
  addsDo(ui.audSetor).splice(i, 1);
  salvarAud(); render();
}

function btAud(id, tipo, ico, rot){
  const r = ui.audResp[id];
  const on = r && r.tipo === tipo ? ' on-' + (tipo === 'mnt' ? 'mnt' : tipo) : '';
  return '<button class="aud-bt' + on + '" onclick="marcar(\'' + id + '\',\'' + tipo + '\')">' +
    '<span style="font-size:15px">' + ico + '</span><small>' + rot + '</small></button>';
}
/* A lista que o auditor percorre. Máquina COM etiqueta vira uma entrada por
   peça -- é o que permite dizer QUAL bateria sumiu, e não só que falta uma
   de sete. Sem etiqueta, uma entrada por linha, conferida pela contagem.
   Os dois convivem: dá para etiquetar um setor por vez. */
function itensAud(sid){
  const out = [];
  doSetor(sid).forEach(m => {
    const etq = (m.etiquetas || []).filter(Boolean);
    if (etq.length) etq.forEach(e => out.push({ maquina: m, etiqueta: e, chaveAud: m.id + '#' + e }));
    else out.push({ maquina: m, etiqueta: '', chaveAud: m.id });
  });
  return out;
}
function abrirAud(sid){
  ui.audSetor = sid;
  ui.audResp = (ui.audPorSetor[sid] || {}).resp || {};
  salvarAud();
  render();
}
function recomecarAud(){
  if (!ui.audSetor) return;
  if (!confirm('Apagar o que já foi conferido neste setor e começar de novo?')) return;
  delete ui.audPorSetor[ui.audSetor];
  ui.audResp = {};
  salvarAud(); render();
}
function marcar(k, tipo){
  const it = itensAud(ui.audSetor).find(x => x.chaveAud === k); if (!it) return;
  const esperado = it.etiqueta ? 1 : (Number(it.maquina.qtd)||0);
  const atual = ui.audResp[k];
  if (atual && atual.tipo === tipo) delete ui.audResp[k];       /* tocar de novo desmarca */
  else ui.audResp[k] = { tipo: tipo, achou: tipo === 'ok' ? esperado : (tipo === 'falta' ? 0 : null) };
  guardarAud();
  render();
}
function setAchou(id, v){
  const n = Math.max(0, Number(v)||0);
  if (ui.audResp[id]) ui.audResp[id].achou = n;
  const it = itensAud(ui.audSetor).find(x => x.chaveAud === id);
  const esperado = it ? (it.etiqueta ? 1 : (Number(it.maquina.qtd)||0)) : 0;
  /* Contou mais do que devia: as esperadas estão todas lá (vira "confere") e a
     diferença é uma sobra, que só entra no estoque com origem declarada. */
  if (it && n > esperado) {
    ui.audResp[id] = { tipo: 'ok', achou: esperado };
    guardarAud();
    abrirFormExtra(1);
    ui.audForm.qtd = n - esperado;
    ui.audForm.sobraDe = it.maquina.nome + (it.maquina.modelo ? ' · ' + it.maquina.modelo : '');
    render();
    return;
  }
  guardarAud();
  /* sem render(): redesenhar aqui tiraria o foco do campo no meio da digitação */
}

function fecharAuditoria(){
  const s = setorPorId(ui.audSetor); if (!s) return;
  const ms = itensAud(ui.audSetor);
  const faltas = [], paraMnt = [], naoConf = [];
  ms.forEach(it => {
    const r = ui.audResp[it.chaveAud];
    if (!r) { naoConf.push(it); return; }
    if (r.tipo === 'falta') faltas.push({ it: it, achou: r.achou || 0 });
    if (r.tipo === 'mnt') paraMnt.push(it);
  });

  const reg = {
    id: uid('a'), setor: s.id, setorNome: s.nome, responsavel: s.responsavel || '',
    data: hoje(), quando: Date.now(),
    itens: ms.length, conferidos: ms.length - naoConf.length, comEventos: true,
    faltas: faltas.map(f => ({ nome: f.it.maquina.nome, modelo: f.it.maquina.modelo, etiqueta: f.it.etiqueta,
                               esperado: f.it.etiqueta ? 1 : (Number(f.it.maquina.qtd)||0), achou: f.achou })),
    manutencao: paraMnt.map(it => ({ nome: it.maquina.nome, modelo: it.maquina.modelo, etiqueta: it.etiqueta })),
    naoConferidos: naoConf.map(it => ({ nome: it.maquina.nome, modelo: it.maquina.modelo, etiqueta: it.etiqueta }))
  };
  db.auditorias.unshift(reg);

  /* O que o auditor marcou como "conserto" muda de situação de verdade --
     senão a auditoria vira um relatório que ninguém aplica. O setor de
     origem é preservado, para saber de onde a máquina saiu.
     Com etiqueta, só a PEÇA marcada sai: a linha perde 1 da quantidade e
     nasce uma linha de manutenção com aquela etiqueta. Mandar as sete
     baterias para o conserto porque uma quebrou seria mentira no estoque. */
  const jaFoi = {};
  paraMnt.forEach(it => {
    const m = it.maquina;
    const cons = { desde: hoje(), onde: '', motivo: 'marcada na conferência', previsao: '' };
    if (!it.etiqueta) {
      if (m.situacao !== 'manutencao') registrar('conserto', m, { qtd: Number(m.qtd)||0, de: s.nome, deId: m.setor, motivo: cons.motivo, desde: cons.desde });
      m.situacao = 'manutencao'; m.conserto = m.conserto || cons; return;
    }
    if (jaFoi[m.id + '#' + it.etiqueta]) return;
    jaFoi[m.id + '#' + it.etiqueta] = 1;
    m.etiquetas = (m.etiquetas||[]).filter(e => e !== it.etiqueta);
    m.qtd = Math.max(0, (Number(m.qtd)||1) - 1);
    db.maquinas.push({ id: uid('m'), nome: m.nome, modelo: m.modelo, qtd: 1,
                       setor: m.setor, situacao: 'manutencao', etiquetas: [it.etiqueta],
                       preco: precoUnit(m), precoFonte: m.precoFonte || '', conserto: cons });
    registrar('conserto', m, { qtd: 1, de: s.nome, deId: m.setor, motivo: cons.motivo, desde: cons.desde, etiquetas: [it.etiqueta] });
  });
  /* Linha que ficou com zero peça deixa de existir -- todas as suas peças
     foram para o conserto individualmente. */
  /* ---- o que apareceu a mais entra no estoque ----
     Toda entrada num setor e saida de outro lugar. Aplicar so a metade (somar
     aqui sem tirar de la) faria a soma da obra crescer sozinha a cada
     conferencia. */
  const entradas = addsDo(ui.audSetor);
  entradas.forEach(x => {
    if (x.origem === 'nova') {
      db.maquinas.push({ id: uid('m'), nome: x.nome, modelo: x.modelo || '', qtd: x.qtd,
                         setor: s.id, situacao: 'uso', etiquetas: [],
                         preco: precoBase(x.nome,x.modelo || ''), precoFonte: 'tabela-2026-09-03' });
      registrar('entrada', x, { qtd: x.qtd, para: s.nome, motivo: 'achada na conferência, não estava cadastrada' });
      return;
    }
    const o = db.maquinas.find(m => m.id === x.ref);
    if (!o) return;
    const leva = Math.min(x.qtd, Number(o.qtd)||0);
    if (!leva) return;
    if (o.situacao === 'manutencao') registrar('voltou', o, { qtd: leva, para: s.nome, paraId: s.id, onde: (o.conserto||{}).onde || '',
      desde: (o.conserto||{}).desde || '', dias: diasFora(o), custo: 0, obs: 'achada na conferência' });
    else registrar('mover', o, { qtd: leva, de: nomeLocal(o.setor), para: s.nome, deId: o.setor, paraId: s.id, motivo: 'achada na conferência' });
    o.qtd = (Number(o.qtd)||0) - leva;          /* a origem perde o que veio para ca */
    /* junta com a linha igual que ja exista aqui, em vez de criar uma segunda
       linha da mesma maquina no mesmo setor */
    const igual = db.maquinas.find(m => m.situacao === 'uso' && m.setor === s.id &&
      chave(m.nome) === chave(o.nome) && chave(m.modelo||'') === chave(o.modelo||''));
    if (igual) igual.qtd = (Number(igual.qtd)||0) + leva;
    else db.maquinas.push({ id: uid('m'), nome: o.nome, modelo: o.modelo || '', qtd: leva,
                            setor: s.id, situacao: 'uso', etiquetas: [],
                            preco: precoUnit(o), precoFonte: o.precoFonte || '' });
  });
  reg.adicionadas = entradas.map(x => ({ nome: x.nome, modelo: x.modelo || '', qtd: x.qtd,
                                         origem: x.origem, setorNome: x.setorNome || '',
                                         texto: textoOrigem(x) }));

  db.maquinas = db.maquinas.filter(m => (Number(m.qtd)||0) > 0);
  salvar();

  /* conferência fechada: sai do em-curso, senão ela ressuscitaria na próxima
     abertura já registrada */
  delete ui.audPorSetor[ui.audSetor];
  delete ui.audAdd[ui.audSetor];
  ui.audResp = {}; ui.audSetor = null; ui.modo = 'normal'; ui.aba = 'setores';
  salvarAud();
  render();

  const partes = [];
  if (reg.faltas.length) partes.push(reg.faltas.length + ' faltando');
  if (reg.manutencao.length) partes.push(reg.manutencao.length + ' para conserto');
  if (reg.adicionadas.length) partes.push(reg.adicionadas.length + ' a mais');
  if (naoConf.length) partes.push(naoConf.length + ' não conferido(s)');
  toast(s.nome + ': ' + (partes.length ? partes.join(' · ') : 'tudo certo') +
        (s.responsavel ? ' — responsável: ' + s.responsavel : ''), reg.faltas.length > 0);
}

/* =========================================================================
   v12 -- AVISOS, BUSCA, MOVER COM HISTÓRICO, FICHA, CONSERTO E TERMO
   (proposta aprovada pelo Everton em 06/10/2026: etapas A, B e C)

   O sistema respondia "quantas tem e onde estão". Faltava responder "o que
   aconteceu com ela": quem levou a furadeira para a Montagem, desde quando a
   solda está na oficina, quanto já se gastou consertando, quem assinou que
   recebeu as máquinas do setor. Isso agora fica em duas coleções novas na
   mesma nuvem (maquinas_rm): eventos (o histórico) e termos (os termos de
   responsabilidade assinados). As duas sobem pela mesma transação que junta
   item por item -- nada de gravar o banco inteiro.
   ========================================================================= */
const DIAS_CONSERTO = 30, DIAS_CONFERENCIA = 60;

/* A nuvem guarda lista como mapa: uma lista com buraco volta [a,null,c] ou
   {0:a,4:c}. Aqui ela sempre volta a ser lista, sem buraco. */
function listaNuvem(v){
  if (Array.isArray(v)) return v.filter(x => x != null);
  if (v && typeof v === 'object') return Object.keys(v).sort((a,b) => (Number(a) - Number(b)) || (a < b ? -1 : a > b ? 1 : 0))
    .map(k => v[k]).filter(x => x != null);
  return [];
}
function quem(){ try { const u = firebase.auth().currentUser; return (u && u.email) || ''; } catch(e){ return ''; } }
function quemCurto(e){ return String(e || '').split('@')[0]; }
function chaveItem(m){ return chave(m && m.nome) + '|' + chave(m && m.modelo); }
function nomeLocal(id){ const s = setorPorId(id); return s ? s.nome : 'Sem setor'; }
function entreDias(a, b){ return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000); }
function numBR(s){
  let x = String(s == null ? '' : s).trim().replace(/[R$\s]/g, '');
  if (x.indexOf(',') > -1) x = x.replace(/\./g, '').replace(',', '.');
  const n = Number(x); return x === '' ? 0 : (Number.isFinite(n) ? n : NaN);
}

/* ---------- o histórico ----------
   Cada evento leva o nome e o modelo COMO ERAM, e a chave do item: a ficha
   junta tudo pela chave, então a máquina que trocou de linha (dividiu,
   juntou, voltou do conserto) continua com a história inteira. */
function registrar(tipo, m, extra){
  db.eventos.unshift(Object.assign({ id: uid('e'), tipo: tipo, quando: Date.now(), data: hoje(),
    k: chaveItem(m), nome: (m && m.nome) || '', modelo: (m && m.modelo) || '', por: quem() }, extra || {}));
}
/* Renomear (padronizar a grafia, unificar parecidos) muda a chave: o
   histórico e os termos acompanham, senão a ficha começaria do zero. */
function renomearHistorico(mapa){
  if (!Object.keys(mapa).length) return;
  db.eventos.forEach(e => { if (e && mapa[e.k]) e.k = mapa[e.k]; });
  db.termos.forEach(t => (t.itens || []).forEach(i => { if (mapa[i.k]) i.k = mapa[i.k]; }));
}

/* ---------- conserto e conferência: há quanto tempo ---------- */
function diasFora(m){
  const c = m && m.conserto;
  if (!c || !/^\d{4}-\d{2}-\d{2}$/.test(c.desde || '')) return null;
  return -diasAte(c.desde);
}
function previsaoVencida(m){
  const c = m && m.conserto;
  return !!(c && /^\d{4}-\d{2}-\d{2}$/.test(c.previsao || '') && diasAte(c.previsao) < 0);
}
function ultimaConferencia(sid){
  return db.auditorias.filter(a => a && a.setor === sid).map(a => a.data || '').sort().pop() || '';
}
function setoresSemConferencia(){
  return setoresProducao().filter(s => { const u = ultimaConferencia(s.id); return !u || -diasAte(u) > DIAS_CONFERENCIA; });
}
function haDias(d){ return d === 0 ? 'hoje' : 'há ' + d + ' dia' + (d === 1 ? '' : 's'); }

/* ---------- avisos no lugar dos quadros ----------
   "Em uso 79" e "Setores produtivos 4" não pediam nada de ninguém. Cada
   quadro agora é uma pergunta que alguém precisa responder -- e leva para a
   tela onde se responde. */
function alertaCard(cls, val, lbl, sub, acao){
  return '<button type="button" class="card al ' + cls + '" onclick="' + acao + '">' +
    '<span class="lbl">' + esc(lbl) + '</span><span class="val mono">' + val + '</span>' +
    '<span class="sub">' + esc(sub) + '</span></button>';
}
function htmlAvisos(){
  const mnts = daSituacao('manutencao');
  const longos = mnts.filter(m => (diasFora(m) || 0) > DIAS_CONSERTO), atras = mnts.filter(previsaoVencida);
  const acab = db.maquinas.filter(m => { const g = garantia(m); return g && g.estado === 'acabando'; });
  const semConf = setoresSemConferencia();
  const uso = pecas(daSituacao('uso')), mnt = pecas(mnts), pendentes = semPreco(db.maquinas);
  const nomes = l => { const n = [...new Set(l.map(x => x.nome))]; return n.slice(0, 2).join(', ') + (n.length > 2 ? ' e mais ' + (n.length - 2) : ''); };
  return alertaCard(longos.length || atras.length ? 'r' : 'n', longos.length ? pecas(longos) : mnt,
      longos.length ? 'No conserto há +' + DIAS_CONSERTO + ' dias' : 'No conserto',
      longos.length ? nomes(longos) : (atras.length ? atras.length + ' com a previsão vencida' : (mnt ? 'nenhuma há mais de ' + DIAS_CONSERTO + ' dias' : 'nada fora')),
      "irPara('manutencao')") +
    alertaCard(acab.length ? 'w' : 'n', pecas(acab), 'Garantia acabando',
      acab.length ? 'nos próximos 60 dias' : 'nenhuma nos próximos 60 dias', "irInventario('garantia')") +
    alertaCard(semConf.length ? 'w' : 'n', semConf.length, semConf.length === 1 ? 'Setor sem conferência' : 'Setores sem conferência',
      semConf.length ? semConf.map(s => s.nome).join(', ') + ' · +' + DIAS_CONFERENCIA + ' dias' : 'todos conferidos nos últimos ' + DIAS_CONFERENCIA + ' dias',
      "irConferencias('historico')") +
    alertaCard('n', uso + mnt, 'Peças no parque', uso + ' em uso · ' + mnt + ' no conserto', "irInventario('')") +
    alertaCard(pendentes ? 'w' : 'g', moeda(valorLista(db.maquinas)), 'Valor do parque',
      pendentes ? pendentes + ' peça(s) sem valor' : 'valoração completa', "irInventario('semvalor')");
}
function irInventario(f){ ui.fSit = f || ''; ui.busca = ''; ui.fSetor = ''; const b = $('barra'); if (b) b.dataset.chave = ''; irPara('inventario'); }
function irConferencias(sub){ ui.confSub = sub || 'historico'; irPara('conferencias'); }

/* ---------- busca e filtros ----------
   A barra NÃO é redesenhada a cada letra: o campo de busca é o mesmo nó do
   começo ao fim, senão o foco sairia dele a cada tecla. Só a lista abaixo
   é refeita. */
function filtrando(){ return !!(String(ui.busca || '').trim() || ui.fSetor || ui.fSit); }
function passa(m, ignoraSetor){
  const ws = String(ui.busca || '').split(/\s+/).map(chave).filter(Boolean);
  if (ws.length) {
    const alvo = [m.nome, m.modelo].concat(m.etiquetas || []).map(chave).join('|');
    if (!ws.every(w => alvo.indexOf(w) > -1)) return false;
  }
  if (!ignoraSetor && ui.fSetor && m.setor !== ui.fSetor) return false;
  if (ui.fSit) {
    const g = garantia(m);
    if (ui.fSit === 'garantia' && !(g && g.estado === 'acabando')) return false;
    if (ui.fSit === 'vencida' && !(g && g.estado === 'vencida')) return false;
    if (ui.fSit === 'semvalor' && temPreco(m)) return false;
    if (ui.fSit === 'semcompra' && m.dataCompra) return false;
  }
  return true;
}
function limparFiltros(){
  ui.busca = ''; ui.fSetor = ''; ui.fSit = '';
  const b = $('barra'); if (b) b.dataset.chave = '';
  render();
}
function renderBarra(){

  }

  if (el.dataset.chave === chaveBarra) return;
  el.dataset.chave = chaveBarra;
  const est = estoqueInternoAtual();
  const lugares = setoresProducao().concat(est ? [est] : []);
  const comSetor = aba !== 'estoque', comSit = aba !== 'manutencao';
  el.innerHTML =
    '<label class="busca"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>' +
      '<input type="search" id="busca" autocomplete="off" placeholder="Buscar máquina, modelo ou etiqueta' + (aba === 'setores' ? ' — em todos os setores' : '') + '"' +
      ' value="' + esc(ui.busca || '') + '" oninput="ui.busca=this.value;renderConteudo()" aria-label="Buscar máquina"></label>' +
    (comSetor ? '<select id="fSetor" onchange="ui.fSetor=this.value;renderConteudo()" aria-label="Setor">' +
      '<option value="">Todos os setores</option>' + lugares.map(s => '<option value="' + s.id + '"' + (ui.fSetor === s.id ? ' selected' : '') + '>' + esc(s.nome) + '</option>').join('') +
      '</select>' : '') +
    (comSit ? '<select id="fSit" onchange="ui.fSit=this.value;renderConteudo()" aria-label="Situação">' +
      [['','Qualquer situação'],['garantia','Garantia acabando'],['vencida','Garantia vencida'],['semvalor','Sem valor definido'],['semcompra','Sem compra registrada']]
        .map(([v,r]) => '<option value="' + v + '"' + ((ui.fSit || '') === v ? ' selected' : '') + '>' + r + '</option>').join('') + '</select>' : '') +

      '<button class="btn bt-mais" aria-label="Mais opções" onclick="abrirMenu(event,[[\'Novo setor\',\'novoSetor()\'],[\'Importar da planilha\',\'abrirImportar()\']])">⋯</button>' : '') +

/* ---------- menu ⋯ ----------
   Cada linha tinha dois ou três botões escritos por extenso, repetidos 64
   vezes. Ficam Mover (o que mais se faz) e ⋯ com o resto. */
function abrirMenu(ev, itens){
  ev.stopPropagation();
  fecharMenu();
  const bt = ev.currentTarget, r = bt.getBoundingClientRect();
  const m = document.createElement('div');
  m.className = 'menu-acoes'; m.id = 'menuAcoes'; m.setAttribute('role', 'menu');
  m.innerHTML = itens.map(([rot, acao, cls]) => '<button type="button" role="menuitem"' + (cls ? ' class="' + cls + '"' : '') +
    ' onclick="fecharMenu();' + acao + '">' + esc(rot) + '</button>').join('');
  document.body.appendChild(m);
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + 'px';
  m.style.top = (r.bottom + h + 8 > innerHeight ? Math.max(8, r.top - h - 4) : r.bottom + 4) + 'px';
  const pri = m.querySelector('button'); if (pri) pri.focus();
}
function fecharMenu(){ const m = $('menuAcoes'); if (m) m.remove(); }
function menuMaquina(ev, id){
  const m = db.maquinas.find(x => x.id === id); if (!m) return;
  const est = estoqueInternoAtual(), noEstoque = est && m.setor === est.id;
  const i = [['Ficha da máquina', "abrirFicha('" + id + "')"]];
  if (m.situacao === 'manutencao') i.push(['Dados do conserto', "editarConserto('" + id + "')"]);
  else i.push(['Mandar para conserto', "mandarConserto('" + id + "')"]);
  i.push(['Editar cadastro', "editarMaquina('" + id + "')"]);
  if (m.situacao === 'uso' && !noEstoque) i.push(['Enviar ao Estoque Interno', "moverDialog('" + id + "','estoque')"]);
  if (m.situacao === 'uso' && noEstoque) i.push(['Excluir definitivamente', "excluirMaquina('" + id + "')", 'perigo']);
  abrirMenu(ev, i);
}
document.addEventListener('click', e => { if (!e.target.closest || !e.target.closest('#menuAcoes')) fecharMenu(); });
window.addEventListener('resize', fecharMenu);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('menuAcoes')) { fecharMenu(); return; }
  if ($('ov').classList.contains('show')) { fecharModal(); return; }
  if (ui.ficha) fecharFicha();
});

/* ---------- a linha da máquina ---------- */
function situacaoTexto(m){

/* ---------- o bloco do setor ----------
   O cabeçalho responde as duas perguntas de quem cobra o setor: quem
   responde por ele e quando foi conferido pela última vez. */
function infoSetor(s){
  if (ehEstoqueInterno(s)) return 'disponível para alocação';
  const ult = ultimaConferencia(s.id), d = ult ? -diasAte(ult) : null;
  return (s.responsavel ? 'resp. <b>' + esc(s.responsavel) + '</b>' : '<span class="warn">sem responsável</span>') + ' · ' +
    (ult ? '<span' + (d > DIAS_CONFERENCIA ? ' class="warn"' : '') + '>conferido ' + haDias(d) + '</span>' : '<span class="warn">nunca conferido</span>');
}
function blocoSetor(s, ms, emBusca){
  const est = ehEstoqueInterno(s), fechado = !emBusca && !!ui.recolhidos[s.id];
  return '<div class="setor' + (fechado ? ' recolhido' : '') + '" data-setor="' + s.id + '"><div class="setor-h">' +
    '<span class="setor-cor" style="background:' + esc(s.cor) + '"></span>' +
    '<span class="setor-nome">' + esc(s.nome) + '</span>' +
    '<span class="setor-info">' + infoSetor(s) + '</span>' +
    '<span class="setor-esp"></span>' +
    '<span class="setor-qtd mono">' + pecas(ms) + ' peças</span>' +
    (est || emBusca ? '' : seloTermo(s)) +
    (est ? '' : '<button class="btn sm" onclick="editarSetor(\'' + s.id + '\')">Editar</button>') +
    (emBusca ? '' : '<button class="btn sm recolher" onclick="recolher(\'' + s.id + '\')" aria-expanded="' + !fechado + '" title="' +
      (fechado ? 'Mostrar as máquinas' : 'Recolher') + '">' + (fechado ? '▸' : '▾') + '</button>') +
    '</div>' + tabela(ms) + '</div>';
}
const RECOLHIDOS_KEY = STORE_KEY + '_recolhidos';
function recolher(sid){
  ui.recolhidos[sid] = !ui.recolhidos[sid];
  if (!ui.recolhidos[sid]) delete ui.recolhidos[sid];
  try { localStorage.setItem(RECOLHIDOS_KEY, JSON.stringify(ui.recolhidos)); } catch(e){}
  renderConteudo();
}
function lerRecolhidos(){ try { ui.recolhidos = JSON.parse(localStorage.getItem(RECOLHIDOS_KEY) || '{}') || {}; } catch(e){ ui.recolhidos = {}; } }

/* Com busca ou filtro, a resposta vem de TODO lugar: setores, Estoque
   Interno e conserto. "Onde está a DTD 172?" não pode depender de a pessoa
   adivinhar a aba. */
function htmlResultados(){
  const est = estoqueInternoAtual();

  const orfas = db.maquinas.filter(m => m.situacao === 'uso' && !setorPorId(m.setor) && passa(m));
  const mnt = daSituacao('manutencao').filter(m => passa(m));

    '<span class="setor-nome">Sem setor</span><span class="setor-esp"></span><span class="setor-qtd mono">' + pecas(orfas) + ' peças</span></div>' + tabela(orfas) + '</div>';
