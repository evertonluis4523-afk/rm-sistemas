  background:var(--wm-ink);
}
@media (max-width:600px){ body::before{ width:220px; height:220px; } }
/* Fora do papel: o PDF copia a pagina com este CSS, e o canto saia cortado
   seco na margem de 12 mm. O impresso ja tem a marca d'agua dele (rm-dagua). */
@media print{ body::before{ display:none!important; } }
/* Toque duplo nao amplia a tela: no celular (e dentro da Central, onde o
   sistema abre num quadro) o zoom tirava a barra de cima do lugar. A pinca
   continua funcionando. */
html{ touch-action:manipulation; }
.mono{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.hide{display:none !important}

/* ---------- app bar: igual aos outros sistemas RM ---------- */
.appbar{background:var(--surface);position:sticky;top:0;z-index:40;border-bottom:1px solid var(--border)}
.appbar-inner{max-width:1600px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.rm-marca{height:26px;width:auto;flex:none}
.brand h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.brand h1 b{color:var(--accent);font-weight:800;letter-spacing:.4px}
.brand p{margin:0;font-size:12px;color:var(--muted);font-weight:560;letter-spacing:.3px;text-transform:uppercase}
.appbar-spacer{flex:1}
.appbar-actions{display:flex;gap:8px;align-items:center}
.storage-pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--surface-2);color:var(--muted);border:1px solid var(--border);display:flex;align-items:center;gap:6px}
.storage-pill .dot{width:7px;height:7px;border-radius:50%;background:#22c55e}
.storage-pill.local .dot{background:#f59e0b}

.btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:9px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.12s;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:#d4d4d8}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:7px;font-weight:530}
.btn.danger{color:var(--accent);border-color:#f0caca}
.btn.danger:hover{background:var(--accent-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.wrap{max-width:1600px;margin:0 auto;padding:22px 18px}

/* ---------- números do topo ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:15px 16px;box-shadow:var(--shadow)}
.card .lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.card .val{font-size:26px;font-weight:800;letter-spacing:-.8px;margin-top:4px}
.card .sub{font-size:13px;color:var(--faint);margin-top:2px;font-weight:530}

/* ---------- abas ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{border:0;background:transparent;padding:10px 14px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--accent);color:color-mix(in srgb,var(--accent) 85%,#000);border-bottom-color:var(--accent)}

/* ---------- setor ---------- */
.setor{background:var(--surface);border:1px solid var(--border);border-radius:13px;margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
.setor-h{display:flex;align-items:center;gap:11px;padding:13px 16px;border-bottom:1px solid var(--border-2)}
/* A cor mora no SETOR, nunca na máquina: trocar a cor de um setor não
   obriga a mexer em nenhum equipamento. */
.setor-cor{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.15)}
.setor-nome{font-weight:700;font-size:14.5px;flex:1;min-width:0}
.setor-qtd{font-size:13px;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:3px 10px}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);font-weight:700;padding:9px 16px;border-bottom:1px solid var(--border-2)}
td{padding:10px 16px;border-bottom:1px solid var(--border-2);font-size:14px}
tr:last-child td{border-bottom:0}
.t-num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.t-acao{text-align:right;white-space:nowrap}
.modelo{color:var(--muted);font-size:14px;font-weight:505}

/* ---------- ações do Total geral ---------- */
.total-destino{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 12px;border-radius:9px;
  background:#f7f1fb;border:1px solid #d8c4e5;color:#5d2478;font-size:14px;font-weight:650;line-height:1.4}
.total-destino .setor-cor{width:12px;height:12px}

/* ---------- valoração interna ---------- */
.valor-setores{margin-bottom:16px}
.valor-setores td:last-child,.valor-setores th:last-child{text-align:right}
.valor-total{font-weight:800;background:var(--surface-2)}
.preco-pendente{display:inline-block;padding:2px 8px;border-radius:20px;background:var(--mnt-bg);color:var(--mnt-fg);
  font-size:12px;font-weight:750;white-space:nowrap}

/* ---------- sugestões de item já cadastrado ---------- */
.sug{margin-top:7px;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--surface)}
.sug-t{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:8px 11px 5px;line-height:1.3}
.sug-i{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 8px;width:100%;text-align:left;padding:8px 11px;
  border:0;border-top:1px solid var(--border);background:transparent;cursor:pointer;font:inherit}
.sug-i:hover{background:var(--surface-2)}
.sug-i b{font-size:14px;font-weight:505}
.sug-i span{font-size:13px;color:var(--muted);font-weight:530}
/* No celular o local não cabe na mesma linha: em vez de cortar no meio da
   palavra, desce para a linha de baixo alinhado à direita. */
.sug-i i{margin-left:auto;font-style:normal;font-size:12px;color:var(--muted);max-width:100%;font-weight:560}

/* ---------- unificar nomes parecidos ---------- */
.uni{margin:9px 0;border:1px solid var(--border);border-radius:9px;background:var(--surface);overflow:hidden}
.uni-l{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.uni-n{flex:1;min-width:170px;line-height:1.35}
.uni-n b{font-size:14px;display:block;font-weight:505}
.uni-n span{font-size:13px;color:var(--muted);font-weight:530}
.uni-bt{padding:8px 11px;text-align:right}

.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block}
.pill.uso{background:var(--ok-bg);color:var(--ok-fg)}
.pill.manutencao{background:var(--mnt-bg);color:var(--mnt-fg)}

.vazio{padding:26px 16px;text-align:center;color:var(--faint);font-size:14px;font-weight:505}

/* ---------- modelos já cadastrados sob o mesmo nome ---------- */
.mod-dica{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.6;font-weight:530}
.mod-b{font:inherit;font-size:13px;font-weight:700;padding:2px 8px;margin:2px 3px 2px 0;
  border:1px solid var(--border);border-radius:20px;background:var(--surface-2);cursor:pointer}
.mod-b:hover{background:var(--surface)}

/* ---------- compra e garantia ---------- */
.bloco-compra{margin-top:18px;padding:13px 14px 15px;border:1px solid var(--border);
  border-radius:11px;background:var(--surface-2)}
.bloco-compra .bc-t{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.04em;
  color:var(--muted);margin-bottom:4px}
.bloco-compra .bc-t span{text-transform:none;font-weight:600;letter-spacing:0}
.bloco-compra label{margin-top:10px}
.bloco-compra .bc-g{display:flex;gap:10px;flex-wrap:wrap}
.bloco-compra .bc-g>div{flex:1 1 140px;min-width:0}
.bloco-compra .bc-g input{width:100%}
.gar{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;
  margin-left:7px;vertical-align:1px;white-space:nowrap}
.gar.ok{background:var(--ok-bg);color:var(--ok-fg)}
.gar.fim{background:var(--mnt-bg);color:var(--mnt-fg)}
.gar.off{background:#f6e2e0;color:#9d2b25}
.gar.sem{background:var(--surface-2);color:var(--muted)}
@media(max-width:620px){ .gar{margin-left:0;margin-top:4px;display:block;width:fit-content} }

/* ---------- abrir a linha somada e ver de onde veio ---------- */
.exp{font:inherit;font-size:12px;font-weight:700;color:var(--muted);background:transparent;
  border:1px solid var(--border);border-radius:20px;padding:1px 9px 2px;margin-left:8px;
  cursor:pointer;white-space:nowrap;vertical-align:1px}
.exp:hover{background:var(--surface-2);color:var(--ink)}
.exp .ch{display:inline-block;margin-right:4px;transition:transform .12s}
.exp.on{background:var(--surface-2);color:var(--ink);border-color:var(--muted)}
.exp.on .ch{transform:rotate(90deg)}
tr.pai>td{border-bottom:0}
tr.det>td{padding:0 0 10px;background:var(--surface-2)}
.det-in{padding:2px 12px 10px}
.det-vazio{font-size:13px;color:var(--muted);padding:8px 2px;font-weight:530}
.det-t{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:9px;overflow:hidden}
.det-t th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
  text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);font-weight:750;background:var(--surface-2)}
.det-t td{padding:7px 10px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle;font-weight:505}
.det-t tr:last-child td{border-bottom:0}
.det-t .t-num{text-align:right}
@media(max-width:620px){ .det-in{padding:2px 6px 10px} .det-t th,.det-t td{padding:6px 7px;font-size:13px;font-weight:530} }

/* ---------- anexo de compras no relatório ---------- */
.rel-chk{cursor:pointer;user-select:none}
.rel-chk input{margin-right:6px;vertical-align:-1px}
.rel-anexo .an-tot td{border-top:1px solid var(--border);padding-top:9px}
.rel-anexo .an-l td{color:var(--muted);font-size:13px;padding-top:2px;padding-bottom:2px;font-weight:530}
.rel-anexo .an-l td:nth-child(3){color:var(--ink)}

/* ---------- avisos de nome parecido ---------- */
.alerta{background:var(--mnt-bg);border:1px solid #f7d488;border-radius:11px;padding:13px 15px;margin-bottom:14px;font-size:14px;font-weight:505}
.alerta b{color:var(--mnt-fg)}
.alerta ul{margin:7px 0 0;padding-left:19px}
.alerta li{margin-bottom:3px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:90;padding:16px}
.overlay.show{display:flex}
/* ===================== TRANSIÇÕES =====================
   A animação existe para dizer O QUE MUDOU, não para enfeitar: curta, só na
   entrada, e mexendo apenas em opacidade e deslocamento -- coisas que o
   navegador resolve na placa de vídeo, sem recalcular a página.

   Quem pediu menos movimento no sistema operacional não recebe nenhuma, e a
   impressão também não anima: uma folha capturada no meio sairia clara. */
@keyframes rmEntraLogin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes rmEntraFundo{from{opacity:0}to{opacity:1}}
@keyframes rmEntraModal{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.overlay.show{animation:rmEntraFundo .18s ease both}
.overlay.show .modal{animation:rmEntraModal .2s cubic-bezier(.2,.7,.3,1) both}
/* A saída do login É a transição: com display:none ela não teria como
   acontecer -- o elemento sumiria antes do primeiro quadro. Ele fica no
   lugar, perde a opacidade e só então some da árvore (visibility no fim do
   atraso), sem receber clique nenhum enquanto isso.
   O .hide daqui é utilitário de página inteira e vem com !important, então
   este par precisa ser mais específico (#loginScreen.hide) para desfazer só
   o display -- e só no login, sem tocar em nenhum outro uso da classe. */
#loginScreen{opacity:1;transition:opacity .3s ease}
#loginScreen.hide{display:flex!important;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .3s ease,visibility 0s linear .3s}
/* A animacao presa ao estado VISIVEL, nao ao cartao solto: enquanto o
   login estava escondido por display:none o navegador reiniciava a
   animacao ao reexibir. Com visibility:hidden o cartao nunca sai da
   arvore -- a animacao rodava no carregamento, invisivel, terminava, e
   nunca mais voltava. Preso ao :not() o nome da animacao muda de none
   para rmEntraLogin no instante em que a tela aparece, e ela comeca ali. */
#loginScreen:not(.hide) .login-box{animation:rmEntraLogin .4s cubic-bezier(.2,.7,.3,1) both}

/* ---------- RESPOSTA DA TELA DE ENTRADA ----------
   Antes o erro apenas aparecia, num corte seco, e o botao so ficava cinza --
   continuando escrito "Entrar". Num celular com conexao lenta isso parece
   toque morto: voce toca e nada muda por um ou dois segundos. Aqui a tela
   responde.

   A tremida NAO e enfeite: ela diz que falhou antes de voce ler a mensagem.
   E fica no 0% e 100% em transform:none de proposito -- sem esses dois
   quadros o preenchimento "both" pararia no ultimo quadro escrito e o cartao
   descansaria 2px fora do lugar. */
@keyframes rmTreme{
  0%,100%{transform:none}
  15%{transform:translateX(-7px)}  30%{transform:translateX(6px)}
  45%{transform:translateX(-4px)}  60%{transform:translateX(3px)}
  75%{transform:translateX(-2px)}
}
@keyframes rmEntraErro{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes rmGira{to{transform:rotate(360deg)}}
/* Precisa da mesma especificidade da regra de entrada logo acima, mais a
   classe: com menos que isso a entrada venceria e a tremida nao apareceria. */
#loginScreen:not(.hide) .login-box.treme{animation:rmTreme .4s cubic-bezier(.36,.07,.19,.97) both}
.erro.on{animation:rmEntraErro .18s ease both}
/* O anel usa a cor do proprio texto do botao, entao serve em qualquer um dos
   sistemas sem precisar saber a cor de fundo de cada tema. */
#loginBtn.ocupado{display:inline-flex;align-items:center;justify-content:center;gap:8px}
#loginBtn.ocupado::before{content:"";width:14px;height:14px;border-radius:50%;
  border:2px solid currentColor;border-top-color:transparent;opacity:.85;
  animation:rmGira .7s linear infinite}
@media(prefers-reduced-motion:reduce){
  #loginScreen:not(.hide) .login-box.treme,.erro.on{animation:none!important}
  /* sem o anel girando sobra o "Entrando...", que ja diz o necessario */
  #loginBtn.ocupado::before{display:none}
}

@media(prefers-reduced-motion:reduce){
  .overlay.show,.overlay.show .modal,#loginScreen,#loginScreen .login-box{animation:none!important;transition:none!important}
}
@media print{
  .overlay.show,.overlay.show .modal,#loginScreen .login-box{animation:none!important}
  /* escondido de verdade no papel: um fixo do tamanho da tela, ainda que
     invisivel, e o tipo de elemento que rende folha em branco */
  #loginScreen.hide{display:none!important}
}
.modal{background:var(--surface);border-radius:15px;box-shadow:var(--shadow-lg);width:100%;max-width:440px;max-height:92vh;overflow:auto}
.modal h3{margin:0;padding:17px 20px 0;font-size:16px}
.modal .body{padding:15px 20px}
.modal .foot{padding:13px 20px 18px;display:flex;gap:9px;justify-content:flex-end}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:11px 0 5px}
input[type=text],input[type=number],input[type=email],input[type=password],select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:2px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;box-shadow:var(--shadow-lg);z-index:30;max-height:220px;overflow:auto;display:none}
.sugg.open{display:block}
.sugg .it{padding:9px 11px;cursor:pointer;border-bottom:1px solid var(--border-2);font-size:14px;color:var(--ink)}
.sugg .it:last-child{border-bottom:0}
.sugg .it:hover,.sugg .it.active{background:var(--surface-2)}
.cores{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}
.cor-op{width:34px;height:34px;border-radius:9px;border:2px solid transparent;cursor:pointer}
.cor-op.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}

/* ---------- toast ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--appbar);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg)}
.toast.err{background:var(--accent)}

/* ---------- login ---------- */
#loginScreen{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:360px;padding:26px}
.login-box h2{margin:0 0 4px;font-size:18px}
.login-box p{margin:0 0 16px;font-size:14px;color:var(--muted);font-weight:505}

/* ---- tela de entrada, padrao da casa ----
   Era o primeiro contato com cada sistema e cada um tinha o seu: uns com o
   logo, dois com cadeado, tres sem imagem, e titulo e subtitulo trocados de
   lugar entre si. Agora todos abrem igual: a empresa em cima, o sistema
   embaixo. */
#loginLogo{height:44px;width:auto;display:block;margin:0 auto 12px}
.login-box .lc-head{text-align:center;margin-bottom:18px}
.login-box .lc-head h2{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:800;margin:0}
.login-box .lc-head p{margin:4px 0 0;font-size:13px;color:var(--muted);font-weight:530}
/* ---------- CABEÇALHO DO CARTÃO ----------
   Sao quinze sistemas com esta mesma tela de entrada. O que a pessoa precisa
   saber ao abrir e em qual deles ela esta -- e isso era a linha cinza pequena,
   enquanto o nome da empresa ocupava o destaque. Invertido: a empresa vira
   anotacao em cima, o nome do sistema vira o titulo.
   Aqui o cabecalho usa h2 e p, e nao .ttl/.sub como nos outros. */
.login-box .lc-head h2{font-family:var(--mono);font-size:11px;font-weight:600;
  letter-spacing:.19em;color:var(--muted);text-transform:uppercase;margin:0}
.login-box .lc-head p{font-family:var(--sans);font-size:21px;font-weight:800;
  letter-spacing:-.015em;color:var(--text);margin:7px 0 0;line-height:1.15}
.erro{color:var(--accent);font-size:14px;margin-top:9px;display:none;font-weight:505}
.erro.on{display:block}

/* =======================================================================
   AUDITORIA — o modo que roda no celular, no meio do galpão.
   Alvos grandes o suficiente para o polegar (44px é o mínimo que a Apple e
   o Google recomendam) e uma decisão por linha, nunca um formulário.
   ======================================================================= */
.aud-topo{position:sticky;top:57px;z-index:30;background:var(--bg);padding:10px 0 12px;border-bottom:1px solid var(--border)}
.aud-prog{height:7px;border-radius:20px;background:var(--border);overflow:hidden;margin-top:9px}
.aud-retoma{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff8e6;border:1px solid #e8c96a;
  border-radius:10px;padding:9px 12px;margin:10px 0;font-size:14px;color:#6b5010;line-height:1.45;font-weight:505}
.aud-retoma .btn{margin-left:auto;flex:none}
.aud-linha.sobra{border-left:4px solid #1f7a4d;background:#f2faf5}
.aud-origem{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px;font-size:13px;color:#1f7a4d;font-weight:600}
.aud-origem .btn{margin-left:auto;flex:none;font-weight:600}
.aud-form{border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:10px;background:var(--surface-2)}
.aud-form b{display:block;margin-bottom:9px;font-size:14px}
.aud-form select,.aud-form input[type=text]{width:100%;margin-bottom:8px}
.aud-form-vazio{font-size:14px;color:var(--muted);margin-bottom:8px;line-height:1.45;font-weight:505}
.aud-form-qtd{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.aud-form-qtd span{font-size:14px;color:var(--muted);font-weight:600}
.aud-form-qtd input{width:90px}
.aud-form-bts{display:flex;gap:8px}
.aud-form-bts .btn{flex:1}
.app-rodape{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
  margin:26px 0 34px;font-family:var(--mono,monospace);font-size:12px;color:var(--faint);white-space:nowrap;font-weight:560}
@media print{.app-rodape{display:none}}
.add-extra{width:100%;margin:10px 0;border-style:dashed;font-weight:700;color:#1f7a4d;border-color:#9ccdb1;background:#f2faf5}
.conf{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:11px}
.conf-top{display:flex;align-items:center;gap:11px}
.conf-nome{font-weight:700;font-size:14.5px}
.conf-sub{font-size:13px;color:var(--muted);margin-top:2px;font-weight:530}
.conf-ok{margin-top:9px;font-size:14px;color:#1f7a4d;font-weight:600}
.conf-bloco{margin-top:10px;border-left:3px solid var(--border);padding-left:10px}
.conf-bloco b{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:560}
.conf-bloco ul{margin:5px 0 0;padding-left:17px;font-size:14px;line-height:1.65;font-weight:505}
.conf-bloco.falta{border-left-color:#B3123C}
.conf-bloco.sobra{border-left-color:#1f7a4d}
.conf-bloco.mnt{border-left-color:#b4690e}
.conf-bloco.nc{border-left-color:var(--faint)}
.conf-mod,.conf-num,.conf-etq,.conf-org{color:var(--muted);font-size:13px;font-weight:530}
.conf-org{color:#1f7a4d;font-weight:600}
.aud-prog i{display:block;height:100%;background:var(--ok-fg);transition:width .25s}
.aud-linha{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow)}
.aud-linha.ok{border-color:#9ae6b4;background:#f6fdf8}
.aud-linha.falta{border-color:#f8b4b4;background:#fff7f7}
.aud-linha.mnt{border-color:#f7d488;background:#fffdf5}
.aud-nome{font-weight:700;font-size:15px;line-height:1.25}
.aud-sub{font-size:14px;color:var(--muted);margin-top:2px;font-weight:505}
.aud-esperado{font-size:14px;font-weight:700;margin-top:2px}
.aud-etq{display:inline-block;margin-top:5px;font-size:14px;font-weight:800;letter-spacing:.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:3px 9px}
.aud-bts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}
.aud-bt{min-height:44px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.15}
.aud-bt small{font-weight:600;font-size:12px;color:var(--faint)}
.aud-bt.on-ok{background:var(--ok-bg);border-color:var(--ok-fg);color:var(--ok-fg)}
.aud-bt.on-falta{background:var(--falta-bg);border-color:var(--falta-fg);color:var(--falta-fg)}
.aud-bt.on-mnt{background:var(--mnt-bg);border-color:var(--mnt-fg);color:var(--mnt-fg)}
.aud-qtd{display:flex;align-items:center;gap:9px;margin-top:9px}
.aud-qtd input{width:78px;text-align:center;font-weight:700;font-size:16px}
.aud-fim{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:17px;box-shadow:var(--shadow)}

/* -----------------------------------------------------------------------
   "Reconhece onde está abrindo": a decisão NÃO é pelo user-agent, que
   mente e envelhece. É por largura e por ponteiro grosso (dedo). Um
   celular no bolso e um tablet na mão do auditor caem no mesmo modo; um
   notebook, não. E o botão do topo permite forçar qualquer um dos dois --
   quem está no galpão sabe melhor que a heurística.
   ----------------------------------------------------------------------- */
@media (max-width:760px){
  .appbar-inner{padding:11px 14px}
  .brand h1{font-size:14px}
  .rm-marca{height:22px}
  .wrap{padding:14px}
  .cards{grid-template-columns:repeat(2,1fr);gap:9px}
  .card .val{font-size:21px}
  /* A tabela vira lista: cada linha é um cartão, sem rolagem lateral. */
  table,thead,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tr{border-bottom:1px solid var(--border-2);padding:11px 14px;position:relative}
  tr:last-child{border-bottom:0}
  td{border:0;padding:1px 0;font-size:14px}
  td.t-num{text-align:left;font-size:14px;color:var(--muted);font-weight:505}
  td.t-num::before{content:'Quantidade: ';font-weight:600}
  .valor-setores td:nth-child(2)::before{content:'Peças: ';font-weight:600}
  .valor-setores td:nth-child(3)::before{content:'Sem valor: ';font-weight:600}
  .valor-setores td:nth-child(4)::before{content:'Valor total: ';font-weight:600}
  td.t-acao{text-align:left;margin-top:8px}
  td.t-acao .btn{min-height:38px}
  .setor-h{flex-wrap:wrap}
  .modal{max-width:100%}
  .aud-topo{top:50px}
  /* O relatório é uma folha: vira tabela de novo, com rolagem lateral, senão
     as colunas de anotar somem no celular e a folha impressa não confere. */
  .rel-rolagem{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .rel-tab{display:table;width:auto;min-width:100%}
  .rel-tab thead{display:table-header-group}
  .rel-tab tbody{display:table-row-group}
  .rel-tab tr{display:table-row;padding:0;border-bottom:0}
  .rel-tab th,.rel-tab td{display:table-cell;width:auto;border-bottom:1px solid var(--border-2);
    padding:6px 9px;font-size:13px;white-space:nowrap;font-weight:530}
  .rel-tab td.t-num{text-align:right;color:var(--ink)}
  .rel-tab td.t-num::before{content:none}
  .rel-folha{padding:15px 14px}
  .rel-cab{flex-direction:column;gap:6px}
  .rel-cab-dir{text-align:left}
}
/* Duas colunas até bem estreito. O corte em 400px empurrava os quatro
   blocos para quatro linhas justamente no aparelho com menos tela. */
@media (max-width:330px){ .cards{grid-template-columns:1fr} }

/* A faixa que substitui os blocos durante a auditoria. */
.resumo-linha{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:9px 13px;margin-bottom:14px;
  background:var(--surface);border:1px solid var(--border);border-radius:11px;
  font-size:14px;color:var(--muted);font-weight:600;box-shadow:var(--shadow)}
.resumo-linha b{color:var(--ink);font-size:14.5px}

/* ---------- aba Relatório: folha para conferir na mão ---------- */
.rel-acoes{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.rel-dica{font-size:14px;color:var(--muted);font-weight:505}
.rel-filtro{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);font-weight:600}
.rel-filtro select{border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:9px;padding:8px 10px;font-weight:600;font-size:14px;max-width:230px}
.rel-folha{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:22px 24px;box-shadow:var(--shadow)}
/* A REGUA da identidade fecha o cabecalho da marca, como nos outros doze.
   Aqui ela nao existia: o papel tinha a logo e a etiqueta na cor da marca,
   mas nenhuma laranja fechando o topo. print-color-adjust nos dois -- sem
   ele somem ao imprimir com "graficos de fundo" desligado, o padrao. */
.rel-emp{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-bottom:14px;position:relative}
.rel-emp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--rm-laranja);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rel-emp::before{content:"";position:absolute;left:0;right:0;bottom:-4.5px;height:1.5px;background:var(--rm-escuro);opacity:.85;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rel-emp.sem-logo{justify-content:flex-start}
.rel-emp.sem-logo .rel-emp-dados{text-align:left}
.rel-emp-logo{height:58px;width:auto;flex:none}
.rel-emp-dados{text-align:right;font-size:13px;color:var(--muted);line-height:1.55;font-weight:530}
.rel-emp-dados b{display:block;font-size:15px;color:var(--ink);margin-bottom:1px}
.rel-emp-sis{color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.18em;font-size:11px;margin-top:12px}
.rel-emp .tb2{display:flex;gap:16px;text-align:left}.tb2 .tb2-c{text-align:left!important}.rel-emp .tb2-c+.tb2-c{border-left:1px solid var(--border);padding-left:16px}.rel-emp .tb2-rz{font-weight:700;color:var(--ink,#141414)}
.rel-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid var(--border)}
/* Fio leve, e nao outro tracoo de 2 px em preto: com a regua logo acima
   ficavam duas barras pesadas a 60 px uma da outra. */
.rel-cab h2{margin:0;font-size:17px;letter-spacing:-.2px}
.rel-cab p{margin:2px 0 0;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.rel-cab-dir{text-align:right;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted);white-space:nowrap;font-weight:530}
.rel-bloco{margin-bottom:20px;break-inside:avoid;page-break-inside:avoid}
.rel-bloco h3{display:flex;align-items:center;gap:8px;margin:0 0 7px;font-size:14px}
.rel-bloco h3 small{font-weight:500;color:var(--muted)}
.rel-tot{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted)}
.rel-tab{border:1px solid var(--border-2)}
.rel-tab th{background:var(--surface-2);padding:6px 10px;border-bottom:1px solid var(--border-2)}
.rel-tab td{padding:6px 10px;font-size:14px;font-weight:505}
.rel-tab .rel-vazio{border-left:1px solid var(--border-2);width:74px}
.rel-ass{display:flex;gap:34px;margin-top:26px;padding-top:6px}
.rel-ass div{flex:1;font-size:13px;color:var(--muted);font-weight:530}
.rel-ass span{display:block;border-bottom:1px solid var(--ink);height:26px;margin-bottom:4px}

@media print{
  @page{margin:14mm}
  .appbar,.cards,.resumo-linha,.tabs,.rel-acoes,#toasts,.overlay{display:none !important}
  body{background:#fff}
  .wrap{padding:0;max-width:none}
  .rel-folha{border:0;border-radius:0;box-shadow:none;padding:0}
  .rel-tab{border-color:#999}
  .rel-tab th,.rel-tab td,.rel-tab .rel-vazio{border-color:#bbb}
  .rel-tab th{background:#f0f0f0}
  /* Sem isto o papel sai sem a cor do setor. Para poupar tinta o navegador
     descarta cor de fundo ao imprimir (o padrão é print-color-adjust:economy),
     e a bolinha do setor é exatamente um fundo colorido -- saía branca, junto
     com o cinza do cabeçalho da tabela. Aqui a cor não é enfeite: é ela que
     diz de qual setor a máquina é, do mesmo jeito que a etiqueta no galpão. */
  .rel-folha,.rel-folha *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.resumo-linha .mnt b{color:var(--mnt-fg)}

/* A fonte da marca manda em tudo -- ver o bloco no topo do documento. */
:root{
  --rm-font:'Satoshi',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --rm-mono:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono','Courier New',monospace;
  --font:var(--rm-font);
  --sans:var(--rm-font);
  --mono:var(--rm-font);
}
*{font-family:inherit!important}
html,body{font-family:var(--rm-font)!important}
/* O PESO DO TEXTO CORRIDO. A Satoshi no peso 400 poe 17% MENOS tinta na tela
   que a fonte do sistema que ela substituiu, no mesmo tamanho -- medido
   renderizando o mesmo paragrafo e somando o quanto cada pixel se afasta do

   corrido muda aqui.
   465 e o peso em que a Satoshi empata com a fonte antiga: 10,04 em 460 e
   10,38 em 470. Como a fonte e variavel, esse valor existe de verdade --
   nao e um negrito falso desenhado pelo navegador. */
html,body{font-weight:490}

<style id="rmTemaRM">
/* ===========================================================================
   TEMA RM · aparência única -- igual em todos os sistemas.

   Fonte única: central_rm/comum/tema-rm.html. Não se edita dentro de um
   sistema; muda aqui e roda ferramentas/aplica_comum.py.

   Cada sistema nasceu com o seu botão, o seu campo e a sua tabela: cantos de
   7 a 11 px, botões de 31 a 44 px de altura, letra de 13 a 15, cabeçalho de
   tabela de 10 a 14 px, três sombras de cartão diferentes. A cor já era quase
   a mesma; o resto não. Aqui mora a decisão UMA vez:

   1. As MEDIDAS (variáveis --rm-*): cor, canto, altura, letra, sombra.
      Mudar uma delas muda os quinze sistemas juntos.
   2. Os nomes antigos de cada sistema (--red, --ink, --line...) passam a
      apontar para elas -- o CSS de cada um continua valendo, mas com a
      medida da casa.
   3. Os COMPONENTES: botão, campo, cabeçalho de tabela, cartão.

   O que este bloco NÃO toca, de propósito: display, posição, largura,
   margem. Ele decide a APARÊNCIA; quem decide onde a peça fica e se ela
   aparece é o sistema. Assim um .hide{display:none} continua escondendo, e
   um botão de largura inteira continua inteiro.

   Força: o "html " na frente de cada regra ganha do .btn do sistema em
   qualquer ordem, mas perde para uma regra de lugar (".appbar .btn") -- lugar
   específico pode ajustar TAMANHO. Cor e canto vêm daqui sempre (ver o fim).
   Impressão fica de fora (@media screen): o papel tem o padrão dele.
   O escuro não é escrito aqui: o bloco do tema claro/escuro deriva ele destas
   mesmas cores, como faz com o resto.
   =========================================================================== */
:root{
  /* cor */
  --rm-marca:#D53309;        /* botão principal, destaque, aba ativa */
  --rm-marca-escura:#9B2709; /* passar o mouse no principal */
  --rm-marca-suave:#FDECE6;  /* fundo de destaque leve */
  --rm-texto:#16171a;
  --rm-texto-2:#474e5c;      /* texto de botão secundário, rótulo forte */
  --rm-apagado:#5e6169;      /* rótulo, legenda, cabeçalho de tabela */
  --rm-linha:#E4E6EA;
  --rm-linha-2:#E6E8EC;      /* linha entre linhas de tabela (era #EEF0F3: sumia, e a
                                lista de funcionários virava um bloco só) */
  --rm-faixa:#f7f8fa;        /* linha sim, linha não, nas tabelas */
  --rm-realce:#fff4ef;       /* linha sob o mouse */
  --rm-linha-forte:#cfd3da;  /* borda ao passar o mouse */
  --rm-fundo:#F4F5F7;
  --rm-superficie:#ffffff;
  --rm-superficie-2:#fafbfc; /* cabeçalho de tabela, faixa leve */
  --rm-ok:#1f7a4d;     --rm-ok-suave:#e8f3ec;
  /* aviso: #b4690e dava 3,7:1 sobre o próprio fundo suave (e 4,2:1 no
     branco) -- o "Em andamento" e o "vence hoje" ficavam apagados. Um degrau
     mais escuro, mesmo tom: 4,8:1 no suave, 5,5:1 no branco. */
  --rm-aviso:#9a5a0c;  --rm-aviso-suave:#fbf0e1;
  --rm-perigo:#B3123C; --rm-perigo-suave:#fbe9ee;
  --rm-info:#1f5fae;   --rm-info-suave:#e8f0fa;
  /* canto */
  --rm-raio-p:7px;           /* botão pequeno, etiqueta */
  --rm-raio:9px;             /* botão, campo */
  --rm-raio-g:14px;          /* cartão, janela */
  --rm-raio-pilula:999px;
  /* altura e letra */
  --rm-ctl:38px;             /* botão e campo */
  --rm-ctl-p:32px;           /* botão pequeno */
  --rm-fs:14px;
  --rm-fs-p:13px;
  --rm-fs-rotulo:12px;       /* cabeçalho de tabela, rótulo em versalete */
  --rm-peso-btn:600;
  /* sombra e foco */
  --rm-sombra:0 1px 2px rgba(20,20,30,.05),0 6px 18px rgba(20,20,30,.04);
  --rm-sombra-g:0 12px 32px rgba(20,20,30,.14);
  --rm-foco:0 0 0 3px rgba(213,51,9,.16);

  /* nomes antigos -> medidas da casa (só os que querem dizer a mesma coisa
     em todos os sistemas) */
  --red:var(--rm-marca); --accent:var(--rm-marca);
  --red-d:var(--rm-marca-escura); --red-dark:var(--rm-marca-escura); --accent-dark:var(--rm-marca-escura);
  --red-soft:var(--rm-marca-suave); --accent-soft:var(--rm-marca-suave);
  --ink:var(--rm-texto); --gray:var(--rm-texto-2);
  --muted:var(--rm-apagado); --faint:var(--rm-apagado);
  --line:var(--rm-linha); --border:var(--rm-linha);
  --line-2:var(--rm-linha-2); --border-2:var(--rm-linha-2);
  --bg:var(--rm-fundo); --surface:var(--rm-superficie); --card:var(--rm-superficie);
  --surface-2:var(--rm-superficie-2);
  --ok:var(--rm-ok); --ok-soft:var(--rm-ok-suave);
  --warn:var(--rm-aviso); --warn-soft:var(--rm-aviso-suave);
  --radius:var(--rm-raio-g);
}
@media screen{
/* ---------- BOTÃO ----------
   Nomes que cada sistema usa para a mesma coisa:
   base ........ .btn  .btn-act  .btn-sm  .btn-mini
   principal ... .btn.primary  .btn-red  .btn.red  .btn-sm.red  .btn-act.save
   secundário .. .btn.ghost  .btn-ghost  .btn-act.dim  .btn-gray
   perigo ...... .btn.danger
   pequeno ..... .btn.sm  .btn-sm  .btn-xs  .btn-mini */
html .btn,html .btn-act,html .btn-sm,html .btn-mini{
  min-height:var(--rm-ctl);padding-top:0;padding-bottom:0;padding-left:14px;padding-right:14px;
  border:1px solid var(--rm-linha);border-radius:var(--rm-raio);
  background-color:var(--rm-superficie);color:var(--rm-texto);
  font-size:var(--rm-fs);font-weight:var(--rm-peso-btn);line-height:1.2;
  box-shadow:none;cursor:pointer;
  transition:background-color .12s,border-color .12s,color .12s,box-shadow .12s;
}
html .btn:hover,html .btn-act:hover,html .btn-sm:hover,html .btn-mini:hover{
  background-color:var(--rm-superficie-2);border-color:var(--rm-linha-forte);color:var(--rm-texto);
}
html .btn.ghost,html .btn-ghost,html .btn-act.dim,html .btn-gray{
  background-color:var(--rm-superficie);border-color:var(--rm-linha);color:var(--rm-texto-2);
}
html .btn.ghost:hover,html .btn-ghost:hover,html .btn-act.dim:hover,html .btn-gray:hover{
  background-color:var(--rm-superficie-2);border-color:var(--rm-linha-forte);color:var(--rm-texto);
}
html .btn.primary,html .btn-red,html .btn.red,html .btn-sm.red,html .btn-act.save{
  background-color:var(--rm-marca);border-color:var(--rm-marca);color:#fff;
}
html .btn.primary:hover,html .btn-red:hover,html .btn.red:hover,html .btn-sm.red:hover,html .btn-act.save:hover{
  background-color:var(--rm-marca-escura);border-color:var(--rm-marca-escura);color:#fff;
}
html .btn.danger{background-color:var(--rm-superficie);border-color:var(--rm-linha);color:var(--rm-perigo)}
html .btn.danger:hover{background-color:var(--rm-perigo-suave);border-color:var(--rm-perigo);color:var(--rm-perigo)}
html .btn.sm,html .btn-sm,html .btn-xs,html .btn-mini,html .btn-act.sm{
  min-height:var(--rm-ctl-p);padding-left:10px;padding-right:10px;
  border-radius:var(--rm-raio-p);font-size:var(--rm-fs-p);
}
html .btn:disabled,html .btn-act:disabled,html .btn-sm:disabled,html .btn-mini:disabled{
  opacity:.5;cursor:not-allowed;
}
html .btn:focus-visible,html .btn-act:focus-visible,html .btn-sm:focus-visible,html .btn-mini:focus-visible{
  outline:none;box-shadow:var(--rm-foco);
}

/* ---------- CAMPO ----------
   Só canto, letra, cor da borda e foco. Altura e recuo ficam com o sistema:
   há campo dentro de célula de tabela (baixinho, sem borda) e campo de busca
   com a lupa dentro -- forçar o recuo empurraria a lupa para cima do texto.
   :where() deixa a regra com força zero de classe: um campo com classe
   própria (célula transparente) continua como está.
   O FUNDO também mora aqui. Campo sem fundo escrito ficava com o branco do
   navegador -- que o tema escuro não enxerga (não é regra de ninguém) -- e
   no escuro virava caixa branca com letra clara: o login do Obras, os
   custos do Corte, a busca de orçamentos salvos, o mês dos Salários. */
html :where(input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]):not([type=hidden]),select,textarea){
  border-radius:var(--rm-raio);font-size:var(--rm-fs);color:var(--rm-texto);background-color:var(--rm-superficie);
}
html :where(input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]):not([type=hidden]),select,textarea):focus{
  outline:none;border-color:var(--rm-marca);box-shadow:var(--rm-foco);
}
html :where(input,select,textarea):disabled{opacity:.6;cursor:not-allowed}
html :where(input,select,textarea)::placeholder{color:var(--rm-apagado);opacity:.8}

/* ---------- TABELA ----------
   O cabeçalho é o mesmo em toda a casa: versalete pequeno, cinza, linha
   embaixo. O espaçamento fica com cada tabela (há relatório de 20 colunas). */
html th{
  font-size:var(--rm-fs-rotulo);font-weight:700;color:var(--rm-apagado);
  text-transform:uppercase;letter-spacing:.05em;
  border-bottom-color:var(--rm-linha);
}

/* FAIXAS: linha sim, linha não, levemente cinza; a linha sob o mouse fica
   com um toque da marca. É o que separa um registro do outro numa lista
   comprida (a de funcionários do Recibos parecia um bloco só).
   :where() deixa a regra com força ZERO: célula que já tem cor própria (o
   calendário do Almoços, o status pintado) continua com a sua. Fora: a grade
   do Almoços (.grid), a do Cheques (.bgrid) e quem pedir .sem-faixa. */
:where(table:not(.grid):not(.bgrid):not(.sem-faixa)>tbody>tr:nth-child(even)>td){background-color:var(--rm-faixa)}
:where(table:not(.grid):not(.bgrid):not(.sem-faixa)>tbody>tr:hover>td){background-color:var(--rm-realce)}
/* no celular, a tabela .cartao-mob vira um cartão por linha: o cartão já
   separa, e a faixa pintaria um bloco cinza dentro dele */
@media (max-width:720px){:where(table.cartao-mob>tbody>tr>td){background-color:transparent}}

/* ---------- INICIAIS ----------
   O círculo com as iniciais de uma pessoa, na frente do nome, numa lista de
   gente: o olho acha onde começa cada um. NEUTRO de propósito: a primeira
   versão tinha uma cor forte por pessoa e ficou gritante -- a lista virava um
   confete. Cinza claro, letra cinza, fio fino: marca o começo da linha sem
   disputar com o nome nem com a etiqueta de situação. (As classes c0..c6 que
   os sistemas ainda mandam não pintam mais nada.) */
.rm-iniciais{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  width:32px;height:32px;border-radius:50%;background-color:#F1F2F4;color:var(--rm-apagado);
  box-shadow:inset 0 0 0 1px var(--rm-linha);
  font-size:12px;font-weight:600;letter-spacing:.02em;line-height:1;user-select:none}
/* pequena: dentro de linha de grupo, lista densa */
.rm-iniciais.p{width:26px;height:26px;font-size:10.5px;vertical-align:middle}
/* A PEÇA DE REGISTRO (montada por rmRegistro, bloco registro.html): iniciais,
   nome forte, dados menores e apagados embaixo. */
.rm-registro{display:flex;align-items:center;gap:12px;min-width:0}
.rm-registro.topo{align-items:flex-start}
.rm-registro.topo>.rm-iniciais{margin-top:1px}
.rm-reg-txt{min-width:0}
.rm-reg-nome{font-size:15px;font-weight:700;color:var(--rm-texto);line-height:1.3}
.rm-reg-dados{font-size:12.5px;font-weight:500;color:var(--rm-apagado);line-height:1.4;margin-top:3px}
.rm-registro.p{gap:10px}
.rm-registro.p>.rm-iniciais{width:28px;height:28px;font-size:11px}
.rm-registro.p .rm-reg-nome{font-size:14px}
@media (max-width:720px){
  .rm-registro.flutua{display:block}
  .rm-registro.flutua>.rm-iniciais{float:left;margin:0 12px 6px 0}
  .rm-registro.flutua .rm-reg-nome{padding-top:6px;min-height:32px}
  .rm-registro.flutua .rm-reg-dados{clear:both}
}

/* ---------- CARTÃO ----------
   Só o canto e a cor da borda: em alguns sistemas ".card" é caixa sem fundo
   (a lista de funcionários do Recibos), e pintar o fundo mudaria a tela. */
html .card{border-radius:var(--rm-raio-g);border-color:var(--rm-linha)}

/* ---------- CANTO E COR VALEM EM QUALQUER LUGAR ----------
   Uma regra de lugar (".appbar .btn", ".toolbar .btn") pode deixar o botão
   mais baixo ou mais estreito, mas não inventa outro canto nem outra cor. */
html .btn:not(.sm):not(.btn-sm):not(.btn-xs),html .btn-act:not(.sm){border-radius:var(--rm-raio)!important}
html .btn.sm,html .btn-sm,html .btn-xs,html .btn-mini{border-radius:var(--rm-raio-p)!important}
}
/* no papel as iniciais não aparecem: são para achar a linha na tela */
@media print{.rm-iniciais{display:none!important}}
/* BORDAS LIMPAS NO TEMA CLARO. Sombra larga (8 a 24 px) num fundo
   cinza-claro vira faixa manchada: dentro da Central ela se somava a' sombra
   da barra lateral, e a margem entre a barra e a folha ficava clara no meio
   e escura nas pontas. No claro a borda e' o fio da folha mais uma sombra de
   1-2 px; o escuro fica como estava (la' a sombra some no fundo). */
body:not([data-theme="escuro"]){
  --shadow:0 1px 2px rgba(20,24,32,.05);
  --rm-sombra:0 1px 2px rgba(20,20,30,.05);
}

<script id="rmRegistroBloco">
/* ===========================================================================
   REGISTRO RM · iniciais + nome + dados -- igual em todos os sistemas.

   Numa lista de gente ou de empresa (funcionários, fornecedores, emitentes,
   clientes) cada linha abre do mesmo jeito: o círculo com as iniciais, o
   nome forte e, embaixo, os dados menores e apagados. Foi o que resolveu a
   lista de funcionários do Recibos, que parecia um bloco só.

     rmIniciais(nome[, 'p'])            -> '<span class="rm-iniciais c3">JS</span>'
     rmRegistro(nome, dadosHTML, opt)   -> a peça inteira
       opt.depoisNome: HTML logo depois do nome (selo, etiqueta)
       opt.classe:     'p' (pequeno, lista densa), 'topo' (iniciais no alto),
                       'flutua' (no celular o texto passa por baixo das iniciais)

   O nome é escapado aqui; dadosHTML e depoisNome já vêm prontos do sistema.
   O círculo é neutro (cinza claro, Tema RM); a classe c0..c6 que sai de uma
   conta sobre o nome fica só como gancho, sem pintar nada.
   O visual (.rm-registro, .rm-iniciais) mora no Tema RM.
   =========================================================================== */
(function(){
  if(window.rmRegistro) return;
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  var LIGA=/^(d[aeo]s?|e|&)$/i;
  function iniciais(nome){
    var p=String(nome||'').trim().replace(/[^\p{L}\p{N}\s&]/gu,' ').split(/\s+/).filter(function(x){return x&&!LIGA.test(x);});
    if(!p.length) return '?';
    return ((p[0][0]||'')+(p.length>1?(p[p.length-1][0]||''):(p[0][1]||''))).toUpperCase();
  }
  function cor(nome){ var h=0,s=String(nome||'').toUpperCase();
    for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h)%7; }
  window.rmIniciais=function(nome,extra){
    return '<span class="rm-iniciais c'+cor(nome)+(extra?' '+extra:'')+'" aria-hidden="true">'+esc(iniciais(nome))+'</span>';
  };
  window.rmRegistro=function(nome,dados,opt){
    opt=opt||{};
    return '<div class="rm-registro'+(opt.classe?' '+opt.classe:'')+'">'+window.rmIniciais(nome)
      +'<div class="rm-reg-txt"><div class="rm-reg-nome">'+esc(nome)+(opt.depoisNome||'')+'</div>'
      +(dados?'<div class="rm-reg-dados">'+dados+'</div>':'')+'</div></div>';
  };
})();
</script>

       body[data-wallpaper] -> o PADRAO (a trama que cobre o fundo)

  body[data-theme="escuro"]{ --wm-grid: rgba(255,255,255,.4); --wm-nome:#F4F5F7; }

  /* --- as cinco tintas da marca --- */
  body[data-marca="laranja"] { --wm-marca:#F24618; }
  body[data-marca="grafite"] { --wm-marca:#16171a; }
  body[data-theme="escuro"][data-marca="grafite"] { --wm-marca:#e8eaed; }
  body[data-marca="vinho"]   { --wm-marca:#B3123C; }
  body[data-marca="verde"]   { --wm-marca:#1f7a4d; }
  body[data-marca="aco"]     { --wm-marca:#1f5fae; }

  /* --- camada 2: a marca, sempre por mascara --- */
  .content-watermark::after{
    content:''; position:absolute; inset:0;
    -webkit-mask-image:var(--wm-forma); mask-image:var(--wm-forma);
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-size:min(30vh,34vw,320px) auto; mask-size:min(30vh,34vw,320px) auto;
    -webkit-mask-position:center 48%; mask-position:center 48%;
    background:var(--wm-marca);
    opacity: var(--wm-op, .08);
  }
  /* --- camada 1: o padrao --- */
  .content-watermark::before{
    content:''; position:absolute; inset:0;
    opacity: var(--wm-op, .08);
  }

  /* GRADE: papel milimetrado ortogonal */
  body[data-wallpaper="grade"] .content-watermark::before{
    background-image:
      linear-gradient(var(--wm-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--wm-grid) 1px, transparent 1px);
    background-size:34px 34px;
  }
  /* TRELICA: losango em diagonal, lembra trelica estrutural. Ladrilho
     SVG de 80x46 por mascara: a rampa de gradiente que existia antes
     so disfarcava o serrilhado, nao tirava. */
  body[data-wallpaper="trelica"] .content-watermark::before{
    background:var(--wm-grid);
    -webkit-mask:var(--wm-trelica) 0 0/80px 46px repeat;
    mask:var(--wm-trelica) 0 0/80px 46px repeat;
  }
  /* HALO: luz atras da marca, sobre a grade */
  body[data-wallpaper="halo"] .content-watermark::before{
    background-image:
      radial-gradient(circle at 50% 48%, var(--wm-marca), transparent 30%),
      linear-gradient(var(--wm-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--wm-grid) 1px, transparent 1px);
    background-size:100% 100%,46px 46px,46px 46px;
    background-repeat:no-repeat,repeat,repeat;
  }
  /* ARQUITETONICO: duas faixas diagonais largas */
  body[data-wallpaper="diagonal"] .content-watermark::before{
    background-image:
      linear-gradient(132deg,transparent 0 55%,var(--wm-marca) 55.2% 63%,transparent 63.2%),
      linear-gradient(48deg,transparent 0 72%,var(--wm-grid) 72.2% 78%,transparent 78.2%);
    background-repeat:no-repeat;
  }
  /* PLANTA INDUSTRIAL: malha larga com dois eixos marcados */
  body[data-wallpaper="planta"] .content-watermark::before{
    background-image:
      linear-gradient(120deg,transparent 15%,var(--wm-marca) 15.2% 15.8%,transparent 16% 62%,var(--wm-marca) 62.2% 62.8%,transparent 63%),
      repeating-linear-gradient(0deg,transparent 0 33px,var(--wm-grid) 34px),
      repeating-linear-gradient(90deg,transparent 0 33px,var(--wm-grid) 34px);
    background-size:100% 100%,auto,auto;
    background-repeat:no-repeat,repeat,repeat;
  }
  /* CANTO: a trama e a marca recolhidas no canto, longe da leitura --
     o mesmo desenho do canto dos sistemas: trama isometrica no modulo da
     marca, folga em volta dela, degrade longo e a marca em contorno.
     Duas mascaras do mesmo tamanho e posicao (uma por camada) para a
     trama ficar na tinta neutra e a marca na cor escolhida. */
  body[data-wallpaper="canto"] .content-watermark::before{
    background:var(--wm-grid);
    -webkit-mask:var(--wm-canto-grade) right bottom/320px 320px no-repeat;
    mask:var(--wm-canto-grade) right bottom/320px 320px no-repeat;
    opacity:calc(var(--wm-op, .08) * 3.7);
  }
  body[data-wallpaper="canto"] .content-watermark::after{
    -webkit-mask-image:var(--wm-canto-marca); mask-image:var(--wm-canto-marca);
    -webkit-mask-size:320px 320px; mask-size:320px 320px;
    -webkit-mask-position:right bottom; mask-position:right bottom;
    opacity:calc(var(--wm-op, .08) * 2.8);
  }
  /* TRAMA COMPLETA: a trama do canto cobrindo a tela toda, sem o degrade,
     e a marca em contorno no mesmo canto. A trama e' mais leve que a do
     canto porque passa por tras de todo o conteudo. Duas mascaras: a trama
     menos a folga do simbolo (mask-composite). */
  body[data-wallpaper="trama"] .content-watermark::before{
    background:var(--wm-grid);
    -webkit-mask:var(--wm-trama) 0 0/35px 20px repeat, var(--wm-canto-furo) right bottom/320px 320px no-repeat;
    -webkit-mask-composite:source-out;
    mask:var(--wm-trama) 0 0/35px 20px repeat, var(--wm-canto-furo) right bottom/320px 320px no-repeat;
    mask-composite:subtract;
    opacity:calc(var(--wm-op, .08) * 2);
  }
  body[data-wallpaper="trama"] .content-watermark::after{
    -webkit-mask-image:var(--wm-canto-marca); mask-image:var(--wm-canto-marca);
    -webkit-mask-size:320px 320px; mask-size:320px 320px;
    -webkit-mask-position:right bottom; mask-position:right bottom;
    opacity:calc(var(--wm-op, .08) * 2.8);
  }
  /* MARCA: o fundo da capa do WhatsApp -- a trama cobrindo a tela e, no
     meio, a logo inteira (sem endereco). E' uma mascara so' com a logo; o
     fundo por tras dela e' um degrade duro que pinta os primeiros 18,05%
     (o simbolo: 145,33 de 805,51 da largura) na cor da marca e o resto (o
     nome) na tinta do texto -- preto no claro, branco no escuro. */
  body[data-wallpaper="logo"] .content-watermark::before{
    background:var(--wm-grid);
    -webkit-mask:var(--wm-trama) 0 0/35px 20px repeat; mask:var(--wm-trama) 0 0/35px 20px repeat;
    opacity:calc(var(--wm-op, .08) * 2);
  }
  body[data-wallpaper="logo"] .content-watermark::after{
    inset:auto; left:50%; top:52%; transform:translate(-50%,-50%);
    width:min(58vw,720px); aspect-ratio:805.51/157.967; height:auto;
    -webkit-mask:var(--wm-logo) center/100% 100% no-repeat; mask:var(--wm-logo) center/100% 100% no-repeat;
    background:linear-gradient(90deg,var(--wm-marca) 0 18.05%,var(--wm-nome) 18.05% 100%);
    opacity:calc(var(--wm-op, .08) * 2.4);
  }
  @media (max-width:600px){
    body[data-wallpaper="trama"] .content-watermark::before{ -webkit-mask-size:35px 20px, 220px 220px; mask-size:35px 20px, 220px 220px; }
    body[data-wallpaper="trama"] .content-watermark::after{ -webkit-mask-size:220px 220px; mask-size:220px 220px; }
    body[data-wallpaper="canto"] .content-watermark::before{ -webkit-mask-size:220px 220px; mask-size:220px 220px; }
    body[data-wallpaper="canto"] .content-watermark::after{ -webkit-mask-size:220px 220px; mask-size:220px 220px; }
  }

  /* NOS SISTEMAS: a mesma camada, presa na tela e atrás de tudo. Quando o
     fundo da Central entra, o canto próprio do sistema (body::before) sai --
     o fundo escolhido já traz a trama e a marca dele. */
  #rmFundo.content-watermark { position: fixed; inset: 0; z-index: -1; }
  html[data-rm-fundo] body::before { display: none !important; }
  @media print { #rmFundo { display: none !important; } }

  /* DENTRO DA CENTRAL, NO CLARO: a margem cinza do sistema, colada na barra
     branca da Central, parecia uma mancha. No quadro a margem fica branca e a
     folha é marcada só pelo fio. Aberto sozinho, o sistema fica como sempre. */
  html.rm-quadro body:not([data-theme="escuro"]) { background: #fff; }
  html.rm-quadro body:not([data-theme="escuro"]) .sheet { box-shadow: none; }

/* GRAVAR SEM ATROPELAR QUEM MEXEU AO MESMO TEMPO.

   quando sincronizava, apagava o que o outro tinha mudado nesse meio tempo.
   Agora e' uma transacao que junta item por item (setores, maquinas,

   (fdbBase) vai; o resto fica como a nuvem tem. */
let fdbBase = null;
function porId(arr){ const m = {}; (arr||[]).forEach(x => { if (x && x.id != null) m[x.id] = x; }); return m; }
function mescla3(b, l, r){
  const B = porId(b), L = porId(l), out = [], visto = {};
  const igual = (x, y) => JSON.stringify(x) === JSON.stringify(y);
  (r||[]).forEach(x => {
    if (!x || x.id == null) return; const id = x.id; visto[id] = 1;
    if (B[id] && !L[id]) return;                                  // apagado aqui
    out.push(L[id] && (!B[id] || !igual(L[id], B[id])) ? L[id] : x);
  });
  (l||[]).forEach(x => {                                            // novo aqui
    if (!x || x.id == null || visto[x.id]) return;
    if (!B[x.id] || !igual(x, B[x.id])) out.push(x);
  });
  return out;
}
function nuvemGrava(){

    const b = base || rem;
    /* histórico e termos entram na mesma junção item por item: o que um
       aparelho registrou não apaga o que o outro registrou ao mesmo tempo */
    return { setores: mescla3(b.setores, local.setores, rem.setores),
             maquinas: mescla3(b.maquinas, local.maquinas, rem.maquinas),
             auditorias: mescla3(b.auditorias, local.auditorias, rem.auditorias),

             termos: mescla3(b.termos || [], local.termos || [], rem.termos),
             iniciado: true };
  }, err => { if (err) rmNuvemErro('salvar o estoque de máquinas (maquinas_rm)', err); }, false);

/* ---------- conferência em curso ----------
   O auditor anda pelo galpão com o celular na mão marcando item por item. Isso
   só existia em memória: bastava a tela travar e o app recarregar, ou um toque
   no voltar, para os itens já conferidos sumirem. Numa conferência de 85 peças
   isso é o trabalho da manhã inteira.

   Fica em chave PRÓPRIA do localStorage, e não dentro de db, de propósito: o
   ouvinte da nuvem remonta db a partir de setores/máquinas/auditorias e
   descarta o resto -- uma gravação vinda de outro aparelho apagaria as marcas
   no meio da conferência.

   Guardado por SETOR: dá para conferir o Pré-Moldado, sair, e retomar de onde
   parou quando voltar. */
const AUD_KEY = STORE_KEY + '_emcurso';
function salvarAud(){
  try {
    const vivos = {};
    for (const k in ui.audPorSetor)
      if (Object.keys(ui.audPorSetor[k].resp || {}).length) vivos[k] = ui.audPorSetor[k];
    ui.audPorSetor = vivos;
    const add = {};
    for (const k in ui.audAdd) if ((ui.audAdd[k]||[]).length) add[k] = ui.audAdd[k];
    ui.audAdd = add;
    if (!Object.keys(vivos).length && !Object.keys(add).length && !ui.audSetor) localStorage.removeItem(AUD_KEY);
    else localStorage.setItem(AUD_KEY, JSON.stringify({ setor: ui.audSetor, modo: ui.modo, por: vivos, add: add }));
  } catch(e){}
}
function carregarAud(){
  try {

    ui.audPorSetor = r.por || {};

}

/* O total consolidado. NUNCA é um campo -- é sempre esta função. Era
   exatamente o campo digitado da planilha que divergia da realidade. */
function consolidado(){ return consolidadoDe(db.maquinas); }
function consolidadoDe(lista){
  const por = {};
  lista.forEach(m => {
    const k = chave(m.nome) + '|' + chave(m.modelo);
    if (!por[k]) por[k] = { chave: k, nome: m.nome, modelo: m.modelo, qtd: 0, uso: 0,
      manutencao: 0, valor: 0, semPreco: 0, linhas: [] };
    por[k].qtd += Number(m.qtd)||0;
    por[k][m.situacao === 'manutencao' ? 'manutencao' : 'uso'] += Number(m.qtd)||0;
    por[k].valor += valorLinha(m);
    if (!temPreco(m)) por[k].semPreco += Number(m.qtd)||0;
    /* as linhas que formam a soma ficam junto: a mesma máquina costuma ter
       vindo de compras diferentes, em datas e fornecedores diferentes, e o
       número somado sozinho esconde justamente isso */
    por[k].linhas.push(m);
  });
  return Object.values(por).sort((a,b) => a.nome.localeCompare(b.nome,'pt-BR'));
}

function chavePreco(nome, modelo){ return chaveNome(nome) + '|' + chaveModelo(modelo); }

  const exata = PRECOS_BASE.find(x => chavePreco(x[0],x[1]) === chavePreco(nome,modelo));
  if (exata) return exata[2];
  const km = chaveModelo(modelo);

  const peloModelo = PRECOS_BASE.filter(x => chaveModelo(x[1]) === km);
  const valores = [...new Set(peloModelo.map(x => x[2]))];
  return valores.length === 1 ? valores[0] : 0;
}
function precoUnit(m){
  const p = Number(m && m.preco);
  return Number.isFinite(p) && p >= 0 ? p : 0;
}
function temPreco(m){ return precoUnit(m) > 0; }
function valorLinha(m){ return precoUnit(m) * (Number(m.qtd)||0); }
function valorLista(lista){ return lista.reduce((s,m) => s + valorLinha(m), 0); }
function semPreco(lista){ return lista.reduce((s,m) => s + (temPreco(m) ? 0 : (Number(m.qtd)||0)), 0); }
function normalizarPrecos(){
  let mudou = false;
  db.maquinas.forEach(m => {

      m.preco = p;
      m.precoFonte = p ? 'tabela-2026-09-03' : '';
      mudou = true;
    } else if (!Number.isFinite(Number(m.preco)) || Number(m.preco) < 0) {

}

/* Grupos de linhas que são a MESMA máquina escrita diferente.
   Cada grupo traz a grafia "alvo" -- a mais completa, porque quem escreveu
   "M9510 (MAKITA)" deu mais informação que quem escreveu "M9510". */
function parecidos(){
  const g = {};
  db.maquinas.forEach(m => {
    const k = chaveNome(m.nome) + '|' + chaveModelo(m.modelo);
    (g[k] = g[k] || []).push(m);
  });
  return Object.values(g).map(ms => {
    const formas = {};
    ms.forEach(m => { formas[m.nome.trim() + '\u0000' + (m.modelo||'').trim()] = [m.nome.trim(), (m.modelo||'').trim()]; });
    const lista = Object.values(formas);
    if (lista.length < 2) return null;
    /* alvo = a forma mais detalhada (modelo mais longo, depois nome) */
    const alvo = lista.slice().sort((a,b) => (b[1].length - a[1].length) || (b[0].length - a[0].length))[0];
    return { formas: lista, alvo: alvo, linhas: ms };
  }).filter(Boolean);
}

/* Padroniza a grafia SEM fundir linhas. É a distinção que importa: duas
   esmerilhadeiras iguais em setores diferentes são duas máquinas em dois
   lugares -- juntá-las apagaria a alocação e a auditoria de um dos setores
   passaria a procurar uma máquina que o sistema diz estar no outro. Só o
   texto muda; a soma do Total geral é que passa a agrupar certo. */
function padronizarGrafia(){
  const gs = parecidos();
  if (!gs.length) return;
  let n = 0;
  const mapa = {};
  gs.forEach(g => g.linhas.forEach(m => {
    if (m.nome.trim() !== g.alvo[0] || (m.modelo||'').trim() !== g.alvo[1]) {
      const k0 = chaveItem(m);
      m.nome = g.alvo[0]; m.modelo = g.alvo[1]; n++;
      if (k0 !== chaveItem(m)) mapa[k0] = chaveItem(m);
    }
  }));
  renomearHistorico(mapa);
  salvar(); render();
  toast(n + ' linha(s) padronizada(s) · nenhuma máquina foi somada ou movida');
}

/* =========================================================================
   SUGESTÃO DE ITEM JÁ CADASTRADO
   padronizarGrafia() conserta DEPOIS, e só pega o que já cai na mesma chave.
   "MASCARA DE SOLDA" e "MASCARA SOLDA" têm chaves diferentes: viram dois
   itens no Total geral e a auditoria passa a procurar duas coisas onde só
   existe uma. O conserto barato é antes: enquanto se digita, mostrar o que
   já existe com nome parecido e deixar aproveitar a mesma grafia.
   ========================================================================= */

/* Itens distintos já cadastrados, com onde estão. Ao EDITAR uma máquina ela
   sai da lista: senão o próprio item apareceria como sugestão de si mesmo. */
function catalogoItens(exceto){
  const por = {};
  db.maquinas.forEach(m => {
    if (exceto && m.id === exceto) return;
    const k = chaveNome(m.nome) + '|' + chaveModelo(m.modelo);
    if (!por[k]) por[k] = { nome: (m.nome||'').trim(), modelo: (m.modelo||'').trim(), qtd: 0, setores: {} };
    por[k].qtd += Number(m.qtd)||0;
    const s = m.situacao === 'manutencao' ? 'Manutenção' : ((setorPorId(m.setor)||{}).nome || '');
    if (s) por[k].setores[s] = 1;
  });
  return Object.values(por).map(x => {
    const ls = Object.keys(x.setores);
    x.onde = ls.length > 2 ? ls.length + ' setores' : (ls.join(', ') || 'sem setor');
    return x;
  });
}

/* Dice sobre bigramas: mede erro de digitação e palavra a mais ou a menos,
   que é como as divergências aparecem de verdade ("MASCARA SOLDA" x
   "MASCARA DE SOLDA", "ESMERILHADERIA" x "ESMERILHADEIRA"). */
function bigramas(s){
  const t = ' ' + s + ' ', r = [];
  for (let i = 0; i < t.length - 1; i++) r.push(t.slice(i, i + 2));
  return r;
}
function semelhanca(a, b){
  if (!a || !b) return 0;
  if (a === b) return 1;
  const A = bigramas(a), B = bigramas(b);
  const sobra = B.slice();
  let bate = 0;
  A.forEach(g => { const i = sobra.indexOf(g); if (i >= 0) { sobra.splice(i, 1); bate++; } });
  return 2 * bate / (A.length + B.length);
}

/* Só bigrama não bastava: "MASCARA DE SOLDAR" contra "MASCARA SOLDA" dava
   0,76 e passava batido, que é justamente a divergência que cria o item
   duplicado. Comparando PALAVRA a palavra -- sem "de/da/do", e aceitando a
   palavra com erro de digitação -- os dois viram a mesma coisa, enquanto
   "PARAFUSADEIRA 12V" e "PARAFUSADEIRA 18V" continuam separados, porque o
   que difere ali é uma palavra inteira e não a grafia dela. */
const PALAVRINHA = { DE:1, DA:1, DO:1, DAS:1, DOS:1, E:1, COM:1, PARA:1, P:1, A:1, O:1 };
function palavras(s){
  return String(s||'').split(/[^0-9A-Za-zÀ-ÿ]+/).map(chave).filter(t => t && !PALAVRINHA[t]);
}
/* Os números que aparecem no nome, em ordem: "12V", "400L", "3 AH". */
function numerosDe(s){
  return palavras(s).filter(t => /[0-9]/.test(t)).sort().join(',');
}
function simPalavras(a, b){
  const A = palavras(a), B = palavras(b);
  if (!A.length || !B.length) return 0;
  const sobra = B.slice();
  let soma = 0;
  A.forEach(t => {
    let melhor = 0, iM = -1;
    sobra.forEach((u, i) => { const s = t === u ? 1 : semelhanca(t, u); if (s > melhor) { melhor = s; iM = i; } });
    /* 0,72 e nao 0,8: "SOLDAR" contra "SOLDA" dá 0,77, e é exatamente o tipo
       de diferença que se quer pegar. "12V" contra "18V" fica em 0,50 e
       continua de fora. */
    if (melhor >= 0.72) { soma += melhor; sobra.splice(iM, 1); }
  });
  return 2 * soma / (A.length + B.length);
}

/* Enquanto se digita, o começo do nome vale mais que a semelhança geral:
   com "MASC" na tela ainda não há bigrama suficiente para reconhecer
   "MASCARA DE SOLDA", mas o prefixo já identifica.
   O 1,00 fica reservado para a MESMA chave -- é o que separa "já é este
   item" de "escrito de outro jeito", que precisa de confirmação. */
function sugestoesItem(txt, max, exceto){
  const k = chaveNome(txt);
  if (k.length < 3) return [];
  return catalogoItens(exceto).map(it => {
    const ki = chaveNome(it.nome);
    let s;
    if (ki === k) s = 1;
    else if (ki.indexOf(k) === 0) s = 0.95;
    else s = Math.min(0.99, Math.max(semelhanca(k, ki), simPalavras(txt, it.nome),
                      (ki.indexOf(k) >= 0 || k.indexOf(ki) >= 0) ? 0.85 : 0));
    /* "PARAFUSADEIRA 12V" e "PARAFUSADEIRA 18V" diferem por um caractere e o
       bigrama as dava como iguais. Quando os DOIS lados trazem número e os
       números não batem, são medidas diferentes -- continua aparecendo como
       sugestão, mas não pergunta na hora de salvar. */
    const na = numerosDe(txt), nb = numerosDe(it.nome);
    if (s < 1 && na && nb && na !== nb) s = Math.min(s, 0.7);
    return { s: s, nome: it.nome, modelo: it.modelo, qtd: it.qtd, onde: it.onde };
  }).filter(x => x.s >= 0.58)
    .sort((a, b) => (b.s - a.s) || (b.qtd - a.qtd))
    .slice(0, max || 5);
}

let _sug = [];
function htmlSugestoes(txt, idNome, idMod, idCaixa, exceto){
  _sug = sugestoesItem(txt, 5, exceto);
  if (!_sug.length) return '';
  const arg = i => i + ",'" + idNome + "','" + idMod + "','" + idCaixa + "'";
  return '<div class="sug"><div class="sug-t">' +
    (_sug[0].s >= 1 ? 'Este item já está cadastrado — use a mesma grafia para não duplicar'
                    : 'Já existe algo parecido — toque para aproveitar o nome') + '</div>' +
    _sug.map((x, i) => '<button type="button" class="sug-i" onclick="usarSugestao(' + arg(i) + ')">' +
      '<b>' + esc(x.nome) + '</b><span>' + esc(x.modelo || 'sem modelo') + '</span>' +
      '<i>' + x.qtd + ' pç · ' + esc(x.onde) + '</i></button>').join('') +
    '</div>';
}
function pintarSug(idNome, idMod, idCaixa, exceto){
  const n = $(idNome), cx = $(idCaixa);
  if (n && cx) cx.innerHTML = htmlSugestoes(n.value, idNome, idMod, idCaixa, exceto);
}
function usarSugestao(i, idNome, idMod, idCaixa){
  const x = _sug[i]; if (!x) return;
  const n = $(idNome); if (n) n.value = x.nome;
  const md = $(idMod); if (md) md.value = x.modelo || '';
  /* audForm não é lido do DOM: o formulário da auditoria guarda o texto no
     ui, então o clique precisa atualizar os dois lados. */
  if (ui.audForm && idNome === 'audNome') { ui.audForm.nome = x.nome; ui.audForm.modelo = x.modelo || ''; }
  const cx = $(idCaixa); if (cx) cx.innerHTML = '';
}
function ligarSugestoes(idNome, idMod, idCaixa, exceto){
  const n = $(idNome); if (!n) return;
  const f = () => pintarSug(idNome, idMod, idCaixa, exceto);
  n.addEventListener('input', f);
  n.addEventListener('focus', f);
}

/* ---------- última barreira antes de gravar ----------
   O ITEM É NOME + MODELO, e era só o nome que passava por aqui. Dava a
   contradição que o Everton viu: a caixa dizia "Este item já está cadastrado"
   e mesmo assim o cadastro criava um item novo, porque o modelo tinha sido
   escrito de outro jeito -- ou deixado em branco.

   Medido no inventário real, cadastrando ESMERILHADEIRA 5" que já existe com
   GA5010 (MAKITA):

       modelo "GA5010"          -> reconhecia, não duplicava   (certo)
       modelo "GA 5010 MAKITA"  -> dizia "já cadastrado" e DUPLICAVA
       modelo em branco         -> dizia "já cadastrado" e DUPLICAVA
       modelo "GA5030 (MAKITA)" -> duplicava calado            (é outra máquina,
                                                                mas tinha de avisar)

   Agora o modelo entra na conta. Devolve o MODELO a gravar (que pode ser o já
   cadastrado, quando ele deixa em branco e confirma) ou null para não gravar.
   Nada aqui BLOQUEIA: duas máquinas de nome próximo podem mesmo ser coisas
   diferentes, e quem está cadastrando sabe algo que o sistema não sabe. */

/* Modelos já cadastrados sob este nome, na grafia em que foram escritos. */
function modelosDe(nome, exceto){
  const k = chaveNome(nome), por = {};
  db.maquinas.forEach(m => {
    if (exceto && m.id === exceto) return;
    if (chaveNome(m.nome) !== k) return;
    const md = (m.modelo || '').trim();
    if (md) por[chaveModelo(md)] = md;
  });
  return Object.values(por);
}
function temONome(nome, exceto){
  const k = chaveNome(nome);
  return db.maquinas.some(m => (!exceto || m.id !== exceto) && chaveNome(m.nome) === k);
}
function confereDuplicata(nome, modelo, exceto){
  modelo = String(modelo || '').trim();
  const km = chaveModelo(modelo);

  if (temONome(nome, exceto)) {
    const jaTem = modelosDe(nome, exceto);
    /* mesmo nome, mesmo modelo: é outra unidade da MESMA máquina, em outro
       setor. É o caso normal e não se pergunta nada. */
    if (jaTem.some(md => chaveModelo(md) === km)) return modelo;
    if (!jaTem.length) return modelo;          /* ninguém tinha modelo ainda */

    if (!modelo) {
      /* Em branco é o erro mais comum e o mais caro: sem modelo o item vira
         uma linha à parte no Total geral. Um modelo só cadastrado -> oferece
         adotar; vários -> manda escolher. */
      if (jaTem.length === 1) {
        if (confirm('"' + nome + '" já está cadastrada com o modelo ' + jaTem[0] + '.\n\n' +
            'É a mesma máquina?\n\n' +
            'OK — cadastra com o modelo ' + jaTem[0] + ' (soma junto no Total geral)\n' +
            'Cancelar — volta para você digitar outro modelo'))
          return jaTem[0];
        return null;
      }
      return confirm('"' + nome + '" já tem ' + jaTem.length + ' modelos cadastrados: ' +
        jaTem.join(', ') + '.\n\n' +
        'Sem informar o modelo, esta vira uma linha separada no Total geral e a ' +
        'auditoria passa a procurar um item a mais.\n\n' +
        'Cadastrar assim mesmo, sem modelo?') ? '' : null;
    }
    /* O MESMO modelo escrito de outro jeito: "GA 5010 MAKITA" contra
       "GA5010 (MAKITA)". Bigrama não pega -- a marca solta acrescenta seis
       letras e derruba a nota para 0,60. O que identifica é o começo: um dos
       dois é o início do outro. "GA5010" x "GA5030" não são, e continuam
       sendo tratados como máquinas diferentes, que é o certo. */
    const igualzinho = jaTem.find(md => {
      const k2 = chaveModelo(md);
      if (!k2 || !km || k2.length < 4 || km.length < 4) return false;
      return k2.indexOf(km) === 0 || km.indexOf(k2) === 0 || semelhanca(k2, km) >= 0.85;
    });
    if (igualzinho) {
      return confirm('"' + nome + '" já está cadastrada com o modelo ' + igualzinho + '.\n\n' +
        'Você digitou ' + modelo + ' — parece o mesmo modelo escrito de outro jeito.\n\n' +
        'OK — usa ' + igualzinho + ' e soma junto no Total geral\n' +
        'Cancelar — volta para você conferir') ? igualzinho : null;
    }
    /* modelo novo de verdade: pode ser outra máquina (GA5010 x GA5030), então
       pergunta em vez de impedir */
    return confirm('Já existe "' + nome + '" com o modelo ' + jaTem.join(', ') + '.\n\n' +
      'Cadastrando com o modelo ' + modelo + ' o controle trata as duas como itens ' +
      'diferentes: o Total geral soma separado e a auditoria procura as duas.\n\n' +
      'É outro modelo mesmo?') ? modelo : null;
  }

  const p = sugestoesItem(nome, 1, exceto)[0];
  if (!p || p.s >= 1 || p.s < 0.8) return modelo;
  return confirm('Já existe "' + p.nome + '" no sistema.\n\n' +
    'Cadastrando como "' + nome + '" o controle passa a tratar os dois como itens ' +
    'diferentes: o Total geral soma separado e a auditoria procura os dois.\n\n' +
    'Continuar mesmo assim?') ? modelo : null;
}

/* ---------- unificar o que já entrou duplicado ----------
   A sugestão ao digitar evita duplicata nova; não desfaz a que já existe.
   parecidos() só junta o que cai na MESMA chave, então "MASCARA SOLDA" e
   "MASCARA DE SOLDA" ficam de fora justamente por serem o caso a resolver.
   Aqui os nomes próximos são agrupados e a decisão é de quem opera: o
   sistema não tem como saber sozinho se são a mesma máquina. */

/* Fica no localStorage, e não no db: o listener da nuvem reconstrói o db
   com {setores, maquinas, auditorias, iniciado} e descartaria esta lista.
   Consequência assumida: a dispensa vale por aparelho. */
const UNI_KEY = STORE_KEY + '_naoune';
function naoUnir(){ try { return JSON.parse(localStorage.getItem(UNI_KEY) || '[]'); } catch(e){ return []; } }

function gruposSemelhantes(){
  const por = {};
  db.maquinas.forEach(m => {
    const k = chaveNome(m.nome) + '|' + chaveModelo(m.modelo);
    if (!por[k]) por[k] = { k: k, nome: (m.nome||'').trim(), modelo: (m.modelo||'').trim(), qtd: 0, setores: {} };
    por[k].qtd += Number(m.qtd)||0;
    const s = m.situacao === 'manutencao' ? 'Manutenção' : ((setorPorId(m.setor)||{}).nome || '');
    if (s) por[k].setores[s] = 1;
  });
  /* o mais usado primeiro: costuma ser a grafia boa, e é quem ancora o grupo */
  const itens = Object.values(por).sort((a, b) => (b.qtd - a.qtd) || (b.nome.length - a.nome.length));

  /* Aqui a regra do número é mais dura que na sugestão ao digitar: os dois
     lados têm de ter o MESMO número, inclusive nenhum. Sem isso
     "ESMERILHADEIRA" casava com a de 5" e com a de 9", e o grupo saía com
     as três juntas -- ferramentas diferentes. */
  const parecidoCom = (A, B) => {
    if (chaveNome(A.nome) === chaveNome(B.nome)) return false;   // parecidos() resolve sozinho
    if (numerosDe(A.nome) !== numerosDe(B.nome)) return false;
    return Math.max(semelhanca(chaveNome(A.nome), chaveNome(B.nome)),
                    simPalavras(A.nome, B.nome)) >= 0.8;
  };

  /* Sem transitividade: um item só entra se for parecido com TODOS os que
     já estão no grupo. Encadear A~B e B~C juntaria A e C sem ninguém ter
     comparado os dois -- foi assim que as esmerilhadeiras se misturaram. */
  const usados = {}, grupos = [];
  itens.forEach(A => {
    if (usados[A.k]) return;
    const g = [A];
    itens.forEach(B => {
      if (usados[B.k] || B.k === A.k) return;
      if (g.every(C => parecidoCom(C, B))) g.push(B);
    });
    if (g.length > 1) { g.forEach(x => usados[x.k] = 1); grupos.push(g); }
  });
  const ign = naoUnir();
  return grupos.map(l => ({ sig: l.map(x => x.k).sort().join('~'), itens: l }))
               .filter(x => ign.indexOf(x.sig) < 0);
}

/* Como padronizarGrafia: muda SÓ o texto. Fundir as linhas apagaria a
   alocação -- duas máscaras em dois setores são duas máquinas em dois
   lugares, e a auditoria de um deles passaria a procurar o que o sistema
   diz estar no outro. */
function unificarGrupo(sig, kAlvo){
  const g = gruposSemelhantes().find(x => x.sig === sig); if (!g) return;
  const alvo = g.itens.find(x => x.k === kAlvo); if (!alvo) return;
  const outros = g.itens.filter(x => x.k !== kAlvo);
  const rot = x => x.nome + (x.modelo ? ' · ' + x.modelo : '') + ' (' + x.qtd + ' pç)';
  if (!confirm('Passar tudo para "' + alvo.nome + (alvo.modelo ? ' · ' + alvo.modelo : '') + '"?\n\n' +
      outros.map(x => '· ' + rot(x)).join('\n') +
      '\n\nSó o texto muda: nenhuma máquina é somada nem sai do setor.')) return;
  const alvos = {}; outros.forEach(x => alvos[x.k] = 1);
  let n = 0;
  const mapa = {};
  db.maquinas.forEach(m => {
    const k = chaveNome(m.nome) + '|' + chaveModelo(m.modelo);
    if (alvos[k]) { const k0 = chaveItem(m); m.nome = alvo.nome; m.modelo = alvo.modelo; n++; if (k0 !== chaveItem(m)) mapa[k0] = chaveItem(m); }
  });
  renomearHistorico(mapa);
  salvar(); render();
  toast(n + ' linha(s) passaram a se chamar ' + alvo.nome);
}
function ignorarGrupo(sig){
  const l = naoUnir();
  if (l.indexOf(sig) < 0) l.push(sig);
  try { localStorage.setItem(UNI_KEY, JSON.stringify(l)); } catch(e){}
  render(); toast('Não sugiro mais esse par neste aparelho');
}

/* ---------- é celular / é auditoria? ---------- */
/* Sem user-agent: ele mente (e navegador de tablet finge ser desktop). O que
   importa é largura útil e se o ponteiro é grosso -- ou seja, um dedo. */
function ehMobile(){
  const estreito = window.innerWidth <= 760;
  let dedo = false;
  try { dedo = window.matchMedia('(pointer: coarse)').matches; } catch(e){}
  return estreito || (dedo && window.innerWidth <= 1100);
}
/* ui.modo guarda só a ESCOLHA: 'auto' (ninguém escolheu ainda), 'auditoria'
   ou 'normal'. Enquanto for 'auto' quem decide é o aparelho; assim que a
   pessoa toca no botão, a escolha dela manda e o giro de tela não a
   desfaz. Misturar as duas coisas na mesma variável era o que deixava o
   resize sem efeito no celular. */
function emAuditoria(){
  if (ui.modo === 'auditoria') return true;
  if (ui.modo === 'normal') return false;
  return ehMobile();
}
function alternarModo(){
  const indo = !emAuditoria();
  ui.modo = indo ? 'auditoria' : 'normal';
  /* entrar na auditoria volta para a lista de setores, mas NÃO apaga o que já
     estava conferido -- isso fica guardado por setor e volta ao abrir cada um */
  if (indo) { ui.aba = 'auditoria'; ui.audSetor = null; ui.audResp = {}; }
  else if (ui.aba === 'auditoria') ui.aba = 'setores';
  render();
}

/* ---------- render ---------- */
function render(){
  /* abas que viraram parte de outra: quem estava nelas (ou tem o atalho
     guardado) cai no lugar novo, já no filtro certo */
  const legado = { total: 'inventario', valoracao: 'inventario', garantia: 'inventario', relatorio: 'conferencias' };
  if (legado[ui.aba]) {
    if (ui.aba === 'garantia') ui.fSit = 'garantia';
    if (ui.aba === 'relatorio') ui.confSub = 'folha';
    ui.aba = legado[ui.aba];
  }
  $('btModo').textContent = emAuditoria() ? 'Sair da auditoria' : 'Auditoria';
  $('btModo').className = 'btn sm' + (emAuditoria() ? ' primary' : '');
  renderCards(); renderTabs(); renderBarra(); renderConteudo(); renderFicha();
}
function renderConteudo(){
  const c = $('conteudo');
  if (ui.aba === 'auditoria') c.innerHTML = htmlAuditoria();
  else if (ui.aba === 'estoque') c.innerHTML = htmlEstoqueInterno();
  else if (ui.aba === 'manutencao') c.innerHTML = htmlManutencao();
  else if (ui.aba === 'inventario') c.innerHTML = htmlInventario();
  else if (ui.aba === 'conferencias') c.innerHTML = htmlConferenciasAba();
  else c.innerHTML = htmlSetores();
}

function renderCards(){
  const uso = pecas(daSituacao('uso'));
  const mnt = pecas(daSituacao('manutencao'));
  const semSetor = db.maquinas.filter(m => m.situacao === 'uso' && !setorPorId(m.setor));
  const el = $('cards');

  /* Em auditoria os quatro blocos viram UMA linha. Eles ocupavam a tela
     inteira do celular: o auditor rolava quatro cartões antes de ver a
     primeira máquina, e nenhum daqueles números ajuda a conferir uma
     prateleira. O que serve ali é a lista. */
  if (emAuditoria()) {
